/* ======================================================================
   MÓDULO ANÁLISE AUTOMÁTICA
   Consome Nexus.filteredData (já acumulado de múltiplos relatórios da
   mesma garagem + filtro de período/dias ativo) e produz um resumo diário
   simples — 1 linha por dia: receita, volume, ticket médio, permanência
   média e cancelamentos — que serve de base para comparações automáticas
   (melhor/pior dia da semana, tendência mês a mês, padrão sazonal
   recorrente). Reaproveita a mesma regra de cancelamento "real" do Módulo
   Cancelados (exclui baixas automáticas ADMIN/USUÁRIO AUTOMÁTICO).
   ====================================================================== */
const ModuloAnaliseAutomatica = {
  id: 'analise-automatica',
  nome: 'Análise Automática',
  icon: '🧠',

  // ---- Estado do Nexus Intelligence Engine ----
  abaAtiva: 'automatica', // 'automatica' | 'comparativo'
  // Comparativo: dois períodos LIVRES (não precisam ser mês fechado),
  // com dia da semana compartilhado entre os dois — sempre sobre o
  // dataset completo, independente do filtro global da tela.
  _comparativo: {
    atual: { inicio: null, fim: null },
    base:  { inicio: null, fim: null },
    weekdays: new Set([0,1,2,3,4,5,6]),
    inicializado: false,
  },
  LIMIAR_EVENTO_PCT: 0.1, // variação (%) de receita média/dia acima da qual o evento é sinalizado como relevante — reduzido a 05/08/2026 (decisão de produto: sensibilidade máxima, decisão de aceitar/ignorar fica com supervisor/gestor)

  // Intl.DateTimeFormat é caro pra instanciar — criar UM formatador e
  // reusá-lo (.format()) é ~40x mais rápido do que chamar
  // date.toLocaleDateString(...)/toLocaleString(...) com timeZone a cada
  // linha. Isso importa muito aqui: essas conversões rodam para cada
  // ticket, em vários pontos do módulo, a cada render.
  _fmtISO:  new Intl.DateTimeFormat('sv-SE', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}),
  _fmtHora: new Intl.DateTimeFormat('en-US', {timeZone:'America/Sao_Paulo', hour:'2-digit', hour12:false}),
  _isoBRT(ts){ return this._fmtISO.format(ts); },

  renderFilters(container){ Nexus.renderFiltrosPadrao(container, false); },

  // Agrega pagos + cancelados (regra "real") num mapa por dia (chave ISO,
  // estável e ordenável — 'YYYY-MM-DD' em BRT). 1 linha por dia único
  // presente no conjunto filtrado.
  _agregarPorDia(pagos, cancelados){
    const mapa = new Map();
    const getDia = (d) => {
      const iso = this._isoBRT(d.timestampPagamento);
      if(!mapa.has(iso)){
        mapa.set(iso, {
          iso, dataStr: d.dataPagamentoStr, diaSemana: d.diaPagamento,
          receita: 0, volume: 0, permSoma: 0, cancelamentos: 0,
        });
      }
      return mapa.get(iso);
    };
    pagos.forEach(d=>{
      const dia = getDia(d);
      dia.receita  += d.valorPago;
      dia.volume   += 1;
      dia.permSoma += d.permanenciaMin;
    });
    cancelados.forEach(d=>{
      getDia(d).cancelamentos += 1;
    });
    return [...mapa.values()]
      .map(d => ({
        ...d,
        ticketMedio:   d.volume ? d.receita / d.volume : 0,
        permanenciaMedia: d.volume ? d.permSoma / d.volume : 0,
      }))
      .sort((a,b) => a.iso.localeCompare(b.iso));
  },

  // Gera observações automáticas (texto) a partir da série diária já
  // agregada. Cada bloco é independente e só entra na lista se houver
  // dados suficientes para uma comparação minimamente confiável.
  _gerarInsights(linhas){
    const insights = [];
    if(linhas.length < 2) return insights;

    const NOMES_DIA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // --- Dia da semana mais forte / mais fraco (média de receita por dia) ---
    const porSemana = {};
    linhas.forEach(d=>{
      if(!porSemana[d.diaSemana]) porSemana[d.diaSemana] = { receita:0, dias:0 };
      porSemana[d.diaSemana].receita += d.receita;
      porSemana[d.diaSemana].dias    += 1;
    });
    const semanaArr = Object.entries(porSemana).map(([k,v])=>({
      dia: parseInt(k), nome: NOMES_DIA[k], receitaMedia: v.receita / v.dias,
    }));
    if(semanaArr.length >= 2){
      const mediaGeral = semanaArr.reduce((s,w)=>s+w.receitaMedia,0) / semanaArr.length;
      const melhor = [...semanaArr].sort((a,b)=>b.receitaMedia-a.receitaMedia)[0];
      const pior   = [...semanaArr].sort((a,b)=>a.receitaMedia-b.receitaMedia)[0];
      if(melhor.dia !== pior.dia){
        const diffMelhor = mediaGeral ? (melhor.receitaMedia/mediaGeral - 1)*100 : 0;
        const diffPior   = mediaGeral ? (1 - pior.receitaMedia/mediaGeral)*100 : 0;
        insights.push(`📈 <strong>${melhor.nome}</strong> é o dia mais forte, com receita média de ${fmtR(melhor.receitaMedia)}${diffMelhor>1?` (${diffMelhor.toFixed(0)}% acima da média)`:''}.`);
        insights.push(`📉 <strong>${pior.nome}</strong> é o dia mais fraco, com receita média de ${fmtR(pior.receitaMedia)}${diffPior>1?` (${diffPior.toFixed(0)}% abaixo da média)`:''}.`);
      }
    }

    // --- Tendência mês a mês (maior alta / maior queda no período filtrado) ---
    const porMes = new Map(); // 'YYYY-MM' -> {receita}
    linhas.forEach(d=>{
      const chave = d.iso.slice(0,7);
      if(!porMes.has(chave)) porMes.set(chave, { receita:0 });
      porMes.get(chave).receita += d.receita;
    });
    const mesesArr = [...porMes.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
    const nomeMes = chave => {
      const [y,m] = chave.split('-');
      return `${NOMES_MES[parseInt(m)-1]}/${y}`;
    };
    if(mesesArr.length >= 2){
      let maiorAlta = null, maiorQueda = null;
      for(let i=1;i<mesesArr.length;i++){
        const [chaveAtual, atual] = mesesArr[i];
        const [, anterior] = mesesArr[i-1];
        if(anterior.receita <= 0) continue;
        const variacao = (atual.receita/anterior.receita - 1) * 100;
        if(!maiorAlta  || variacao > maiorAlta.variacao)  maiorAlta  = { chave: chaveAtual, variacao };
        if(!maiorQueda || variacao < maiorQueda.variacao) maiorQueda = { chave: chaveAtual, variacao };
      }
      if(maiorAlta && maiorAlta.variacao > 0){
        insights.push(`🚀 <strong>${nomeMes(maiorAlta.chave)}</strong> teve o maior crescimento do período, ${maiorAlta.variacao.toFixed(0)}% acima do mês anterior.`);
      }
      if(maiorQueda && maiorQueda.variacao < 0 && maiorQueda.chave !== (maiorAlta && maiorAlta.chave)){
        insights.push(`⚠️ <strong>${nomeMes(maiorQueda.chave)}</strong> teve a maior queda do período, ${Math.abs(maiorQueda.variacao).toFixed(0)}% abaixo do mês anterior.`);
      }
    }

    // --- Padrão histórico recorrente: mesmo mês-calendário em anos diferentes
    // sempre sobe (ou sempre cai) em relação ao mês anterior (ex: "dezembro
    // sempre cresce"). Só entra na lista com pelo menos 2 ocorrências
    // comparáveis do mesmo mês-calendário.
    const porNumeroMes = new Map(); // '01'..'12' -> [{ano, receita}]
    mesesArr.forEach(([chave, dados])=>{
      const [ano, mes] = chave.split('-');
      if(!porNumeroMes.has(mes)) porNumeroMes.set(mes, []);
      porNumeroMes.get(mes).push({ ano, receita: dados.receita });
    });
    porNumeroMes.forEach((ocorrencias, mes)=>{
      if(ocorrencias.length < 2) return;
      const variacoes = [];
      ocorrencias.forEach(oc=>{
        const mesAnteriorNum   = String(((parseInt(mes)+10)%12)+1).padStart(2,'0');
        const anoMesAnterior   = mesAnteriorNum === '12' ? String(parseInt(oc.ano)-1) : oc.ano;
        const anterior = porMes.get(`${anoMesAnterior}-${mesAnteriorNum}`);
        if(anterior && anterior.receita > 0) variacoes.push((oc.receita/anterior.receita - 1) * 100);
      });
      if(variacoes.length < 2) return;
      const media = variacoes.reduce((s,v)=>s+v,0) / variacoes.length;
      if(variacoes.every(v=>v>0)){
        insights.push(`🔁 <strong>${NOMES_MES[parseInt(mes)-1]}</strong> cresceu em relação ao mês anterior em todos os ${variacoes.length} anos analisados no período (crescimento médio de ${media.toFixed(0)}%).`);
      } else if(variacoes.every(v=>v<0)){
        insights.push(`🔁 <strong>${NOMES_MES[parseInt(mes)-1]}</strong> caiu em relação ao mês anterior em todos os ${variacoes.length} anos analisados no período (queda média de ${Math.abs(media).toFixed(0)}%).`);
      }
    });

    // --- Cancelamentos fora do padrão ---
    const totalCancel = linhas.reduce((s,d)=>s+d.cancelamentos,0);
    const totalVolume = linhas.reduce((s,d)=>s+d.volume,0);
    if(totalVolume > 0 && totalCancel > 0){
      const taxa = (totalCancel/totalVolume)*100;
      if(taxa > 5){
        insights.push(`🚫 A taxa de cancelamento no período está em ${taxa.toFixed(1)}%, acima do ideal — vale investigar operadores ou horários concentradores.`);
      }
    }

    return insights;
  },

  // Top 3 melhores + 3 piores dias por receita, cada um comparado com a
  // média diária do período (só considera dias com volume>0 — dias sem
  // nenhum pagamento não entram no ranking nem distorcem a média).
  _destaques(linhas){
    const diasComVolume = linhas.filter(d => d.volume > 0);
    if(diasComVolume.length === 0) return { media: 0, melhores: [], piores: [] };

    const media = diasComVolume.reduce((s,d)=>s+d.receita,0) / diasComVolume.length;
    const ordenados = [...diasComVolume].sort((a,b) => b.receita - a.receita);

    const comDiff = d => ({ ...d, diffPct: media ? ((d.receita/media - 1) * 100) : 0 });

    const melhores = ordenados.slice(0, 3).map(comDiff);
    const piores = ordenados.length > 3
      ? ordenados.slice(-3).reverse().map(comDiff) // do "menos pior" pro pior, sem repetir os já listados em melhores
      : [];
    // Evita duplicar dias quando há poucos dias no período (ex: 4-5 dias só)
    const idsMelhores = new Set(melhores.map(d=>d.iso));
    return { media, melhores, piores: piores.filter(d => !idsMelhores.has(d.iso)) };
  },

  // Divide o período filtrado (apenas dias com volume>0, em ordem cronológica)
  // em duas metades e compara Volume, Permanência Média e Ticket Médio entre
  // elas — isolando se uma variação de receita veio de mais carros ou de
  // carros ficando/pagando mais tempo. Requer um mínimo de dias pra a divisão
  // fazer sentido estatístico.
  _decomposicaoTendencia(linhas){
    const dias = linhas.filter(d => d.volume > 0).sort((a,b) => a.iso.localeCompare(b.iso));
    if(dias.length < 6) return null;

    const meio = Math.floor(dias.length / 2);
    const agregarBloco = bloco => {
      const volume  = bloco.reduce((s,d)=>s+d.volume,0);
      const receita = bloco.reduce((s,d)=>s+d.receita,0);
      const permSoma = bloco.reduce((s,d)=>s+d.permSoma,0);
      return {
        inicio: bloco[0].dataStr, fim: bloco[bloco.length-1].dataStr,
        volume, receita,
        volumeMedioDia: volume / bloco.length,
        receitaMediaDia: receita / bloco.length,
        ticketMedio: volume ? receita/volume : 0,
        permanenciaMedia: volume ? permSoma/volume : 0,
      };
    };
    const a = agregarBloco(dias.slice(0, meio));
    const b = agregarBloco(dias.slice(meio));
    const variacao = (novo, velho) => velho ? ((novo/velho - 1) * 100) : 0;

    return {
      periodoA: a, periodoB: b,
      varVolume: variacao(b.volumeMedioDia, a.volumeMedioDia),
      varTicket: variacao(b.ticketMedio, a.ticketMedio),
      varPermanencia: variacao(b.permanenciaMedia, a.permanenciaMedia),
      varReceita: variacao(b.receitaMediaDia, a.receitaMediaDia),
    };
  },

  // Frase interpretativa: aponta se o fator dominante da variação de receita
  // foi o volume de veículos ou a permanência média (que eleva o ticket).
  _fraseDecomposicao(dec){
    if(!dec) return null;
    const abs = Math.abs;
    const direcao = dec.varReceita >= 0 ? 'cresceu' : 'caiu';
    const sinal = v => (v>=0?'+':'')+v.toFixed(0)+'%';
    if(abs(dec.varVolume) >= abs(dec.varPermanencia)){
      return `A receita média diária ${direcao} ${abs(dec.varReceita).toFixed(0)}% da primeira para a segunda metade do período. O fator principal foi o <strong>volume de veículos</strong> (${sinal(dec.varVolume)}) — a permanência média variou ${sinal(dec.varPermanencia)}.`;
    }
    return `A receita média diária ${direcao} ${abs(dec.varReceita).toFixed(0)}% da primeira para a segunda metade do período. O fator principal foi a <strong>permanência média</strong> (${sinal(dec.varPermanencia)}), que elevou o ticket médio (${sinal(dec.varTicket)}) — o volume de veículos variou ${sinal(dec.varVolume)}.`;
  },

  // Concentração de receita (Pareto): quantos dias (dos dias com volume) são
  // necessários, somando do maior para o menor, para atingir 80% da receita
  // total do período. Mede o quanto o negócio depende de poucos dias fortes.
  _concentracaoReceita(linhas){
    const dias = linhas.filter(d => d.volume > 0);
    const receitaTotal = dias.reduce((s,d)=>s+d.receita,0);
    if(dias.length === 0 || receitaTotal <= 0) return null;

    const ordenados = [...dias].sort((a,b) => b.receita - a.receita);
    let acumulado = 0, count = 0;
    for(const d of ordenados){
      acumulado += d.receita;
      count++;
      if(acumulado / receitaTotal >= 0.8) break;
    }
    return { diasNecessarios: count, totalDias: dias.length, pctDias: (count/dias.length)*100 };
  },

  // Hora do dia (BRT) a partir de um timestamp — usado para achar as faixas
  // horárias de maior movimento (baseado na hora de ENTRADA, que é o que
  // importa pra decisão de escala de equipe).
  _horaBRT(ts){
    return parseInt(this._fmtHora.format(ts), 10);
  },

  // Curva de ocupação simultânea por hora — só considera tickets com
  // entrada e saída no MESMO dia (simplificação deliberada: mensalistas e
  // pernoites distorceriam a curva de pico horário e já são tratados à
  // parte pelas regras de permanência). Cada hora do intervalo [entrada,
  // saída] soma +1 veículo "dentro do pátio" naquele dia.
  _perfilOcupacao(pagos){
    const dias = new Set();
    const ocupPorHora = Array(24).fill(0);
    pagos.forEach(d=>{
      if(!d.timestampEntrada || !d.timestampSaida || isNaN(d.timestampSaida.getTime())) return;
      const isoE = this._isoBRT(d.timestampEntrada);
      const isoS = this._isoBRT(d.timestampSaida);
      if(isoE !== isoS) return;
      const hE = this._horaBRT(d.timestampEntrada);
      const hS = this._horaBRT(d.timestampSaida);
      if(hE<0 || hS<0 || hE>23 || hS>23) return;
      dias.add(isoE);
      for(let h=hE; h<=hS && h<24; h++) ocupPorHora[h] += 1;
    });
    const nDias = dias.size || 1;
    return Array.from({length:24}, (_,h) => ({ hora:h, mediaOcupacao: ocupPorHora[h]/nDias }));
  },

  // Agente de Capacidade e Ocupação — não depende do motor de eventos,
  // olha sempre para o período filtrado na tela (mesma base da Faixa
  // Horária de Pico). Sem um campo de "vagas totais" cadastrado por
  // filial, reporta em veículos simultâneos (absoluto), não em %.
  _analistaCapacidadeOcupacao(pagos, horaTop, horaTopSaida){
    const perfil = this._perfilOcupacao(pagos);
    const pico = perfil.reduce((m,h) => h.mediaOcupacao > m.mediaOcupacao ? h : m, perfil[0]);
    if(!pico || pico.mediaOcupacao < 1){
      return { analista:'Capacidade e Ocupação', icone:'🅿️', texto:'Volume insuficiente de tickets com entrada e saída no mesmo dia para estimar ocupação simultânea neste período.' };
    }
    const horaEntradaTop = horaTop[0]?.hora;
    const horaSaidaTop   = horaTopSaida[0]?.hora;
    const gargaloEntrada = horaEntradaTop != null && Math.abs(horaEntradaTop - pico.hora) <= 1;

    const partes = [`Pico de ocupação simultânea: ~${Math.round(pico.mediaOcupacao)} veículos por volta das ${String(pico.hora).padStart(2,'0')}h.`];
    partes.push(gargaloEntrada
      ? `Coincide com o pico de entradas — risco de fila na cancela nesse horário.`
      : `Sem sobreposição relevante entre pico de ocupação e pico de entradas.`);
    if(horaSaidaTop != null){
      partes.push(`Reforçar pista/caixa entre ${String(horaEntradaTop??pico.hora).padStart(2,'0')}h–${String((horaEntradaTop??pico.hora)+1).padStart(2,'0')}h (entrada) e ${String(horaSaidaTop).padStart(2,'0')}h–${String(horaSaidaTop+1).padStart(2,'0')}h (saída) reduz o maior risco de fila.`);
    }
    return {
      analista: 'Capacidade e Ocupação', icone: '🅿️',
      texto: partes.join(' '),
      dados: { pico, horaEntradaTop, horaSaidaTop, gargaloEntrada },
    };
  },

  // Top 3 faixas horárias de maior movimento (volume de entradas), com a
  // receita associada a cada faixa.
  _faixaHoraria(pagos){
    const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
    pagos.forEach(d=>{
      const h = this._horaBRT(d.timestampEntrada);
      if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
    });
    return porHora
      .map((v,h)=>({ hora:h, ...v }))
      .filter(h=>h.volume>0)
      .sort((a,b)=>b.volume-a.volume)
      .slice(0,3);
  },

  // Mesma lógica de _faixaHoraria, mas para o horário de SAÍDA — útil pra
  // entender quando o fluxo de veículos deixando a garagem é mais intenso
  // (ex: escala de equipe na saída, filas de caixa). Só considera tickets
  // pagos com data/hora de saída registrada (nem todo ticket tem).
  _faixaHorariaSaida(pagos){
    const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
    pagos.forEach(d=>{
      if(!d.timestampSaida || isNaN(d.timestampSaida.getTime())) return;
      const h = this._horaBRT(d.timestampSaida);
      if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
    });
    return porHora
      .map((v,h)=>({ hora:h, ...v }))
      .filter(h=>h.volume>0)
      .sort((a,b)=>b.volume-a.volume)
      .slice(0,3);
  },

  // Dias que fogem do padrão estatístico (>1,5 desvio-padrão da média de
  // receita diária), excluindo os que já aparecem em "Dias em Destaque" pra
  // não repetir a mesma informação de duas formas diferentes.
  _anomalias(linhas, destaques){
    const dias = linhas.filter(d => d.volume > 0);
    if(dias.length < 6) return [];

    const media = dias.reduce((s,d)=>s+d.receita,0) / dias.length;
    const variancia = dias.reduce((s,d)=>s+Math.pow(d.receita-media,2),0) / dias.length;
    const desvio = Math.sqrt(variancia);
    if(desvio === 0) return [];

    const jaDestacados = new Set([...destaques.melhores, ...destaques.piores].map(d=>d.iso));
    return dias
      .map(d => ({ ...d, z: (d.receita-media)/desvio }))
      .filter(d => Math.abs(d.z) >= 1.5 && !jaDestacados.has(d.iso))
      .sort((a,b) => Math.abs(b.z)-Math.abs(a.z))
      .slice(0,3);
  },

  // Converte as anomalias detectadas em frases no mesmo formato dos demais
  // insights, pra entrarem juntas na lista de Observações Automáticas.
  _anomaliasTexto(linhas, destaques){
    return this._anomalias(linhas, destaques).map(d => {
      const direcao = d.z >= 0 ? 'acima' : 'abaixo';
      return `⚡ <strong>${esc(d.dataStr)}</strong> fugiu do padrão: receita de ${fmtR(d.receita)}, ${Math.abs(d.z).toFixed(1)}x o desvio-padrão ${direcao} da média — vale conferir o que aconteceu nesse dia.`;
    });
  },

  /* ================== NEXUS INTELLIGENCE ENGINE ==================
     Conselho de analistas: primeiro detecta um EVENTO (variação de receita
     entre duas janelas comparáveis), e só então aciona cada analista para
     investigar esse mesmo evento sob um ângulo específico. O Analista
     Executivo sintetiza os vereditos num resumo — não gera texto solto.
     Abaixo do limiar (LIMIAR_EVENTO_PCT), o conselho não é acionado e o
     módulo segue mostrando apenas o resumo padrão (painéis existentes).
     ================================================================== */

  _isoDoPago(d){
    return this._isoBRT(d.timestampPagamento);
  },

  // Agrega um conjunto de dias (linhas já processadas por _agregarPorDia) em
  // métricas médias — usado para comparar duas janelas de forma homogênea,
  // independente de quantos dias cada uma tenha.
  _agregarJanela(dias){
    const n = dias.length;
    if(!n) return null;
    const receita        = dias.reduce((s,d)=>s+d.receita,0);
    const volume         = dias.reduce((s,d)=>s+d.volume,0);
    const permSoma       = dias.reduce((s,d)=>s+d.permSoma,0);
    const cancelamentos  = dias.reduce((s,d)=>s+d.cancelamentos,0);
    return {
      dias, nDias: n,
      inicio: dias[0].dataStr, fim: dias[n-1].dataStr,
      receitaMediaDia:  receita / n,
      volumeMedioDia:   volume / n,
      ticketMedio:      volume ? receita / volume : 0,
      permanenciaMedia: volume ? permSoma / volume : 0,
      cancelamentos,
      taxaCancelamento: (volume + cancelamentos) > 0 ? (cancelamentos / (volume + cancelamentos)) * 100 : 0,
    };
  },

  // Dataset completo, ignorando os filtros globais ativos (data/dia da
  // semana) — a comparação por mês é sempre feita sobre o relatório
  // inteiro, não sobre o recorte filtrado na tela. Calculada UMA vez por
  // render (o chamador guarda o resultado e reaproveita), nunca recalculada
  // dentro de _construirEvento/_mesesDisponiveis.
  _linhasCompletas(){
    const pagos = Nexus.rawData.filter(d => d.isPago);
    const cancelados = Nexus.rawData.filter(d =>
      d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
    );
    return this._agregarPorDia(pagos, cancelados);
  },

  // Meses disponíveis no dataset completo — usado só pra sugerir defaults
  // sensatos no filtro do Comparativo (não é mais uma opção de UI).
  _mesesDisponiveis(linhasCompletas){
    const set = new Set(linhasCompletas.filter(d=>d.volume>0).map(d=>d.iso.slice(0,7)));
    return Array.from(set).sort().reverse();
  },

  // Pré-preenche o filtro do Comparativo com os 2 meses mais recentes do
  // relatório completo, só na primeira vez (depois disso, mesmo que o
  // usuário limpe os campos, não volta a forçar um valor sozinho).
  _garantirDefaultsComparativo(linhasCompletas){
    const c = this._comparativo;
    if(c.inicializado) return;
    c.inicializado = true;
    const meses = this._mesesDisponiveis(linhasCompletas);
    if(!meses.length) return;
    const diasDoMes = ym => linhasCompletas
      .filter(d => d.volume>0 && d.iso.slice(0,7)===ym)
      .map(d=>d.iso).sort();
    const diasAtual = diasDoMes(meses[0]);
    if(diasAtual.length){ c.atual.inicio = diasAtual[0]; c.atual.fim = diasAtual[diasAtual.length-1]; }
    if(meses.length > 1){
      const diasBase = diasDoMes(meses[1]);
      if(diasBase.length){ c.base.inicio = diasBase[0]; c.base.fim = diasBase[diasBase.length-1]; }
    }
  },

  // Aba "Análise Automática": NÃO compara com período externo — divide o
  // próprio período que está filtrado globalmente em duas metades (mais
  // antiga vs. mais recente) e deixa os analistas investigarem essa
  // diferença interna. Sem escolha manual — é automático.
  _construirEventoDentroDoPeriodo(linhas){
    const dias = linhas.filter(d => d.volume > 0).sort((a,b) => a.iso.localeCompare(b.iso));
    if(dias.length < 4) return null;
    const meio     = Math.floor(dias.length / 2);
    const diasBase  = dias.slice(0, meio);
    const diasAtual = dias.slice(meio);
    const agBase  = this._agregarJanela(diasBase);
    const agAtual = this._agregarJanela(diasAtual);
    return {
      agAtual, agBase,
      labelAtual: `2ª metade do período (${agAtual.inicio} a ${agAtual.fim})`,
      labelBase:  `1ª metade do período (${agBase.inicio} a ${agBase.fim})`,
      varReceita: agBase.receitaMediaDia ? ((agAtual.receitaMediaDia / agBase.receitaMediaDia) - 1) * 100 : 0,
    };
  },

  // Aba "Comparativo": dois períodos LIVRES escolhidos pelo usuário (não
  // precisam ser mês fechado), com dia da semana compartilhado — sempre
  // sobre o dataset completo, ignora os filtros globais da tela.
  _construirEventoComparativo(linhasCompletas){
    const c = this._comparativo;
    if(!c.atual.inicio || !c.atual.fim || !c.base.inicio || !c.base.fim) return null;
    const filtrar = (inicio, fim) => linhasCompletas
      .filter(d => d.volume > 0 && d.iso >= inicio && d.iso <= fim && c.weekdays.has(d.diaSemana))
      .sort((a,b) => a.iso.localeCompare(b.iso));
    const diasAtual = filtrar(c.atual.inicio, c.atual.fim);
    const diasBase  = filtrar(c.base.inicio, c.base.fim);
    if(diasAtual.length < 2 || diasBase.length < 2) return null;
    const agAtual = this._agregarJanela(diasAtual);
    const agBase  = this._agregarJanela(diasBase);
    return {
      agAtual, agBase,
      labelAtual: `${c.atual.inicio} a ${c.atual.fim}`,
      labelBase:  `${c.base.inicio} a ${c.base.fim}`,
      varReceita: agBase.receitaMediaDia ? ((agAtual.receitaMediaDia / agBase.receitaMediaDia) - 1) * 100 : 0,
    };
  },

  // ---- Analistas: cada um investiga o MESMO evento sob um ângulo próprio ----

  _analistaFinanceiro(evento){
    const { agAtual, agBase, varReceita } = evento;
    const direcao   = varReceita >= 0 ? 'cresceu' : 'caiu';
    const varVolume = agBase.volumeMedioDia ? ((agAtual.volumeMedioDia / agBase.volumeMedioDia) - 1) * 100 : 0;
    const varTicket = agBase.ticketMedio    ? ((agAtual.ticketMedio    / agBase.ticketMedio)    - 1) * 100 : 0;
    const fatorVolumeDominante = Math.abs(varVolume) >= Math.abs(varTicket);
    return {
      analista: 'Financeiro', icone: '💰',
      texto: `Receita ${direcao} ${Math.abs(varReceita).toFixed(1)}%, puxada principalmente pel${fatorVolumeDominante?'o fluxo de veículos':'o ticket médio'} (volume ${varVolume>=0?'+':''}${varVolume.toFixed(1)}%, ticket ${varTicket>=0?'+':''}${varTicket.toFixed(1)}%).`,
      dados: { varReceita, varVolume, varTicket, fatorVolumeDominante },
    };
  },

  _analistaOperacional(evento, pagos){
    const isoAtual = new Set(evento.agAtual.dias.map(d=>d.iso));
    const isoBase  = new Set(evento.agBase.dias.map(d=>d.iso));
    const perfil = (isoSet, nDias) => {
      const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
      pagos.forEach(d=>{
        if(!isoSet.has(this._isoDoPago(d))) return;
        const h = this._horaBRT(d.timestampEntrada);
        if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
      });
      return porHora.map((v,h)=>({ hora:h, receitaMediaDia: v.receita/nDias }));
    };
    const perfAtual = perfil(isoAtual, evento.agAtual.nDias);
    const perfBase  = perfil(isoBase,  evento.agBase.nDias);

    // Delta de receita/dia por hora — identifica a(s) hora(s) que mais
    // explicam a variação total (mesmo sinal do delta total do evento).
    const deltas = perfAtual.map((h,i) => ({ hora: h.hora, delta: h.receitaMediaDia - perfBase[i].receitaMediaDia }));
    const deltaTotal = deltas.reduce((s,d)=>s+d.delta,0);
    const relevantes = deltas.filter(d => Math.sign(d.delta) === Math.sign(deltaTotal) && d.delta !== 0);
    relevantes.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
    const top = relevantes.slice(0,3);

    if(!top.length || Math.abs(deltaTotal) < 1){
      return { analista:'Operacional', icone:'🕐', texto:'A variação ficou distribuída ao longo do dia, sem uma faixa horária concentradora identificável.' };
    }
    const somaTop       = top.reduce((s,d)=>s+d.delta,0);
    const pctExplicado  = deltaTotal ? (somaTop/deltaTotal)*100 : 0;
    const horaMin       = Math.min(...top.map(t=>t.hora));
    const horaMax       = Math.max(...top.map(t=>t.hora));
    const contiguo      = (horaMax - horaMin) <= 3;
    const direcaoTexto  = deltaTotal >= 0 ? 'concentrou-se' : 'ocorreu principalmente';
    const faixaTexto    = contiguo
      ? `entre ${String(horaMin).padStart(2,'0')}h e ${String(horaMax+1).padStart(2,'0')}h`
      : `principalmente por volta de ${top.map(t=>String(t.hora).padStart(2,'0')+'h').join(', ')}`;
    return {
      analista: 'Operacional', icone: '🕐',
      texto: `A ${deltaTotal>=0?'alta':'redução'} ${direcaoTexto} ${faixaTexto}`
        + (pctExplicado >= 40 ? ` (responsável por ~${pctExplicado.toFixed(0)}% da variação total)` : '')
        + '. O restante do dia ficou dentro da média.',
      dados: { top, pctExplicado, contiguo, horaMin, horaMax },
    };
  },

  _analistaTendencia(linhas, evento){
    const dias   = linhas.filter(d => d.volume > 0).sort((a,b) => a.iso.localeCompare(b.iso));
    const janela = dias.slice(-30);
    if(janela.length < 9){
      return { analista:'Tendências', icone:'📉', texto:'Histórico insuficiente no período filtrado para avaliar se há tendência — o evento será tratado como pontual.' };
    }
    const terco  = Math.floor(janela.length/3);
    const blocos = [janela.slice(0,terco), janela.slice(terco,terco*2), janela.slice(terco*2)];
    const medias = blocos.map(b => b.reduce((s,d)=>s+d.receita,0)/b.length);
    const quedaConsistente = medias[0] > medias[1] && medias[1] > medias[2];
    const altaConsistente  = medias[0] < medias[1] && medias[1] < medias[2];
    if(quedaConsistente || altaConsistente){
      return {
        analista: 'Tendências', icone:'📉',
        texto: `Existe tendência de ${quedaConsistente?'queda':'alta'} consistente nos últimos ${janela.length} dias — o comportamento não parece pontual, e sim parte de um movimento contínuo.`,
        dados: { medias, tendencia: quedaConsistente ? 'queda' : 'alta' },
      };
    }
    return {
      analista: 'Tendências', icone:'📉',
      texto: `Não existe tendência consistente nos últimos ${janela.length} dias. O comportamento parece pontual.`,
      dados: { medias, tendencia: 'pontual' },
    };
  },

  _analistaEstatistico(linhas, evento){
    const dias      = linhas.filter(d => d.volume > 0);
    const isoEvento = new Set(evento.agAtual.dias.map(d=>d.iso));
    const historico = dias.filter(d => !isoEvento.has(d.iso));
    if(historico.length < 5){
      return { analista:'Estatístico', icone:'📊', texto:'Amostra histórica insuficiente para calcular significância estatística com confiança.' };
    }
    const media     = historico.reduce((s,d)=>s+d.receita,0) / historico.length;
    const variancia = historico.reduce((s,d)=>s+Math.pow(d.receita-media,2),0) / historico.length;
    const desvio    = Math.sqrt(variancia);
    const z         = desvio ? (evento.agAtual.receitaMediaDia - media) / desvio : 0;
    const direcao   = z >= 0 ? 'acima' : 'abaixo';
    const relevante = Math.abs(z) >= 1.5;
    return {
      analista: 'Estatístico', icone:'📊',
      texto: relevante
        ? `Esse resultado está ${Math.abs(z).toFixed(1)} desvios-padrão ${direcao} da média histórica. Vale investigar.`
        : `A variação está dentro do range estatisticamente normal (${Math.abs(z).toFixed(1)} desvio-padrão ${direcao} da média).`,
      dados: { z, media, desvio },
    };
  },

  // Aprofundado em 05/08/2026: além da taxa de cancelamento, investiga o
  // PORQUÊ por trás do número — concentração por operador, faixa horária,
  // valor perdido, reincidência de placa e motivo dominante (campo DETALHE).
  // Cada sinal só entra se cruzar seu próprio limiar (amostra mínima +
  // desvio relevante contra o histórico) — filosofia do Nexus é nunca ficar
  // em silêncio, mas também nunca gerar ruído com achados fracos.
  _analistaAuditoria(evento, cancelados){
    const { agAtual, agBase } = evento;
    const diffPP = agAtual.taxaCancelamento - agBase.taxaCancelamento;
    const aumentoRelevante = diffPP >= 2 && agAtual.taxaCancelamento > agBase.taxaCancelamento * 1.3;

    const isoAtual = new Set(agAtual.dias.map(d=>d.iso));
    const isoBase  = new Set(agBase.dias.map(d=>d.iso));
    const canceladosAtual = (cancelados||[]).filter(d => isoAtual.has(this._isoDoPago(d)));
    const canceladosBase  = (cancelados||[]).filter(d => isoBase.has(this._isoDoPago(d)));

    const achados = [];

    achados.push(aumentoRelevante
      ? `A taxa de cancelamento subiu de ${agBase.taxaCancelamento.toFixed(1)}% para ${agAtual.taxaCancelamento.toFixed(1)}%.`
      : `A taxa de cancelamento (${agAtual.taxaCancelamento.toFixed(1)}%) está estável frente ao histórico (${agBase.taxaCancelamento.toFixed(1)}%).`);

    const contarPor = (lista, campo) => {
      const m = {};
      lista.forEach(d => { const k = (d[campo]||'').trim() || '—'; m[k] = (m[k]||0)+1; });
      return m;
    };

    // --- Concentração por operador ---
    if(canceladosAtual.length >= 1){
      const mapaAtual = contarPor(canceladosAtual, 'usuarioPagamento');
      const [topOp, topCount] = Object.entries(mapaAtual).sort((a,b)=>b[1]-a[1])[0];
      const pctTop = (topCount / canceladosAtual.length) * 100;
      const mapaBase = contarPor(canceladosBase, 'usuarioPagamento');
      const pctTopBase = canceladosBase.length ? ((mapaBase[topOp]||0) / canceladosBase.length) * 100 : 0;
      if(pctTop >= 40 && (pctTop - pctTopBase) >= 15){
        achados.push(`O operador <strong>${esc(topOp)}</strong> concentra ${pctTop.toFixed(0)}% dos cancelamentos do período (era ${pctTopBase.toFixed(0)}% no histórico) — vale checar.`);
      }
    }

    // --- Faixa horária de cancelamento ---
    if(canceladosAtual.length >= 1){
      const porHora = Array.from({length:24}, () => 0);
      canceladosAtual.forEach(d => { const h = this._horaBRT(d.timestampPagamento); if(h>=0 && h<24) porHora[h]++; });
      const maxIdx = porHora.indexOf(Math.max(...porHora));
      const pctMax = (porHora[maxIdx] / canceladosAtual.length) * 100;
      if(pctMax >= 35){
        achados.push(`${pctMax.toFixed(0)}% dos cancelamentos do período aconteceram por volta de ${String(maxIdx).padStart(2,'0')}h — concentração fora do normal.`);
      }
    }

    // --- Valor perdido concentrado (R$/dia, não só contagem) ---
    const valorAtualDia = agAtual.nDias ? canceladosAtual.reduce((s,d)=>s+d.valorPago,0) / agAtual.nDias : 0;
    const valorBaseDia  = agBase.nDias  ? canceladosBase.reduce((s,d)=>s+d.valorPago,0)  / agBase.nDias  : 0;
    if(valorBaseDia > 0 && valorAtualDia >= valorBaseDia * 1.5 && (valorAtualDia - valorBaseDia) >= 20){
      achados.push(`A receita perdida em cancelamentos subiu para ${fmtR(valorAtualDia)}/dia (era ${fmtR(valorBaseDia)}/dia) — quase ${(valorAtualDia/valorBaseDia).toFixed(1)}× o histórico.`);
    }

    // --- Reincidência de placa ---
    if(canceladosAtual.length >= 1){
      const porPlaca = contarPor(canceladosAtual, 'placa');
      const reincidentes = Object.entries(porPlaca).filter(([placa,n]) => placa !== '—' && n >= 3).sort((a,b)=>b[1]-a[1]);
      if(reincidentes.length){
        const [placaTop, nTop] = reincidentes[0];
        achados.push(`A placa <strong>${esc(placaTop)}</strong> cancelou ${nTop} vezes no período — pode indicar teste do sistema ou uso indevido.`);
      }
    }

    // --- Motivo dominante (campo DETALHE) ---
    if(canceladosAtual.length >= 1){
      const mapaMotivoAtual = contarPor(canceladosAtual, 'detalhe');
      const [topMotivo, topCount] = Object.entries(mapaMotivoAtual).sort((a,b)=>b[1]-a[1])[0];
      if(topMotivo !== '—'){
        const pctMotivo = (topCount / canceladosAtual.length) * 100;
        const mapaMotivoBase = contarPor(canceladosBase, 'detalhe');
        const pctMotivoBase = canceladosBase.length ? ((mapaMotivoBase[topMotivo]||0) / canceladosBase.length) * 100 : 0;
        if(pctMotivo >= 40 && (pctMotivo - pctMotivoBase) >= 15){
          achados.push(`O motivo <strong>"${esc(topMotivo)}"</strong> responde por ${pctMotivo.toFixed(0)}% dos cancelamentos do período (era ${pctMotivoBase.toFixed(0)}% no histórico).`);
        }
      }
    }

    if(achados.length === 1 && !aumentoRelevante){
      achados.push('Não há indícios de inconsistências operacionais nos cancelamentos deste período.');
    }

    return {
      analista: 'Auditoria', icone:'🔍',
      texto: achados.join(' '),
      dados: { diffPP },
    };
  },

  // O Executivo NÃO investiga nada por conta própria — ele só ouve os
  // outros analistas e sintetiza os vereditos, na ordem: fator dominante →
  // auditoria → tendência → recomendação.
  _analistaExecutivo(evento, vereditos){
    const [financeiro, operacional, tendencia, estatistico, auditoria] = vereditos;
    const direcao = evento.varReceita >= 0 ? 'Aumento' : 'Redução';
    const janelaOperacional = (operacional.dados && operacional.dados.contiguo)
      ? ` entre ${String(operacional.dados.horaMin).padStart(2,'0')}h e ${String(operacional.dados.horaMax+1).padStart(2,'0')}h`
      : '';

    const partes = [
      `${direcao} de ${Math.abs(evento.varReceita).toFixed(1)}% na receita, puxada principalmente ${financeiro.dados.fatorVolumeDominante ? 'pelo fluxo de veículos' : 'pelo ticket médio'}${janelaOperacional}.`,
    ];

    const cancelamentoSubiu = auditoria.dados.diffPP >= 2;
    const temTendencia      = tendencia.dados && tendencia.dados.tendencia !== 'pontual';
    const foraDoRange       = estatistico.dados && Math.abs(estatistico.dados.z) >= 1.5;

    if(!cancelamentoSubiu && !temTendencia && !foraDoRange){
      partes.push('Sem aumento de cancelamentos, tendência de repetição ou desvio estatístico relevante — evento aparenta ser pontual e dentro do range normal.');
    } else {
      if(cancelamentoSubiu) partes.push('Cancelamentos subiram no período — vale checar.');
      if(temTendencia)      partes.push(`Faz parte de uma tendência de ${tendencia.dados.tendencia}, não é pontual.`);
      if(foraDoRange)       partes.push('Estatisticamente fora do range normal — vale investigar fatores externos.');
    }

    return partes.join(' ');
  },

  _conselhoAnalistas(linhas, pagos, cancelados, evento){
    const vereditos = [
      this._analistaFinanceiro(evento),
      this._analistaOperacional(evento, pagos),
      this._analistaTendencia(linhas, evento),
      this._analistaEstatistico(linhas, evento),
      this._analistaAuditoria(evento, cancelados),
    ];
    return { vereditos, resumoExecutivo: this._analistaExecutivo(evento, vereditos) };
  },

  // O conselho SEMPRE aparece quando há dados suficientes para montar o
  // evento — cada analista informa o que encontrou, mesmo quando a
  // resposta é "nada fora do padrão". O status (🔴/🟡/🟢) só muda o
  // selo/cor, não a visibilidade da análise.
  // Cruza a variação percentual (contra o limiar fixo) com o desvio-padrão
  // histórico já calculado pelo Analista Estatístico — sem isso, o badge
  // dizia "dentro do esperado" sem nenhuma explicação, e podia até
  // contradizer o próprio Analista Estatístico logo abaixo (uma variação
  // pequena em % pode ser estatisticamente incomum se o histórico da
  // filial for muito estável).
  _statusEvento(evento, conselho){
    const estatistico   = conselho?.vereditos.find(v => v.analista === 'Estatístico');
    const z             = estatistico?.dados?.z;
    const acimaLimiar    = Math.abs(evento.varReceita) >= this.LIMIAR_EVENTO_PCT;
    const zIncomum       = typeof z === 'number' && Math.abs(z) >= 1.5;

    if(acimaLimiar){
      return {
        status:'relevante', icone:'🔴', cor:'var(--danger)',
        motivo: `acima do limiar de ${this.LIMIAR_EVENTO_PCT}% definido para sinalizar eventos`,
      };
    }
    if(zIncomum){
      return {
        status:'atencao', icone:'🟡', cor:'var(--warn)',
        motivo: `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}%, mas incomum frente ao histórico (${Math.abs(z).toFixed(1)} desvio-padrão)`,
      };
    }
    return {
      status:'normal', icone:'🟢', cor:'var(--accent2)',
      motivo: typeof z === 'number'
        ? `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}% e dentro do desvio-padrão histórico (${Math.abs(z).toFixed(1)})`
        : `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}% definido para sinalizar eventos`,
    };
  },

  _renderConselho(evento, conselho){
    const { icone, cor, motivo } = this._statusEvento(evento, conselho);
    const selo = `<span style="font-size:12px;color:${cor};font-weight:600;">${icone} ${evento.varReceita>=0?'+':''}${evento.varReceita.toFixed(1)}% — ${motivo}</span>`;
    return `
      <div class="panel" style="margin-bottom:14px;border-left:3px solid ${cor};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:4px;">
          <h2 style="margin:0;">🧠 Nexus Intelligence Engine</h2>
          ${selo}
        </div>
        <p style="font-size:11px;color:var(--muted);margin:0 0 14px;">
          Comparando <strong>${esc(evento.labelAtual)}</strong> contra <strong>${esc(evento.labelBase)}</strong>.
        </p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
          ${conselho.vereditos.map(v => `
            <div style="display:flex;gap:10px;align-items:flex-start;">
              <div style="font-size:16px;line-height:1.4;">${v.icone}</div>
              <div>
                <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;">Analista ${v.analista}</div>
                <div style="font-size:13px;line-height:1.6;">${v.texto}</div>
              </div>
            </div>`).join('')}
        </div>
        <div style="background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;">
          <div style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px;">📋 Resumo Executivo</div>
          <div style="font-size:13px;line-height:1.7;">${conselho.resumoExecutivo}</div>
        </div>
      </div>`;
  },

  _renderDadosInsuficientes(msg){
    return `
      <div class="panel" style="margin-bottom:14px;">
        <h2>🧠 Nexus Intelligence Engine</h2>
        <p style="font-size:13px;color:var(--muted);margin:0;">
          ${msg || 'Dados insuficientes para montar o evento — tente ampliar o intervalo de datas.'}
        </p>
      </div>`;
  },

  _renderFiltroComparativo(){
    const c = this._comparativo;
    const inputDate = (id, val) => `<input type="date" id="${id}" value="${val||''}" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;">`;
    return `
      <div class="panel" style="margin-bottom:14px;">
        <h2 style="margin:0 0 4px;">Filtro do Comparativo</h2>
        <p style="font-size:11px;color:var(--muted);margin:0 0 14px;">Independente do filtro global da tela — compara dois períodos livres do relatório completo importado.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px;">
          <div>
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px;">Período Atual</div>
            <div style="display:flex;gap:8px;align-items:center;">
              ${inputDate('cmp-atual-ini', c.atual.inicio)}<span style="color:var(--muted);font-size:12px;">até</span>${inputDate('cmp-atual-fim', c.atual.fim)}
            </div>
          </div>
          <div>
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px;">Período Base (comparação)</div>
            <div style="display:flex;gap:8px;align-items:center;">
              ${inputDate('cmp-base-ini', c.base.inicio)}<span style="color:var(--muted);font-size:12px;">até</span>${inputDate('cmp-base-fim', c.base.fim)}
            </div>
          </div>
        </div>
        <div class="filt-group" style="margin-bottom:12px;">
          <div class="filt-row">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;">Dias da Semana (aplicado aos dois períodos)</label>
            <div class="chip-row" id="cmp-weekday-chips">
              ${['D','S','T','Q','Q','S','S'].map((d,i)=>`<div class="chip ${c.weekdays.has(i)?'on':''}" data-day="${i}">${d}</div>`).join('')}
            </div>
          </div>
        </div>
        <button class="quickbtn" id="cmp-limpar" style="color:var(--danger);border-color:var(--danger);">✕ Limpar filtro do comparativo</button>
      </div>`;
  },

  _wireFiltroComparativo(el){
    const c = this._comparativo;
    const rerender = () => this._renderComparativo(el);
    el.querySelector('#cmp-atual-ini').onchange = e => { c.atual.inicio = e.target.value || null; rerender(); };
    el.querySelector('#cmp-atual-fim').onchange = e => { c.atual.fim   = e.target.value || null; rerender(); };
    el.querySelector('#cmp-base-ini').onchange  = e => { c.base.inicio = e.target.value || null; rerender(); };
    el.querySelector('#cmp-base-fim').onchange  = e => { c.base.fim   = e.target.value || null; rerender(); };
    el.querySelectorAll('#cmp-weekday-chips .chip').forEach(chip=>{
      chip.onclick = () => {
        const day = parseInt(chip.dataset.day, 10);
        chip.classList.toggle('on');
        if(chip.classList.contains('on')) c.weekdays.add(day);
        else c.weekdays.delete(day);
        rerender();
      };
    });
    el.querySelector('#cmp-limpar').onclick = () => {
      // inicializado fica true — "limpar" não deve voltar a forçar os
      // defaults automáticos, senão o botão parece não fazer nada.
      this._comparativo = { atual:{inicio:null,fim:null}, base:{inicio:null,fim:null}, weekdays:new Set([0,1,2,3,4,5,6]), inicializado:true };
      rerender();
    };
  },

  // Números crus dos dois períodos, lado a lado — pro usuário conferir
  // visualmente, não só ler o texto gerado pelos analistas.
  _renderComparacaoNumeros(evento){
    const a = evento.agAtual, b = evento.agBase;
    const volA = a.dias.reduce((s,d)=>s+d.volume,0), volB = b.dias.reduce((s,d)=>s+d.volume,0);
    const recA = a.dias.reduce((s,d)=>s+d.receita,0), recB = b.dias.reduce((s,d)=>s+d.receita,0);
    return `
      <div class="panel" style="margin-bottom:14px;">
        <h2>Números do Período</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 10px;">Período Atual: ${esc(evento.labelAtual)} · Período Base: ${esc(evento.labelBase)}.</p>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Indicador</th><th>Período Atual</th><th>Período Base</th></tr></thead>
            <tbody>
              <tr><td>Dias com Movimento</td><td>${a.nDias}</td><td>${b.nDias}</td></tr>
              <tr><td>Volume</td><td>${volA.toLocaleString('pt-BR')}</td><td>${volB.toLocaleString('pt-BR')}</td></tr>
              <tr><td>Receita Total</td><td>${fmtR(recA)}</td><td>${fmtR(recB)}</td></tr>
              <tr><td>Ticket Médio</td><td>${fmtR(a.ticketMedio)}</td><td>${fmtR(b.ticketMedio)}</td></tr>
              <tr><td>Receita Média/Dia</td><td>${fmtR(a.receitaMediaDia)}</td><td>${fmtR(b.receitaMediaDia)}</td></tr>
              <tr><td>Permanência Média</td><td>${minToHHMM(Math.round(a.permanenciaMedia))}</td><td>${minToHHMM(Math.round(b.permanenciaMedia))}</td></tr>
              <tr><td>Cancelamentos</td><td>${a.cancelamentos}</td><td>${b.cancelamentos}</td></tr>
              <tr><td>Taxa de Cancelamento</td><td>${a.taxaCancelamento.toFixed(1)}%</td><td>${b.taxaCancelamento.toFixed(1)}%</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;
  },

  render(container){
    container.innerHTML = `
      <div class="config-tabs">
        <div class="config-tab ${this.abaAtiva==='automatica'?'active':''}" data-aba="automatica">Análise Automática</div>
        <div class="config-tab ${this.abaAtiva==='comparativo'?'active':''}" data-aba="comparativo">Comparativo</div>
      </div>
      <div id="aa-content"></div>
    `;
    container.querySelectorAll('.config-tab').forEach(tab=>{
      tab.onclick = ()=>{
        this.abaAtiva = tab.dataset.aba;
        this.render(container);
      };
    });
    const el = container.querySelector('#aa-content');
    if(this.abaAtiva === 'comparativo') this._renderComparativo(el);
    else this._renderAutomatica(el);
  },

  // ---- Aba "Análise Automática": filtro global, KPIs no topo, Intelligence
  // Engine + Observações Automáticas juntos, comparando a 1ª metade do
  // período filtrado contra a 2ª (sem escolha manual). ----
  _renderAutomatica(container){
    const pagos      = Nexus.filteredData.filter(d => d.isPago);
    const cancelados = ModuloCancelados.getFilteredCanceladosData();
    const linhas      = this._agregarPorDia(pagos, cancelados);
    const destaques   = this._destaques(linhas);
    const insights    = [...this._gerarInsights(linhas), ...this._anomaliasTexto(linhas, destaques)];
    const pareto      = this._concentracaoReceita(linhas);
    const dec         = this._decomposicaoTendencia(linhas);
    const fraseDec    = this._fraseDecomposicao(dec);
    const horaTop     = this._faixaHoraria(pagos);
    const horaTopSaida = this._faixaHorariaSaida(pagos);


    const receitaTotal = linhas.reduce((s,d)=>s+d.receita,0);
    const volumeTotal  = linhas.reduce((s,d)=>s+d.volume,0);
    const cancelTotal  = linhas.reduce((s,d)=>s+d.cancelamentos,0);
    const ticketMedio  = volumeTotal ? receitaTotal/volumeTotal : 0;
    const permMedia    = linhas.reduce((s,d)=>s+d.permSoma,0) / (volumeTotal || 1);
    const diasComVolume = linhas.filter(d=>d.volume>0);
    const mediaDiaria  = diasComVolume.length ? receitaTotal/diasComVolume.length : 0;

    const evento         = this._construirEventoDentroDoPeriodo(linhas);
    const conselho       = evento ? this._conselhoAnalistas(linhas, pagos, cancelados, evento) : null;
    const capacidade     = this._analistaCapacidadeOcupacao(pagos, horaTop, horaTopSaida);

    container.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card"><div class="lbl">Volume</div><div class="val">${volumeTotal.toLocaleString('pt-BR')}</div></div>
        <div class="kpi-card"><div class="lbl">Receita Total</div><div class="val">${fmtR(receitaTotal)}</div></div>
        <div class="kpi-card"><div class="lbl">Ticket Médio</div><div class="val">${fmtR(ticketMedio)}</div></div>
        <div class="kpi-card"><div class="lbl">Receita Média / Dia</div><div class="val">${fmtR(mediaDiaria)}</div></div>
        <div class="kpi-card"><div class="lbl">Dias no Período</div><div class="val">${linhas.length}</div></div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="lbl">Permanência Média</div><div class="val">${minToHHMM(Math.round(permMedia))}</div></div>
        ${pareto ? `<div class="kpi-card"><div class="lbl">Concentração de Receita</div><div class="val">${pareto.diasNecessarios}/${pareto.totalDias} dias</div><div class="sub">${pareto.pctDias.toFixed(0)}% dos dias → 80% da receita</div></div>` : ''}
        <div class="kpi-card" style="border-left:3px solid var(--danger);"><div class="lbl">Cancelamentos</div><div class="val">${cancelTotal.toLocaleString('pt-BR')}</div></div>
      </div>

      ${evento ? this._renderConselho(evento, conselho) : this._renderDadosInsuficientes('Período filtrado muito curto para dividir em duas metades comparáveis — amplie o intervalo de datas no filtro global.')}

      <div class="panel" style="margin-bottom:14px;">
        <h2>Observações Automáticas</h2>
        ${insights.length
          ? `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;">${insights.map(i=>`<li>${i}</li>`).join('')}</ul>`
          : `<p style="color:var(--muted);font-size:13px;margin:0;">Ainda não há dados suficientes no período filtrado para gerar comparações automáticas — tente ampliar o intervalo de datas.</p>`}
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <h2>Tendência: Volume × Permanência × Ticket Médio</h2>
        ${dec ? `
          <p style="font-size:13px;line-height:1.6;margin:0 0 14px;">${fraseDec}</p>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Metade do Período</th><th>Volume</th><th>Receita Total</th><th>Ticket Médio</th><th>Volume Médio/Dia</th><th>Permanência Média</th><th>Receita Média/Dia</th></tr></thead>
              <tbody>
                <tr>
                  <td>1ª — ${esc(dec.periodoA.inicio)} a ${esc(dec.periodoA.fim)}</td>
                  <td>${dec.periodoA.volume.toLocaleString('pt-BR')}</td>
                  <td>${fmtR(dec.periodoA.receita)}</td>
                  <td>${fmtR(dec.periodoA.ticketMedio)}</td>
                  <td>${dec.periodoA.volumeMedioDia.toFixed(1)}</td>
                  <td>${minToHHMM(Math.round(dec.periodoA.permanenciaMedia))}</td>
                  <td>${fmtR(dec.periodoA.receitaMediaDia)}</td>
                </tr>
                <tr>
                  <td>2ª — ${esc(dec.periodoB.inicio)} a ${esc(dec.periodoB.fim)}</td>
                  <td>${dec.periodoB.volume.toLocaleString('pt-BR')}</td>
                  <td>${fmtR(dec.periodoB.receita)}</td>
                  <td>${fmtR(dec.periodoB.ticketMedio)}</td>
                  <td>${dec.periodoB.volumeMedioDia.toFixed(1)}</td>
                  <td>${minToHHMM(Math.round(dec.periodoB.permanenciaMedia))}</td>
                  <td>${fmtR(dec.periodoB.receitaMediaDia)}</td>
                </tr>
              </tbody>
            </table>
          </div>`
          : `<p style="color:var(--muted);font-size:13px;margin:0;">Período filtrado muito curto para dividir em duas metades comparáveis — amplie o intervalo de datas.</p>`}
      </div>

      <div class="panel" style="overflow:hidden;margin-bottom:14px;">
        <h2>Dias em Destaque</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 10px;">Comparado à receita média diária do período filtrado: ${fmtR(destaques.media)}.</p>
        ${this._renderDestaquesTabela(destaques.melhores, 'melhor')}
        ${destaques.piores.length ? this._renderDestaquesTabela(destaques.piores, 'pior') : ''}
        ${(!destaques.melhores.length) ? `<p style="color:var(--muted);font-size:13px;margin:0;">Nenhum dia com volume no período filtrado.</p>` : ''}
      </div>

      <div class="panel" style="overflow:hidden;">
        <h2>Faixa Horária de Pico</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 10px;">Baseado nos tickets pagos — útil para escala de equipe.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          <div>
            <h3 style="font-size:12px;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;">🚗 Pico de Entrada</h3>
            ${horaTop.length ? `
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Horário</th><th>Volume</th><th>Receita</th></tr></thead>
                  <tbody>
                    ${horaTop.map(h=>`<tr><td>${String(h.hora).padStart(2,'0')}h – ${String((h.hora+1)%24).padStart(2,'0')}h</td><td>${h.volume}</td><td>${fmtR(h.receita)}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>`
              : `<p style="color:var(--muted);font-size:13px;margin:0;">Nenhum dado de horário de entrada disponível no período filtrado.</p>`}
          </div>

          <div>
            <h3 style="font-size:12px;color:var(--warn);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;">🚙 Pico de Saída</h3>
            ${horaTopSaida.length ? `
              <div class="table-scroll">
                <table class="data-table">
                  <thead><tr><th>Horário</th><th>Volume</th><th>Receita</th></tr></thead>
                  <tbody>
                    ${horaTopSaida.map(h=>`<tr><td>${String(h.hora).padStart(2,'0')}h – ${String((h.hora+1)%24).padStart(2,'0')}h</td><td>${h.volume}</td><td>${fmtR(h.receita)}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>`
              : `<p style="color:var(--muted);font-size:13px;margin:0;">Nenhum dado de horário de saída disponível no período filtrado.</p>`}
          </div>
        </div>

        <h3 style="font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px;">🅿️ Capacidade e Ocupação</h3>
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <div style="font-size:16px;line-height:1.4;">${capacidade.icone}</div>
          <div style="font-size:13px;line-height:1.6;">${capacidade.texto}</div>
        </div>
      </div>
    `;
  },

  // ---- Aba "Comparativo": filtro próprio (independente do global),
  // Intelligence Engine + Observações Automáticas + números crus dos dois
  // períodos escolhidos livremente. ----
  _renderComparativo(container){
    const linhasCompletas = this._linhasCompletas();
    this._garantirDefaultsComparativo(linhasCompletas);

    const evento         = this._construirEventoComparativo(linhasCompletas);
    const pagosCompletos = Nexus.rawData.filter(d => d.isPago);
    const canceladosCompletos = Nexus.rawData.filter(d =>
      d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
    );
    const conselho       = evento ? this._conselhoAnalistas(linhasCompletas, pagosCompletos, canceladosCompletos, evento) : null;

    // Observações Automáticas desta aba: só sobre os dias dos 2 períodos escolhidos.
    const diasCombinados = evento
      ? [...evento.agBase.dias, ...evento.agAtual.dias].sort((a,b)=>a.iso.localeCompare(b.iso))
      : [];
    const destaquesCmp = this._destaques(diasCombinados);
    const insightsCmp  = evento ? [...this._gerarInsights(diasCombinados), ...this._anomaliasTexto(diasCombinados, destaquesCmp)] : [];

    container.innerHTML = `
      ${this._renderFiltroComparativo()}
      ${evento ? this._renderConselho(evento, conselho) : this._renderDadosInsuficientes('Selecione dois períodos válidos (com pelo menos 2 dias com movimento cada) para comparar.')}
      ${evento ? this._renderComparacaoNumeros(evento) : ''}

      <div class="panel" style="margin-bottom:14px;">
        <h2>Observações Automáticas</h2>
        ${insightsCmp.length
          ? `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;">${insightsCmp.map(i=>`<li>${i}</li>`).join('')}</ul>`
          : `<p style="color:var(--muted);font-size:13px;margin:0;">Selecione dois períodos com dados suficientes para gerar observações automáticas.</p>`}
      </div>
    `;

    this._wireFiltroComparativo(container);
  },

  _renderDestaquesTabela(dias, tipo){
    const NOMES_DIA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const cor = tipo === 'melhor' ? 'var(--accent2)' : 'var(--danger)';
    const titulo = tipo === 'melhor' ? '🏆 Melhores dias' : '⚠️ Piores dias';

    return `
      <h3 style="font-size:12px;color:${cor};text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;">${titulo}</h3>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>Data</th><th>Dia</th><th>Receita</th><th>vs. Média</th><th>Volume</th><th>Ticket Médio</th><th>Permanência Média</th><th>Cancelamentos</th></tr>
          </thead>
          <tbody>
            ${dias.map(d=>`
              <tr>
                <td>${esc(d.dataStr)}</td>
                <td>${NOMES_DIA[d.diaSemana]}</td>
                <td style="font-weight:600;">${fmtR(d.receita)}</td>
                <td style="color:${d.diffPct>=0?'var(--accent2)':'var(--danger)'};font-weight:600;">${d.diffPct>=0?'+':''}${d.diffPct.toFixed(0)}%</td>
                <td>${d.volume}</td>
                <td>${fmtR(d.ticketMedio)}</td>
                <td>${minToHHMM(Math.round(d.permanenciaMedia))}</td>
                <td>${d.cancelamentos ? `<span style="color:var(--danger);">${d.cancelamentos}</span>` : '0'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  },

  exportarDados(){
    const pagos      = Nexus.filteredData.filter(d => d.isPago);
    const cancelados = ModuloCancelados.getFilteredCanceladosData();
    const linhas      = this._agregarPorDia(pagos, cancelados);
    const destaques   = this._destaques(linhas);
    const insights    = [...this._gerarInsights(linhas), ...this._anomaliasTexto(linhas, destaques)];
    const pareto      = this._concentracaoReceita(linhas);
    const dec         = this._decomposicaoTendencia(linhas);
    const horaTop     = this._faixaHoraria(pagos);
    const horaTopSaida = this._faixaHorariaSaida(pagos);
    const capacidade  = this._analistaCapacidadeOcupacao(pagos, horaTop, horaTopSaida);

    const eventoAuto        = this._construirEventoDentroDoPeriodo(linhas);
    const conselhoAuto      = eventoAuto ? this._conselhoAnalistas(linhas, pagos, cancelados, eventoAuto) : null;
    const statusAuto        = eventoAuto ? this._statusEvento(eventoAuto, conselhoAuto) : null;

    const NOMES_DIA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const receitaTotal = linhas.reduce((s,d)=>s+d.receita,0);
    const volumeTotal  = linhas.reduce((s,d)=>s+d.volume,0);
    const cancelTotal  = linhas.reduce((s,d)=>s+d.cancelamentos,0);
    const ticketMedio  = volumeTotal ? receitaTotal/volumeTotal : 0;
    const permMedia    = linhas.reduce((s,d)=>s+d.permSoma,0) / (volumeTotal || 1);

    const linhaDestaque = (d, tipo) => [
      tipo, d.dataStr, NOMES_DIA[d.diaSemana], d.receita, d.diffPct/100, d.volume, d.ticketMedio,
      Math.round(d.permanenciaMedia), d.cancelamentos
    ];

    const tabelas = [
      {
        titulo: 'Dias em Destaque (Top 3 Melhores/Piores vs. Média)',
        colunas: ['Destaque','Data','Dia da Semana','Receita','vs. Média','Volume','Ticket Médio','Permanência Média (min)','Cancelamentos'],
        tiposColuna: ['texto','texto','texto','moeda','percentual','numero','moeda','numero','numero'],
        linhas: [
          ...destaques.melhores.map(d => linhaDestaque(d, 'Melhor')),
          ...destaques.piores.map(d => linhaDestaque(d, 'Pior')),
        ],
      },
    ];

    if(dec){
      tabelas.push({
        titulo: 'Tendência: Volume × Permanência × Ticket Médio',
        colunas: ['Metade do Período','Período','Volume','Receita Total','Ticket Médio','Volume Médio/Dia','Permanência Média (min)','Receita Média/Dia'],
        tiposColuna: ['texto','texto','numero','moeda','moeda','numero','numero','moeda'],
        linhas: [
          ['1ª', `${dec.periodoA.inicio} a ${dec.periodoA.fim}`, dec.periodoA.volume, dec.periodoA.receita, dec.periodoA.ticketMedio, Number(dec.periodoA.volumeMedioDia.toFixed(1)), Math.round(dec.periodoA.permanenciaMedia), dec.periodoA.receitaMediaDia],
          ['2ª', `${dec.periodoB.inicio} a ${dec.periodoB.fim}`, dec.periodoB.volume, dec.periodoB.receita, dec.periodoB.ticketMedio, Number(dec.periodoB.volumeMedioDia.toFixed(1)), Math.round(dec.periodoB.permanenciaMedia), dec.periodoB.receitaMediaDia],
        ],
      });
    }

    if(horaTop.length){
      tabelas.push({
        titulo: 'Faixa Horária de Pico — Entrada',
        colunas: ['Horário','Volume','Receita'],
        tiposColuna: ['texto','numero','moeda'],
        linhas: horaTop.map(h => [`${String(h.hora).padStart(2,'0')}h–${String((h.hora+1)%24).padStart(2,'0')}h`, h.volume, h.receita]),
      });
    }

    if(horaTopSaida.length){
      tabelas.push({
        titulo: 'Faixa Horária de Pico — Saída',
        colunas: ['Horário','Volume','Receita'],
        tiposColuna: ['texto','numero','moeda'],
        linhas: horaTopSaida.map(h => [`${String(h.hora).padStart(2,'0')}h–${String((h.hora+1)%24).padStart(2,'0')}h`, h.volume, h.receita]),
      });
    }

    tabelas.push({
      titulo: 'Capacidade e Ocupação',
      colunas: ['Analista','Veredito'],
      tiposColuna: ['texto','texto'],
      linhas: [['Capacidade e Ocupação', capacidade.texto]],
    });

    if(eventoAuto){
      tabelas.push({
        titulo: `Nexus Intelligence Engine — Análise Automática (${statusAuto.icone} ${eventoAuto.varReceita>=0?'+':''}${eventoAuto.varReceita.toFixed(1)}% — ${statusAuto.motivo})`,
        colunas: ['Analista','Veredito'],
        tiposColuna: ['texto','texto'],
        linhas: [
          ...conselhoAuto.vereditos.map(v => [v.analista, v.texto]),
          ['Resumo Executivo', conselhoAuto.resumoExecutivo],
        ],
      });
    }

    tabelas.push({
      titulo: 'Observações Automáticas — Análise Automática',
      colunas: ['Observação'],
      tiposColuna: ['texto'],
      linhas: insights.length
        ? insights.map(i => [i.replace(/<\/?strong>/g,'')])
        : [['Dados insuficientes no período filtrado para gerar comparações automáticas.']],
    });

    // ---- Aba Comparativo (períodos livres, independente do filtro global) ----
    const linhasCompletas = this._linhasCompletas();
    this._garantirDefaultsComparativo(linhasCompletas);
    const eventoCmp = this._construirEventoComparativo(linhasCompletas);

    if(eventoCmp){
      const pagosCompletos   = Nexus.rawData.filter(d => d.isPago);
      const canceladosCompletos = Nexus.rawData.filter(d =>
        d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
      );
      const conselhoCmp      = this._conselhoAnalistas(linhasCompletas, pagosCompletos, canceladosCompletos, eventoCmp);
      const statusCmp        = this._statusEvento(eventoCmp, conselhoCmp);
      const diasCombinados   = [...eventoCmp.agBase.dias, ...eventoCmp.agAtual.dias].sort((a,b)=>a.iso.localeCompare(b.iso));
      const destaquesCmp     = this._destaques(diasCombinados);
      const insightsCmp      = [...this._gerarInsights(diasCombinados), ...this._anomaliasTexto(diasCombinados, destaquesCmp)];

      const volAtualCmp = eventoCmp.agAtual.dias.reduce((s,d)=>s+d.volume,0);
      const volBaseCmp  = eventoCmp.agBase.dias.reduce((s,d)=>s+d.volume,0);
      const recAtualCmp = eventoCmp.agAtual.dias.reduce((s,d)=>s+d.receita,0);
      const recBaseCmp  = eventoCmp.agBase.dias.reduce((s,d)=>s+d.receita,0);

      tabelas.push({
        titulo: `Comparativo — Números por Período`,
        colunas: ['Período','Intervalo','Volume','Receita Total','Ticket Médio','Permanência Média (min)','Cancelamentos'],
        tiposColuna: ['texto','texto','numero','moeda','moeda','numero','numero'],
        linhas: [
          ['Atual', eventoCmp.labelAtual, volAtualCmp, recAtualCmp, eventoCmp.agAtual.ticketMedio, Math.round(eventoCmp.agAtual.permanenciaMedia), eventoCmp.agAtual.cancelamentos],
          ['Base',  eventoCmp.labelBase,  volBaseCmp,  recBaseCmp,  eventoCmp.agBase.ticketMedio,  Math.round(eventoCmp.agBase.permanenciaMedia),  eventoCmp.agBase.cancelamentos],
        ],
      });

      tabelas.push({
        titulo: `Nexus Intelligence Engine — Comparativo (${statusCmp.icone} ${eventoCmp.varReceita>=0?'+':''}${eventoCmp.varReceita.toFixed(1)}% — ${statusCmp.motivo})`,
        colunas: ['Analista','Veredito'],
        tiposColuna: ['texto','texto'],
        linhas: [
          ...conselhoCmp.vereditos.map(v => [v.analista, v.texto]),
          ['Resumo Executivo', conselhoCmp.resumoExecutivo],
        ],
      });

      tabelas.push({
        titulo: 'Observações Automáticas — Comparativo',
        colunas: ['Observação'],
        tiposColuna: ['texto'],
        linhas: insightsCmp.length
          ? insightsCmp.map(i => [i.replace(/<\/?strong>/g,'')])
          : [['Dados insuficientes nos períodos escolhidos no Comparativo.']],
      });
    }

    return {
      titulo: 'Análise Automática',
      kpis: [
        { label:'Volume', valor: volumeTotal },
        { label:'Receita Total', valor: 'R$ '+receitaTotal.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Ticket Médio', valor: 'R$ '+ticketMedio.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Dias no Período', valor: linhas.length },
        { label:'Permanência Média', valor: minToHHMM(Math.round(permMedia)) },
        ...(pareto ? [{ label:'Concentração de Receita', valor: `${pareto.diasNecessarios}/${pareto.totalDias} dias → 80%` }] : []),
        { label:'Cancelamentos', valor: cancelTotal },
      ],
      tabelas,
    };
  },
};
