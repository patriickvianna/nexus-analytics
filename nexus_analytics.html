        <div style="display:flex;justify-content:flex-end;margin-top:20px;">
          <button id="modal-cancelar-usuario" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Fechar</button>
        </div>
      </div>`;

    const status = overlay.querySelector('#modal-usuario-status');
    overlay.querySelector('#modal-fechar-usuario').onclick = fechar;
    overlay.querySelector('#modal-cancelar-usuario').onclick = fechar;

    overlay.querySelector('#modal-sel-papel').onchange = async (e) => {
      const { error } = await supa.from('na_usuarios').update({ papel: e.target.value }).eq('id', usuario.id);
      status.textContent = error ? ('Erro ao salvar papel: ' + error.message) : '';
    };

    const aprovarBtn = overlay.querySelector('#modal-btn-aprovar');
    if(aprovarBtn) aprovarBtn.onclick = async () => {
      const papel = overlay.querySelector('#modal-sel-papel').value;
      const { error } = await supa.from('na_usuarios').update({
        status: 'aprovado', papel, token_acao: null, token_expira: null, aprovado_em: new Date().toISOString()
      }).eq('id', usuario.id);
      if(error){ status.textContent = 'Erro ao aprovar: ' + error.message; return; }
      fechar();
      this._abaUsuarios(elConfig);
      Nexus.refreshPendentesBadge();
    };

    const bloquearBtn = overlay.querySelector('#modal-btn-bloquear');
    if(bloquearBtn) bloquearBtn.onclick = async () => {
      const { error } = await supa.from('na_usuarios').update({ status:'bloqueado', token_acao:null, token_expira:null }).eq('id', usuario.id);
      if(error){ status.textContent = 'Erro ao bloquear: ' + error.message; return; }
      fechar();
      this._abaUsuarios(elConfig);
      Nexus.refreshPendentesBadge();
    };

    const reativarBtn = overlay.querySelector('#modal-btn-reativar');
    if(reativarBtn) reativarBtn.onclick = async () => {
      const { error } = await supa.from('na_usuarios').update({ status:'aprovado', aprovado_em: new Date().toISOString() }).eq('id', usuario.id);
      if(error){ status.textContent = 'Erro ao reativar: ' + error.message; return; }
      fechar();
      this._abaUsuarios(elConfig);
    };

    overlay.querySelector('#modal-btn-excluir').onclick = async () => {
      const ok = await Nexus.confirmar(
        'Excluir usuário',
        `Isso apaga o cadastro de ${usuario.nome||usuario.email} da ferramenta — a pessoa perde o acesso e precisa se cadastrar do zero se quiser voltar. Essa ação não pode ser desfeita.\n\nDeseja continuar?`,
        { perigo: true, textoConfirmar: 'Excluir' }
      );
      if(!ok) return;
      const { error } = await supa.from('na_usuarios').delete().eq('id', usuario.id);
      if(error){ status.textContent = 'Erro ao excluir: ' + error.message; return; }
      fechar();
      this._abaUsuarios(elConfig);
      Nexus.refreshPendentesBadge();
    };
  },

  // ── ABA LOG ─────────────────────────────────────────────────────
  async _abaLog(el){
    if(!NexusAuth.isAdmin){ el.innerHTML = '<p style="color:var(--danger);">Acesso restrito ao administrador.</p>'; return; }
    const { data: logs } = await supa.from('na_log_alteracoes')
      .select('*').order('criado_em',{ascending:false}).limit(100);

    el.innerHTML = `
      <div class="panel">
        <h2>Últimas 100 alterações</h2>
        <table class="data-table">
          <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Tabela</th><th>Operação</th></tr></thead>
          <tbody>
            ${(logs||[]).map(l=>`
              <tr>
                <td style="white-space:nowrap;">${new Date(l.criado_em).toLocaleString('pt-BR')}</td>
                <td>${esc(l.usuario_email||"—")}</td>
                <td style="font-family:monospace;font-size:11px;">${esc(l.tabela)}</td>
                <td><span style="color:${l.operacao==='DELETE'?'var(--danger)':l.operacao==='INSERT'?'var(--accent2)':'var(--warn)'};">${esc(l.operacao)}</span></td>
              </tr>`).join('') || '<tr><td colspan="4" style="color:var(--muted)">Nenhuma alteração registrada</td></tr>'}
          </tbody>
        </table>
      </div>`;
  }
};

/* ======================================================================
   MÓDULO ANÁLISE AUTOMÁTICA
   Consome Nexus.filteredData (já acumulado de múltiplos relatórios da
   mesma garagem + filtro de período/dias ativo) e produz um resumo diário
   simples — 1 linha por dia: receita, volume, ticket médio, permanência
   média e cancelamentos — que serve de base para comparações automáticas
   (melhor/pior dia da semana, tendência mês a mês, padrão sazonal
   recorrente). Reaproveita a mesma regra de cancelamento "real" do Módulo
   Cancelados (exclui baixas automáticas ADMIN/USUÁRIO AUTOMÁTICO).
   ====================================================================== */
const ModuloAnaliseAutomatica = {
  id: 'comparativo',
  nome: 'Comparativo',
  icon: '',

  // ---- Estado do Nexus Intelligence Engine ----
  // Comparativo: dois períodos LIVRES (não precisam ser mês fechado),
  // com dia da semana compartilhado entre os dois — sempre sobre o
  // dataset completo, independente do filtro global da tela.
  _comparativo: {
    atual: { inicio: null, fim: null },
    base:  { inicio: null, fim: null },
    weekdays: new Set([0,1,2,3,4,5,6]),
    inicializado: false,
  },
  LIMIAR_EVENTO_PCT: 0.1, // variação (%) de receita média/dia acima da qual o evento é sinalizado como relevante — reduzido a 05/08/2026 (decisão de produto: sensibilidade máxima, decisão de aceitar/ignorar fica com supervisor/gestor)

  // Intl.DateTimeFormat é caro pra instanciar — criar UM formatador e
  // reusá-lo (.format()) é ~40x mais rápido do que chamar
  // date.toLocaleDateString(...)/toLocaleString(...) com timeZone a cada
  // linha. Isso importa muito aqui: essas conversões rodam para cada
  // ticket, em vários pontos do módulo, a cada render.
  _fmtISO:  new Intl.DateTimeFormat('sv-SE', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}),
  _fmtHora: new Intl.DateTimeFormat('en-US', {timeZone:'America/Sao_Paulo', hour:'2-digit', hour12:false}),
  _fmtHoraMin: new Intl.DateTimeFormat('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'}),
  _isoBRT(ts){ return this._fmtISO.format(ts); },

  renderFilters(container){ Nexus.renderFiltrosPadrao(container, false); },

  // Agrega pagos + cancelados (regra "real") num mapa por dia (chave ISO,
  // estável e ordenável — 'YYYY-MM-DD' em BRT). 1 linha por dia único
  // presente no conjunto filtrado.
  _agregarPorDia(pagos, cancelados){
    const mapa = new Map();
    const getDia = (d) => {
      const iso = this._isoBRT(d.timestampPagamento);
      if(!mapa.has(iso)){
        mapa.set(iso, {
          iso, dataStr: d.dataPagamentoStr, diaSemana: d.diaPagamento,
          receita: 0, volume: 0, permSoma: 0, cancelamentos: 0,
        });
      }
      return mapa.get(iso);
    };
    pagos.forEach(d=>{
      const dia = getDia(d);
      dia.receita  += d.valorPago;
      dia.volume   += 1;
      dia.permSoma += d.permanenciaMin;
    });
    cancelados.forEach(d=>{
      getDia(d).cancelamentos += 1;
    });
    return [...mapa.values()]
      .map(d => ({
        ...d,
        ticketMedio:   d.volume ? d.receita / d.volume : 0,
        permanenciaMedia: d.volume ? d.permSoma / d.volume : 0,
      }))
      .sort((a,b) => a.iso.localeCompare(b.iso));
  },

  // Gera observações automáticas (texto) a partir da série diária já
  // agregada. Cada bloco é independente e só entra na lista se houver
  // dados suficientes para uma comparação minimamente confiável.
  _gerarInsights(linhas){
    const insights = [];
    if(linhas.length < 2) return insights;

    const NOMES_DIA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

    // --- Dia da semana mais forte / mais fraco (média de receita por dia) ---
    const porSemana = {};
    linhas.forEach(d=>{
      if(!porSemana[d.diaSemana]) porSemana[d.diaSemana] = { receita:0, dias:0 };
      porSemana[d.diaSemana].receita += d.receita;
      porSemana[d.diaSemana].dias    += 1;
    });
    const semanaArr = Object.entries(porSemana).map(([k,v])=>({
      dia: parseInt(k), nome: NOMES_DIA[k], receitaMedia: v.receita / v.dias,
    }));
    if(semanaArr.length >= 2){
      const mediaGeral = semanaArr.reduce((s,w)=>s+w.receitaMedia,0) / semanaArr.length;
      const melhor = [...semanaArr].sort((a,b)=>b.receitaMedia-a.receitaMedia)[0];
      const pior   = [...semanaArr].sort((a,b)=>a.receitaMedia-b.receitaMedia)[0];
      if(melhor.dia !== pior.dia){
        const diffMelhor = mediaGeral ? (melhor.receitaMedia/mediaGeral - 1)*100 : 0;
        const diffPior   = mediaGeral ? (1 - pior.receitaMedia/mediaGeral)*100 : 0;
        insights.push(`<strong>${melhor.nome}</strong> é o dia mais forte, com receita média de ${fmtR(melhor.receitaMedia)}${diffMelhor>1?` (${diffMelhor.toFixed(0)}% acima da média)`:''}.`);
        insights.push(`<strong>${pior.nome}</strong> é o dia mais fraco, com receita média de ${fmtR(pior.receitaMedia)}${diffPior>1?` (${diffPior.toFixed(0)}% abaixo da média)`:''}.`);
      }
    }

    // --- Tendência mês a mês (maior alta / maior queda no período filtrado) ---
    const porMes = new Map(); // 'YYYY-MM' -> {receita}
    linhas.forEach(d=>{
      const chave = d.iso.slice(0,7);
      if(!porMes.has(chave)) porMes.set(chave, { receita:0 });
      porMes.get(chave).receita += d.receita;
    });
    const mesesArr = [...porMes.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
    const nomeMes = chave => {
      const [y,m] = chave.split('-');
      return `${NOMES_MES[parseInt(m)-1]}/${y}`;
    };
    if(mesesArr.length >= 2){
      let maiorAlta = null, maiorQueda = null;
      for(let i=1;i<mesesArr.length;i++){
        const [chaveAtual, atual] = mesesArr[i];
        const [, anterior] = mesesArr[i-1];
        if(anterior.receita <= 0) continue;
        const variacao = (atual.receita/anterior.receita - 1) * 100;
        if(!maiorAlta  || variacao > maiorAlta.variacao)  maiorAlta  = { chave: chaveAtual, variacao };
        if(!maiorQueda || variacao < maiorQueda.variacao) maiorQueda = { chave: chaveAtual, variacao };
      }
      if(maiorAlta && maiorAlta.variacao > 0){
        insights.push(`<strong>${nomeMes(maiorAlta.chave)}</strong> teve o maior crescimento do período, ${maiorAlta.variacao.toFixed(0)}% acima do mês anterior.`);
      }
      if(maiorQueda && maiorQueda.variacao < 0 && maiorQueda.chave !== (maiorAlta && maiorAlta.chave)){
        insights.push(`<strong>${nomeMes(maiorQueda.chave)}</strong> teve a maior queda do período, ${Math.abs(maiorQueda.variacao).toFixed(0)}% abaixo do mês anterior.`);
      }
    }

    // --- Padrão histórico recorrente: mesmo mês-calendário em anos diferentes
    // sempre sobe (ou sempre cai) em relação ao mês anterior (ex: "dezembro
    // sempre cresce"). Só entra na lista com pelo menos 2 ocorrências
    // comparáveis do mesmo mês-calendário.
    const porNumeroMes = new Map(); // '01'..'12' -> [{ano, receita}]
    mesesArr.forEach(([chave, dados])=>{
      const [ano, mes] = chave.split('-');
      if(!porNumeroMes.has(mes)) porNumeroMes.set(mes, []);
      porNumeroMes.get(mes).push({ ano, receita: dados.receita });
    });
    porNumeroMes.forEach((ocorrencias, mes)=>{
      if(ocorrencias.length < 2) return;
      const variacoes = [];
      ocorrencias.forEach(oc=>{
        const mesAnteriorNum   = String(((parseInt(mes)+10)%12)+1).padStart(2,'0');
        const anoMesAnterior   = mesAnteriorNum === '12' ? String(parseInt(oc.ano)-1) : oc.ano;
        const anterior = porMes.get(`${anoMesAnterior}-${mesAnteriorNum}`);
        if(anterior && anterior.receita > 0) variacoes.push((oc.receita/anterior.receita - 1) * 100);
      });
      if(variacoes.length < 2) return;
      const media = variacoes.reduce((s,v)=>s+v,0) / variacoes.length;
      if(variacoes.every(v=>v>0)){
        insights.push(`<strong>${NOMES_MES[parseInt(mes)-1]}</strong> cresceu em relação ao mês anterior em todos os ${variacoes.length} anos analisados no período (crescimento médio de ${media.toFixed(0)}%).`);
      } else if(variacoes.every(v=>v<0)){
        insights.push(`<strong>${NOMES_MES[parseInt(mes)-1]}</strong> caiu em relação ao mês anterior em todos os ${variacoes.length} anos analisados no período (queda média de ${Math.abs(media).toFixed(0)}%).`);
      }
    });

    // --- Cancelamentos fora do padrão ---
    const totalCancel = linhas.reduce((s,d)=>s+d.cancelamentos,0);
    const totalVolume = linhas.reduce((s,d)=>s+d.volume,0);
    if(totalVolume > 0 && totalCancel > 0){
      const taxa = (totalCancel/totalVolume)*100;
      if(taxa > 5){
        insights.push(`A taxa de cancelamento no período está em ${taxa.toFixed(1)}%, acima do ideal — vale investigar operadores ou horários concentradores.`);
      }
    }

    return insights;
  },

  // Top 3 melhores + 3 piores dias por receita, cada um comparado com a
  // média diária do período (só considera dias com volume>0 — dias sem
  // nenhum pagamento não entram no ranking nem distorcem a média).
  _destaques(linhas){
    const diasComVolume = linhas.filter(d => d.volume > 0);
    if(diasComVolume.length === 0) return { media: 0, melhores: [], piores: [] };

    const media = diasComVolume.reduce((s,d)=>s+d.receita,0) / diasComVolume.length;
    const ordenados = [...diasComVolume].sort((a,b) => b.receita - a.receita);

    const comDiff = d => ({ ...d, diffPct: media ? ((d.receita/media - 1) * 100) : 0 });

    const melhores = ordenados.slice(0, 3).map(comDiff);
    const piores = ordenados.length > 3
      ? ordenados.slice(-3).reverse().map(comDiff) // do "menos pior" pro pior, sem repetir os já listados em melhores
      : [];
    // Evita duplicar dias quando há poucos dias no período (ex: 4-5 dias só)
    const idsMelhores = new Set(melhores.map(d=>d.iso));
    return { media, melhores, piores: piores.filter(d => !idsMelhores.has(d.iso)) };
  },

  // _decomposicaoTendencia / _fraseDecomposicao removidas em 05/08/2026 —
  // só a antiga aba "Análise Automática" usava (metade automática do filtro
  // global). "Números do Período" já cobre a comparação Atual vs. Base.

  // Concentração de receita (Pareto): quantos dias (dos dias com volume) são
  // necessários, somando do maior para o menor, para atingir 80% da receita
  // total do período. Mede o quanto o negócio depende de poucos dias fortes.
  _concentracaoReceita(linhas){
    const dias = linhas.filter(d => d.volume > 0);
    const receitaTotal = dias.reduce((s,d)=>s+d.receita,0);
    if(dias.length === 0 || receitaTotal <= 0) return null;

    const ordenados = [...dias].sort((a,b) => b.receita - a.receita);
    let acumulado = 0, count = 0;
    for(const d of ordenados){
      acumulado += d.receita;
      count++;
      if(acumulado / receitaTotal >= 0.8) break;
    }
    return { diasNecessarios: count, totalDias: dias.length, pctDias: (count/dias.length)*100 };
  },

  // Hora do dia (BRT) a partir de um timestamp — usado para achar as faixas
  // horárias de maior movimento (baseado na hora de ENTRADA, que é o que
  // importa pra decisão de escala de equipe).
  _horaBRT(ts){
    return parseInt(this._fmtHora.format(ts), 10);
  },

  // Curva de ocupação simultânea por hora — só considera tickets com
  // entrada e saída no MESMO dia (simplificação deliberada: mensalistas e
  // pernoites distorceriam a curva de pico horário e já são tratados à
  // parte pelas regras de permanência). Cada hora do intervalo [entrada,
  // saída] soma +1 veículo "dentro do pátio" naquele dia.
  _perfilOcupacao(pagos){
    const dias = new Set();
    const ocupPorHora = Array(24).fill(0);
    pagos.forEach(d=>{
      if(!d.timestampEntrada || !d.timestampSaida || isNaN(d.timestampSaida.getTime())) return;
      const isoE = this._isoBRT(d.timestampEntrada);
      const isoS = this._isoBRT(d.timestampSaida);
      if(isoE !== isoS) return;
      const hE = this._horaBRT(d.timestampEntrada);
      const hS = this._horaBRT(d.timestampSaida);
      if(hE<0 || hS<0 || hE>23 || hS>23) return;
      dias.add(isoE);
      for(let h=hE; h<=hS && h<24; h++) ocupPorHora[h] += 1;
    });
    const nDias = dias.size || 1;
    return Array.from({length:24}, (_,h) => ({ hora:h, mediaOcupacao: ocupPorHora[h]/nDias }));
  },

  // Agente de Capacidade e Ocupação — não depende do motor de eventos,
  // olha sempre para o período filtrado na tela (mesma base da Faixa
  // Horária de Pico). Sem um campo de "vagas totais" cadastrado por
  // filial, reporta em veículos simultâneos (absoluto), não em %.
  _analistaCapacidadeOcupacao(pagos, horaTop, horaTopSaida){
    const perfil = this._perfilOcupacao(pagos);
    const pico = perfil.reduce((m,h) => h.mediaOcupacao > m.mediaOcupacao ? h : m, perfil[0]);
    if(!pico || pico.mediaOcupacao < 1){
      return { analista:'Capacidade e Ocupação', icone:'', texto:'Volume insuficiente de tickets com entrada e saída no mesmo dia para estimar ocupação simultânea neste período.' };
    }
    const horaEntradaTop = horaTop[0]?.hora;
    const horaSaidaTop   = horaTopSaida[0]?.hora;
    const gargaloEntrada = horaEntradaTop != null && Math.abs(horaEntradaTop - pico.hora) <= 1;

    const partes = [`Pico de ocupação simultânea: ~${Math.round(pico.mediaOcupacao)} veículos por volta das ${String(pico.hora).padStart(2,'0')}h.`];
    partes.push(gargaloEntrada
      ? `Coincide com o pico de entradas — risco de fila na cancela nesse horário.`
      : `Sem sobreposição relevante entre pico de ocupação e pico de entradas.`);
    if(horaSaidaTop != null){
      partes.push(`Reforçar pista/caixa entre ${String(horaEntradaTop??pico.hora).padStart(2,'0')}h–${String((horaEntradaTop??pico.hora)+1).padStart(2,'0')}h (entrada) e ${String(horaSaidaTop).padStart(2,'0')}h–${String(horaSaidaTop+1).padStart(2,'0')}h (saída) reduz o maior risco de fila.`);
    }
    return {
      analista: 'Capacidade e Ocupação', icone: '',
      texto: partes.join(' '),
      dados: { pico, horaEntradaTop, horaSaidaTop, gargaloEntrada },
    };
  },

  // Top 3 faixas horárias de maior movimento (volume de entradas), com a
  // receita associada a cada faixa.
  _faixaHoraria(pagos){
    const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
    pagos.forEach(d=>{
      const h = this._horaBRT(d.timestampEntrada);
      if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
    });
    return porHora
      .map((v,h)=>({ hora:h, ...v }))
      .filter(h=>h.volume>0)
      .sort((a,b)=>b.volume-a.volume)
      .slice(0,3);
  },

  // Mesma lógica de _faixaHoraria, mas para o horário de SAÍDA — útil pra
  // entender quando o fluxo de veículos deixando a garagem é mais intenso
  // (ex: escala de equipe na saída, filas de caixa). Só considera tickets
  // pagos com data/hora de saída registrada (nem todo ticket tem).
  _faixaHorariaSaida(pagos){
    const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
    pagos.forEach(d=>{
      if(!d.timestampSaida || isNaN(d.timestampSaida.getTime())) return;
      const h = this._horaBRT(d.timestampSaida);
      if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
    });
    return porHora
      .map((v,h)=>({ hora:h, ...v }))
      .filter(h=>h.volume>0)
      .sort((a,b)=>b.volume-a.volume)
      .slice(0,3);
  },

  // Dias que fogem do padrão estatístico (>1,5 desvio-padrão da média de
  // receita diária), excluindo os que já aparecem em "Dias em Destaque" pra
  // não repetir a mesma informação de duas formas diferentes.
  _anomalias(linhas, destaques){
    const dias = linhas.filter(d => d.volume > 0);
    if(dias.length < 6) return [];

    const media = dias.reduce((s,d)=>s+d.receita,0) / dias.length;
    const variancia = dias.reduce((s,d)=>s+Math.pow(d.receita-media,2),0) / dias.length;
    const desvio = Math.sqrt(variancia);
    if(desvio === 0) return [];

    const jaDestacados = new Set([...destaques.melhores, ...destaques.piores].map(d=>d.iso));
    return dias
      .map(d => ({ ...d, z: (d.receita-media)/desvio }))
      .filter(d => Math.abs(d.z) >= 1.5 && !jaDestacados.has(d.iso))
      .sort((a,b) => Math.abs(b.z)-Math.abs(a.z))
      .slice(0,3);
  },

  // Converte as anomalias detectadas em frases no mesmo formato dos demais
  // insights, pra entrarem juntas na lista de Observações Automáticas.
  _anomaliasTexto(linhas, destaques){
    return this._anomalias(linhas, destaques).map(d => {
      const direcao = d.z >= 0 ? 'acima' : 'abaixo';
      return `<strong>${esc(d.dataStr)}</strong> fugiu do padrão: receita de ${fmtR(d.receita)}, ${Math.abs(d.z).toFixed(1)}x o desvio-padrão ${direcao} da média — vale conferir o que aconteceu nesse dia.`;
    });
  },

  /* ================== NEXUS INTELLIGENCE ENGINE ==================
     Conselho de analistas: primeiro detecta um EVENTO (variação de receita
     entre duas janelas comparáveis), e só então aciona cada analista para
     investigar esse mesmo evento sob um ângulo específico. O Analista
     Executivo sintetiza os vereditos num resumo — não gera texto solto.
     Abaixo do limiar (LIMIAR_EVENTO_PCT), o conselho não é acionado e o
     módulo segue mostrando apenas o resumo padrão (painéis existentes).
     ================================================================== */

  _isoDoPago(d){
    return this._isoBRT(d.timestampPagamento);
  },

  // Resumo leve de um ticket pra exibição na trilha de auditoria (modal +
  // Excel) — usa os formatadores cacheados do módulo, nunca instancia
  // Intl.DateTimeFormat dentro do loop que chama isso (regra de performance
  // do Blueprint, seção 5).
  _ticketResumo(d){
    return {
      ticket: d.ticket || '—',
      data: d.dataPagamentoStr || this._isoDoPago(d),
      hora: this._fmtHoraMin.format(d.timestampPagamento),
      placa: d.placa || '—',
      operador: d.usuarioPagamento || '—',
      valor: d.valorPago || 0,
      motivo: d.detalhe || '—',
    };
  },

  // Agrega um conjunto de dias (linhas já processadas por _agregarPorDia) em
  // métricas médias — usado para comparar duas janelas de forma homogênea,
  // independente de quantos dias cada uma tenha.
  _agregarJanela(dias){
    const n = dias.length;
    if(!n) return null;
    const receita        = dias.reduce((s,d)=>s+d.receita,0);
    const volume         = dias.reduce((s,d)=>s+d.volume,0);
    const permSoma       = dias.reduce((s,d)=>s+d.permSoma,0);
    const cancelamentos  = dias.reduce((s,d)=>s+d.cancelamentos,0);
    return {
      dias, nDias: n,
      inicio: dias[0].dataStr, fim: dias[n-1].dataStr,
      receitaMediaDia:  receita / n,
      volumeMedioDia:   volume / n,
      ticketMedio:      volume ? receita / volume : 0,
      permanenciaMedia: volume ? permSoma / volume : 0,
      cancelamentos,
      taxaCancelamento: (volume + cancelamentos) > 0 ? (cancelamentos / (volume + cancelamentos)) * 100 : 0,
    };
  },

  // Dataset completo, ignorando os filtros globais ativos (data/dia da
  // semana) — a comparação por mês é sempre feita sobre o relatório
  // inteiro, não sobre o recorte filtrado na tela. Calculada UMA vez por
  // render (o chamador guarda o resultado e reaproveita), nunca recalculada
  // dentro de _construirEvento/_mesesDisponiveis.
  _linhasCompletas(){
    const pagos = Nexus.rawData.filter(d => d.isPago);
    const cancelados = Nexus.rawData.filter(d =>
      d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
    );
    return this._agregarPorDia(pagos, cancelados);
  },

  // Meses disponíveis no dataset completo — usado só pra sugerir defaults
  // sensatos no filtro do Comparativo (não é mais uma opção de UI).
  _mesesDisponiveis(linhasCompletas){
    const set = new Set(linhasCompletas.filter(d=>d.volume>0).map(d=>d.iso.slice(0,7)));
    return Array.from(set).sort().reverse();
  },

  // Pré-preenche o filtro do Comparativo com os 2 meses mais recentes do
  // relatório completo, só na primeira vez (depois disso, mesmo que o
  // usuário limpe os campos, não volta a forçar um valor sozinho).
  _garantirDefaultsComparativo(linhasCompletas){
    const c = this._comparativo;
    if(c.inicializado) return;
    c.inicializado = true;
    const meses = this._mesesDisponiveis(linhasCompletas);
    if(!meses.length) return;
    const diasDoMes = ym => linhasCompletas
      .filter(d => d.volume>0 && d.iso.slice(0,7)===ym)
      .map(d=>d.iso).sort();
    const diasAtual = diasDoMes(meses[0]);
    if(diasAtual.length){ c.atual.inicio = diasAtual[0]; c.atual.fim = diasAtual[diasAtual.length-1]; }
    if(meses.length > 1){
      const diasBase = diasDoMes(meses[1]);
      if(diasBase.length){ c.base.inicio = diasBase[0]; c.base.fim = diasBase[diasBase.length-1]; }
    }
  },

  // _construirEventoDentroDoPeriodo removida em 05/08/2026 — era usada só
  // pela antiga aba "Análise Automática" (dividia o filtro global ao meio).
  // O único evento que existe agora é o do Comparativo, abaixo.

  // Aba "Comparativo": dois períodos LIVRES escolhidos pelo usuário (não
  // precisam ser mês fechado), com dia da semana compartilhado — sempre
  // sobre o dataset completo, ignora os filtros globais da tela.
  _construirEventoComparativo(linhasCompletas){
    const c = this._comparativo;
    if(!c.atual.inicio || !c.atual.fim || !c.base.inicio || !c.base.fim) return null;
    const filtrar = (inicio, fim) => linhasCompletas
      .filter(d => d.volume > 0 && d.iso >= inicio && d.iso <= fim && c.weekdays.has(d.diaSemana))
      .sort((a,b) => a.iso.localeCompare(b.iso));
    const diasAtual = filtrar(c.atual.inicio, c.atual.fim);
    const diasBase  = filtrar(c.base.inicio, c.base.fim);
    if(diasAtual.length < 2 || diasBase.length < 2) return null;
    const agAtual = this._agregarJanela(diasAtual);
    const agBase  = this._agregarJanela(diasBase);
    return {
      agAtual, agBase,
      labelAtual: `${c.atual.inicio} a ${c.atual.fim}`,
      labelBase:  `${c.base.inicio} a ${c.base.fim}`,
      varReceita: agBase.receitaMediaDia ? ((agAtual.receitaMediaDia / agBase.receitaMediaDia) - 1) * 100 : 0,
    };
  },

  // ---- Analistas: cada um investiga o MESMO evento sob um ângulo próprio ----

  _analistaFinanceiro(evento){
    const { agAtual, agBase, varReceita } = evento;
    const direcao   = varReceita >= 0 ? 'cresceu' : 'caiu';
    const varVolume = agBase.volumeMedioDia ? ((agAtual.volumeMedioDia / agBase.volumeMedioDia) - 1) * 100 : 0;
    const varTicket = agBase.ticketMedio    ? ((agAtual.ticketMedio    / agBase.ticketMedio)    - 1) * 100 : 0;
    const fatorVolumeDominante = Math.abs(varVolume) >= Math.abs(varTicket);
    const impactoRS = (agAtual.receitaMediaDia - agBase.receitaMediaDia) * agAtual.nDias;
    return {
      analista: 'Financeiro', icone: '',
      texto: `Receita ${direcao} ${Math.abs(varReceita).toFixed(1)}% (${impactoRS>=0?'+':'-'}${fmtR(Math.abs(impactoRS))}), puxada principalmente pel${fatorVolumeDominante?'o fluxo de veículos':'o ticket médio'} (volume ${varVolume>=0?'+':''}${varVolume.toFixed(1)}%, ticket ${varTicket>=0?'+':''}${varTicket.toFixed(1)}%).`,
      dados: { varReceita, varVolume, varTicket, fatorVolumeDominante, impactoRS },
    };
  },

  _analistaOperacional(evento, pagos){
    const isoAtual = new Set(evento.agAtual.dias.map(d=>d.iso));
    const isoBase  = new Set(evento.agBase.dias.map(d=>d.iso));
    const perfil = (isoSet, nDias) => {
      const porHora = Array.from({length:24}, () => ({ volume:0, receita:0 }));
      pagos.forEach(d=>{
        if(!isoSet.has(this._isoDoPago(d))) return;
        const h = this._horaBRT(d.timestampEntrada);
        if(h>=0 && h<24){ porHora[h].volume += 1; porHora[h].receita += d.valorPago; }
      });
      return porHora.map((v,h)=>({ hora:h, receitaMediaDia: v.receita/nDias }));
    };
    const perfAtual = perfil(isoAtual, evento.agAtual.nDias);
    const perfBase  = perfil(isoBase,  evento.agBase.nDias);

    // Rotatividade (05/08/2026): giro de veículos por vaga/dia = volume médio diário
    // ÷ quantidade de vagas cadastrada na filial (na_filiais.vagas). Só entra no texto
    // se a filial tiver vagas cadastradas — senão fica em silêncio nesse ponto (a
    // ausência de cadastro não deve ser lida como "rotatividade zero").
    const vagas = Nexus._filialAtual?.vagas;
    let textoRotatividade = '';
    if(vagas && vagas > 0){
      const rotAtual = evento.agAtual.volumeMedioDia / vagas;
      const rotBase  = evento.agBase.volumeMedioDia  / vagas;
      const varRot   = rotBase ? ((rotAtual/rotBase)-1)*100 : 0;
      textoRotatividade = ` Rotatividade: ${rotAtual.toFixed(1)}× por vaga/dia no período atual vs. ${rotBase.toFixed(1)}× no histórico (${varRot>=0?'+':''}${varRot.toFixed(1)}%).`;
    }

    // Delta de receita/dia por hora — identifica a(s) hora(s) que mais
    // explicam a variação total (mesmo sinal do delta total do evento).
    const deltas = perfAtual.map((h,i) => ({ hora: h.hora, delta: h.receitaMediaDia - perfBase[i].receitaMediaDia }));
    const deltaTotal = deltas.reduce((s,d)=>s+d.delta,0);
    const relevantes = deltas.filter(d => Math.sign(d.delta) === Math.sign(deltaTotal) && d.delta !== 0);
    relevantes.sort((a,b) => Math.abs(b.delta) - Math.abs(a.delta));
    const top = relevantes.slice(0,3);

    if(!top.length || Math.abs(deltaTotal) < 1){
      return { analista:'Operacional', icone:'', texto:'A variação ficou distribuída ao longo do dia, sem uma faixa horária concentradora identificável.'+textoRotatividade };
    }
    const somaTop       = top.reduce((s,d)=>s+d.delta,0);
    const pctExplicado  = deltaTotal ? (somaTop/deltaTotal)*100 : 0;
    const horaMin       = Math.min(...top.map(t=>t.hora));
    const horaMax       = Math.max(...top.map(t=>t.hora));
    const contiguo      = (horaMax - horaMin) <= 3;
    const direcaoTexto  = deltaTotal >= 0 ? 'concentrou-se' : 'ocorreu principalmente';
    const faixaTexto    = contiguo
      ? `entre ${String(horaMin).padStart(2,'0')}h e ${String(horaMax+1).padStart(2,'0')}h`
      : `principalmente por volta de ${top.map(t=>String(t.hora).padStart(2,'0')+'h').join(', ')}`;
    return {
      analista: 'Operacional', icone: '',
      texto: `A ${deltaTotal>=0?'alta':'redução'} ${direcaoTexto} ${faixaTexto}`
        + (pctExplicado >= 40 ? ` (responsável por ~${pctExplicado.toFixed(0)}% da variação total)` : '')
        + '. O restante do dia ficou dentro da média.'
        + textoRotatividade,
      dados: { top, pctExplicado, contiguo, horaMin, horaMax },
    };
  },

  // Corrigido 05/08/2026: antes usava sempre os últimos 30 dias do array recebido,
  // independente do tamanho real do período em análise — numa comparação de 6 meses,
  // isso descartava 150+ dias de dado sem avisar. Agora usa a união exata de
  // período atual + período base (o que está de fato sendo comparado), dividida
  // em 3 blocos proporcionais ao tamanho real do período.
  _analistaTendencia(linhas, evento){
    const isoRelevante = new Set([...evento.agAtual.dias.map(d=>d.iso), ...evento.agBase.dias.map(d=>d.iso)]);
    const dias = linhas.filter(d => d.volume > 0 && isoRelevante.has(d.iso)).sort((a,b) => a.iso.localeCompare(b.iso));
    if(dias.length < 9){
      return { analista:'Tendências', icone:'', texto:'Histórico insuficiente no período analisado para avaliar se há tendência — o evento será tratado como pontual.' };
    }
    const terco  = Math.floor(dias.length/3);
    const blocos = [dias.slice(0,terco), dias.slice(terco,terco*2), dias.slice(terco*2)];
    const medias = blocos.map(b => b.reduce((s,d)=>s+d.receita,0)/b.length);
    const quedaConsistente = medias[0] > medias[1] && medias[1] > medias[2];
    const altaConsistente  = medias[0] < medias[1] && medias[1] < medias[2];
    if(quedaConsistente || altaConsistente){
      return {
        analista: 'Tendências', icone:'',
        texto: `Existe tendência de ${quedaConsistente?'queda':'alta'} consistente ao longo do período analisado (${dias.length} dias) — o comportamento não parece pontual, e sim parte de um movimento contínuo.`,
        dados: { medias, tendencia: quedaConsistente ? 'queda' : 'alta' },
      };
    }
    return {
      analista: 'Tendências', icone:'',
      texto: `Não existe tendência consistente ao longo do período analisado (${dias.length} dias). O comportamento parece pontual.`,
      dados: { medias, tendencia: 'pontual' },
    };
  },

  // Aproximação Abramowitz-Stegun da função de distribuição normal acumulada —
  // sem dependência externa, só matemática pura. Usada pra traduzir z-score em
  // p-valor aproximado (item 4 do upgrade "de mercado" do Estatístico, 05/08/2026).
  _normCDF(z){
    const x = z / Math.SQRT2;
    const t = 1/(1+0.3275911*Math.abs(x));
    const y = 1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
    return 0.5*(1+Math.sign(x)*y);
  },

  // Upgrade "de mercado" (05/08/2026) — auditoria contra as atribuições reais de
  // um Analista Estatístico apontou 5 lacunas, todas corrigidas aqui:
  // 1. Erro-padrão da média (não desvio-padrão bruto) — o período atual é uma
  //    média de N dias, não um dia isolado; o teste estatisticamente correto
  //    usa desvio ÷ √N, senão eventos maiores e menores recebem o mesmo peso.
  // 2. Robustez a outlier — mediana/MAD como checagem cruzada da média/desvio;
  //    avisa quando um dia fora da curva pode estar distorcendo a baseline.
  // 3. Nível de confiança no texto, baseado no tamanho real da amostra.
  // 4. P-valor aproximado — traduz o z-score em "chance de ser coincidência",
  //    mais direto que um número cru de desvios-padrão.
  // 5. Controle por dia da semana — compara só contra os mesmos dias da semana
  //    do período atual (evita comparar fim de semana contra mix de dias úteis);
  //    cai de volta pro histórico completo se isso encolher demais a amostra.
  _analistaEstatistico(linhas, evento){
    const diasTodos = linhas.filter(d => d.volume > 0);
    const isoEvento = new Set(evento.agAtual.dias.map(d=>d.iso));
    const historicoTodos = diasTodos.filter(d => !isoEvento.has(d.iso));

    const diasSemanaEvento = new Set(evento.agAtual.dias.map(d=>d.diaSemana));
    const historicoMesmoDia = historicoTodos.filter(d => diasSemanaEvento.has(d.diaSemana));
    const usouControleDia = historicoMesmoDia.length >= 5;
    const historico = usouControleDia ? historicoMesmoDia : historicoTodos;

    if(historico.length < 5){
      return { analista:'Estatístico', icone:'', texto:'Amostra histórica insuficiente para calcular significância estatística com confiança.' };
    }

    const n         = historico.length;
    const media     = historico.reduce((s,d)=>s+d.receita,0) / n;
    const variancia = historico.reduce((s,d)=>s+Math.pow(d.receita-media,2),0) / n;
    const desvio    = Math.sqrt(variancia);

    const ordenados = historico.map(d=>d.receita).sort((a,b)=>a-b);
    const mediana   = n % 2 ? ordenados[(n-1)/2] : (ordenados[n/2-1]+ordenados[n/2])/2;
    const desviosAbs = ordenados.map(v=>Math.abs(v-mediana)).sort((a,b)=>a-b);
    const mad = n % 2 ? desviosAbs[(n-1)/2] : (desviosAbs[n/2-1]+desviosAbs[n/2])/2;
    const distorcaoOutlier = desvio > 0 && Math.abs(media-mediana) > 0.5*desvio;

    const nAtual      = evento.agAtual.nDias || 1;
    const erroPadrao  = desvio / Math.sqrt(nAtual);
    const z           = erroPadrao ? (evento.agAtual.receitaMediaDia - media) / erroPadrao : 0;
    const direcao     = z >= 0 ? 'acima' : 'abaixo';
    const relevante   = Math.abs(z) >= 1.5;
    const pValor      = 2 * (1 - this._normCDF(Math.abs(z)));
    const confianca   = n >= 30 ? 'alta' : n >= 10 ? 'moderada' : 'baixa';

    let texto = relevante
      ? `Esse resultado está ${Math.abs(z).toFixed(1)} erros-padrão ${direcao} da média histórica — ~${(pValor*100).toFixed(1)}% de chance de ser coincidência. Vale investigar.`
      : `A variação está dentro do range estatisticamente normal (${Math.abs(z).toFixed(1)} erro-padrão ${direcao} da média, ~${(pValor*100).toFixed(0)}% de chance de ser só coincidência).`;
    texto += ` Confiança ${confianca} (baseada em ${n} dias de histórico${usouControleDia ? ', mesmos dias da semana do período atual' : ''}).`;
    if(distorcaoOutlier){
      texto += ` Atenção: a média histórica pode estar puxada por um dia fora da curva (mediana ${fmtR(mediana)} vs. média ${fmtR(media)}) — trate esse resultado com cautela.`;
    }

    return {
      analista: 'Estatístico', icone:'',
      texto,
      dados: { z, media, desvio, erroPadrao, pValor, n, confianca, mediana, mad, usouControleDia },
    };
  },

  // Lei de Benford REMOVIDA em 05/08/2026 — testada e descartada. Pressupõe
  // valores "orgânicos" cobrindo várias ordens de grandeza; preço de
  // estacionamento vem de tabela fixa com poucos valores possíveis, repetidos
  // exaustivamente. Simulação com dados 100% legítimos (tabela de 7 valores
  // fixos, pesos realistas) deu 100% de falso positivo em 500 rodadas, em
  // n=50/100/300/1000 — incompatibilidade estrutural, não questão de limiar.
  // Não reintroduzir sem repensar a técnica pro domínio (ex: valores fora da
  // tabela de preço cadastrada seria um teste de controle mais apropriado).

  // Aprofundado em 05/08/2026, ajustado no mesmo dia: os 5 sinais abaixo olham o
  // PERÍODO INTEIRO da comparação (união de período atual + período base), não só
  // a metade mais recente — decisão de produto confirmada após um caso real onde
  // um padrão de reincidência de placa ficou parcialmente invisível por cair dos
  // dois lados da divisão atual/base. Só a frase de taxa de cancelamento continua
  // comparando atual vs. base, porque esse é o próprio conceito do "evento".
  // Upgrade "de mercado" (05/08/2026, rodada 2): Lei de Benford nos valores pagos
  // + materialidade em R$ — os sinais de concentração (operador/hora/motivo) só
  // disparam se o valor financeiro envolvido cruzar um piso mínimo (evita alarme
  // por algo estatisticamente "concentrado" mas financeiramente irrelevante).
  // Trilha de auditoria (05/08/2026, rodada 3): cada achado agora carrega a
  // lista exata de tickets que o compõem (não só o texto) — vira "Ver tickets"
  // no modal e uma aba extra no Excel exportado. achados vira array de objetos
  // { texto, titulo, tickets } em vez de array de strings.
  _analistaAuditoria(evento, cancelados){
    const { agAtual, agBase } = evento;
    const diffPP = agAtual.taxaCancelamento - agBase.taxaCancelamento;
    const aumentoRelevante = diffPP >= 2 && agAtual.taxaCancelamento > agBase.taxaCancelamento * 1.3;

    const isoTotal = new Set([...agAtual.dias.map(d=>d.iso), ...agBase.dias.map(d=>d.iso)]);
    const canceladosTotal = (cancelados||[]).filter(d => isoTotal.has(this._isoDoPago(d)));
    const nDiasTotal = agAtual.nDias + agBase.nDias;

    const MATERIALIDADE_MIN = 20; // R$ — piso abaixo do qual um achado "concentrado" não é reportado, por falta de peso financeiro real

    const achados = [];

    achados.push({
      texto: aumentoRelevante
        ? `A taxa de cancelamento subiu de ${agBase.taxaCancelamento.toFixed(1)}% para ${agAtual.taxaCancelamento.toFixed(1)}%.`
        : `A taxa de cancelamento (${agAtual.taxaCancelamento.toFixed(1)}%) está estável frente ao histórico (${agBase.taxaCancelamento.toFixed(1)}%).`,
      titulo: null, tickets: null, // não é um achado "de tickets" específico — é uma taxa agregada
    });

    const contarPor = (lista, campo) => {
      const m = {};
      lista.forEach(d => { const k = (d[campo]||'').trim() || '—'; m[k] = (m[k]||0)+1; });
      return m;
    };
    const somarValor = (lista, campo, chave) =>
      lista.filter(d => ((d[campo]||'').trim() || '—') === chave).reduce((s,d)=>s+d.valorPago,0);
    const filtrarPor = (lista, campo, chave) =>
      lista.filter(d => ((d[campo]||'').trim() || '—') === chave);

    if(canceladosTotal.length >= 1){
      // --- Concentração por operador (com piso de materialidade) ---
      const mapaOp = contarPor(canceladosTotal, 'usuarioPagamento');
      const [topOp, topCountOp] = Object.entries(mapaOp).sort((a,b)=>b[1]-a[1])[0];
      const pctTop = (topCountOp / canceladosTotal.length) * 100;
      const valorOp = somarValor(canceladosTotal, 'usuarioPagamento', topOp);
      if(pctTop >= 40 && valorOp >= MATERIALIDADE_MIN){
        achados.push({
          texto: `O operador <strong>${esc(topOp)}</strong> concentra ${pctTop.toFixed(0)}% dos cancelamentos do período inteiro (${topCountOp} de ${canceladosTotal.length}, ${fmtR(valorOp)} envolvidos) — vale checar.`,
          titulo: `Cancelamentos do operador ${topOp}`,
          tickets: filtrarPor(canceladosTotal, 'usuarioPagamento', topOp).map(d=>this._ticketResumo(d)),
        });
      }

      // --- Faixa horária de cancelamento (com piso de materialidade) ---
      const porHora = Array.from({length:24}, () => 0);
      canceladosTotal.forEach(d => { const h = this._horaBRT(d.timestampPagamento); if(h>=0 && h<24) porHora[h]++; });
      const maxIdx = porHora.indexOf(Math.max(...porHora));
      const pctMax = (porHora[maxIdx] / canceladosTotal.length) * 100;
      const ticketsHora = canceladosTotal.filter(d => this._horaBRT(d.timestampPagamento) === maxIdx);
      const valorHora = ticketsHora.reduce((s,d)=>s+d.valorPago,0);
      if(pctMax >= 35 && valorHora >= MATERIALIDADE_MIN){
        achados.push({
          texto: `${pctMax.toFixed(0)}% dos cancelamentos do período inteiro aconteceram por volta de ${String(maxIdx).padStart(2,'0')}h (${fmtR(valorHora)} envolvidos) — concentração fora do normal.`,
          titulo: `Cancelamentos por volta de ${String(maxIdx).padStart(2,'0')}h`,
          tickets: ticketsHora.map(d=>this._ticketResumo(d)),
        });
      }

      // --- Valor perdido no período inteiro (com piso de materialidade) ---
      const valorTotal = canceladosTotal.reduce((s,d)=>s+d.valorPago,0);
      if(valorTotal >= MATERIALIDADE_MIN){
        achados.push({
          texto: `A receita perdida em cancelamentos no período inteiro foi de ${fmtR(valorTotal)}${nDiasTotal ? ` (${fmtR(valorTotal/nDiasTotal)}/dia em média)` : ''}.`,
          titulo: 'Cancelamentos com valor perdido no período',
          tickets: canceladosTotal.map(d=>this._ticketResumo(d)),
        });
      }

      // --- Reincidência de placa (sem piso — comportamento repetido importa mesmo com valor baixo) ---
      const porPlaca = contarPor(canceladosTotal, 'placa');
      const reincidentes = Object.entries(porPlaca).filter(([placa,n]) => placa !== '—' && n >= 3).sort((a,b)=>b[1]-a[1]);
      if(reincidentes.length){
        const [placaTop, nTop] = reincidentes[0];
        const ticketsPlaca = filtrarPor(canceladosTotal, 'placa', placaTop);
        const valorPlaca = ticketsPlaca.reduce((s,d)=>s+d.valorPago,0);
        achados.push({
          texto: `A placa <strong>${esc(placaTop)}</strong> cancelou ${nTop} vezes no período inteiro (${fmtR(valorPlaca)} envolvidos) — pode indicar teste do sistema ou uso indevido.`,
          titulo: `Cancelamentos da placa ${placaTop}`,
          tickets: ticketsPlaca.map(d=>this._ticketResumo(d)),
        });
      }

      // --- Motivo dominante (campo DETALHE, com piso de materialidade) ---
      const mapaMotivo = contarPor(canceladosTotal, 'detalhe');
      const [topMotivo, topCountM] = Object.entries(mapaMotivo).sort((a,b)=>b[1]-a[1])[0];
      if(topMotivo !== '—'){
        const pctMotivo = (topCountM / canceladosTotal.length) * 100;
        const ticketsMotivo = filtrarPor(canceladosTotal, 'detalhe', topMotivo);
        const valorMotivo = ticketsMotivo.reduce((s,d)=>s+d.valorPago,0);
        if(pctMotivo >= 40 && valorMotivo >= MATERIALIDADE_MIN){
          achados.push({
            texto: `O motivo <strong>"${esc(topMotivo)}"</strong> responde por ${pctMotivo.toFixed(0)}% dos cancelamentos do período inteiro (${fmtR(valorMotivo)} envolvidos).`,
            titulo: `Cancelamentos com motivo "${topMotivo}"`,
            tickets: ticketsMotivo.map(d=>this._ticketResumo(d)),
          });
        }
      }
    }

    if(achados.length === 1 && !aumentoRelevante){
      achados.push({ texto: 'Não há indícios de inconsistências operacionais nos cancelamentos deste período.', titulo: null, tickets: null });
    }

    return {
      analista: 'Auditoria', icone:'',
      texto: achados.map(a=>a.texto).join(' '),
      achadosDetalhados: achados,
      dados: { diffPP },
    };
  },

  // O Executivo NÃO investiga nada por conta própria — ele só ouve os
  // outros analistas e sintetiza os vereditos, na ordem: fator dominante →
  // auditoria → tendência → recomendação.
  _analistaExecutivo(evento, vereditos){
    const financeiro  = vereditos.find(v => v.analista === 'Financeiro');
    const operacional = vereditos.find(v => v.analista === 'Operacional');
    const tendencia   = vereditos.find(v => v.analista === 'Tendências');
    const estatistico = vereditos.find(v => v.analista === 'Estatístico');
    const auditoria   = vereditos.find(v => v.analista === 'Auditoria');
    const direcao = evento.varReceita >= 0 ? 'Aumento' : 'Redução';
    const janelaOperacional = (operacional.dados && operacional.dados.contiguo)
      ? ` entre ${String(operacional.dados.horaMin).padStart(2,'0')}h e ${String(operacional.dados.horaMax+1).padStart(2,'0')}h`
      : '';

    const partes = [
      `${direcao} de ${Math.abs(evento.varReceita).toFixed(1)}% na receita, puxada principalmente ${financeiro.dados.fatorVolumeDominante ? 'pelo fluxo de veículos' : 'pelo ticket médio'}${janelaOperacional}.`,
    ];

    const cancelamentoSubiu = auditoria.dados.diffPP >= 2;
    const temTendencia      = tendencia.dados && tendencia.dados.tendencia !== 'pontual';
    const foraDoRange       = estatistico.dados && Math.abs(estatistico.dados.z) >= 1.5;

    if(!cancelamentoSubiu && !temTendencia && !foraDoRange){
      partes.push('Sem aumento de cancelamentos, tendência de repetição ou desvio estatístico relevante — evento aparenta ser pontual e dentro do range normal.');
    } else {
      if(cancelamentoSubiu) partes.push('Cancelamentos subiram no período — vale checar.');
      if(temTendencia)      partes.push(`Faz parte de uma tendência de ${tendencia.dados.tendencia}, não é pontual.`);
      if(foraDoRange)       partes.push('Estatisticamente fora do range normal — vale investigar fatores externos.');
    }

    return partes.join(' ');
  },

  _conselhoAnalistas(linhas, pagos, cancelados, evento){
    const vereditos = [
      this._analistaFinanceiro(evento),
      this._analistaOperacional(evento, pagos),
      this._analistaEstatistico(linhas, evento),
      this._analistaAuditoria(evento, cancelados),
      this._analistaTendencia(linhas, evento),
    ];
    return { vereditos, resumoExecutivo: this._analistaExecutivo(evento, vereditos) };
  },

  // O conselho SEMPRE aparece quando há dados suficientes para montar o
  // evento — cada analista informa o que encontrou, mesmo quando a
  // resposta é "nada fora do padrão". O status (relevante/atenção/normal) só muda o
  // selo/cor, não a visibilidade da análise.
  // Cruza a variação percentual (contra o limiar fixo) com o desvio-padrão
  // histórico já calculado pelo Analista Estatístico — sem isso, o badge
  // dizia "dentro do esperado" sem nenhuma explicação, e podia até
  // contradizer o próprio Analista Estatístico logo abaixo (uma variação
  // pequena em % pode ser estatisticamente incomum se o histórico da
  // filial for muito estável).
  // Selo direcional (05/08/2026): antes usava Math.abs(variação), então uma ALTA
  // de receita acima do limiar também acendia vermelho — confuso, já que vermelho
  // deveria sinalizar problema, não qualquer desvio grande. Agora é exclusivo
  // de QUEDA acima do limiar; alta acima do limiar vira (bom resultado, mas
  // ainda vale registrar que é um evento fora do normal).
  _statusEvento(evento, conselho){
    const estatistico   = conselho?.vereditos.find(v => v.analista === 'Estatístico');
    const z             = estatistico?.dados?.z;
    const acimaLimiar    = Math.abs(evento.varReceita) >= this.LIMIAR_EVENTO_PCT;
    const zIncomum       = typeof z === 'number' && Math.abs(z) >= 1.5;
    const ehQueda        = evento.varReceita < 0;

    if(acimaLimiar){
      return ehQueda
        ? {
            status:'relevante', icone:'', cor:'var(--danger)',
            motivo: `queda acima do limiar de ${this.LIMIAR_EVENTO_PCT}% definido para sinalizar eventos`,
          }
        : {
            status:'relevante', icone:'', cor:'var(--accent2)',
            motivo: `alta acima do limiar de ${this.LIMIAR_EVENTO_PCT}% definido para sinalizar eventos`,
          };
    }
    if(zIncomum){
      return {
        status:'atencao', icone:'', cor:'var(--warn)',
        motivo: `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}%, mas incomum frente ao histórico (${Math.abs(z).toFixed(1)} erros-padrão)`,
      };
    }
    return {
      status:'normal', icone:'', cor:'var(--accent2)',
      motivo: typeof z === 'number'
        ? `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}% e dentro da variação histórica esperada (${Math.abs(z).toFixed(1)} erro-padrão)`
        : `abaixo do limiar de ${this.LIMIAR_EVENTO_PCT}% definido para sinalizar eventos`,
    };
  },

                          : ''}

                  : `<div style="font-size:13px;line-height:1.6;">${v.texto}</div>`}

  // ── MODAL DE TRILHA DE AUDITORIA (lista de tickets por achado) ──────────
  _abrirModalTrilhaAuditoria(titulo, tickets){
    const overlay = document.createElement('div');
    overlay.id = 'modal-trilha-auditoria';

        <td>${esc(t.hora)}</td>
        <td>${esc(t.placa)}</td>
        <td>${esc(t.operador)}</td>
        <td>${fmtR(t.valor)}</td>
        <td>${esc(t.motivo)}</td>

    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:14px;width:100%;max-width:820px;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);">

            <tbody>${linhas}</tbody>

        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:16px;">
          <button id="modal-fechar-2" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Fechar</button>

  },

  // Liga os botões "Ver N tickets" do card do conselho ao modal de trilha —
  // chamado depois do innerHTML que contém _renderConselho(), nas duas abas.
  _bindTrilhaAuditoria(container, conselho){
    if(!conselho) return;
    const auditor = conselho.vereditos.find(v => v.analista === 'Auditoria');
    if(!auditor || !auditor.achadosDetalhados) return;
    container.querySelectorAll('.btn-ver-trilha').forEach(btn => {
      btn.onclick = () => {
        const idx = parseInt(btn.dataset.achadoIdx, 10);
        const achado = auditor.achadosDetalhados[idx];
        if(achado && achado.tickets) this._abrirModalTrilhaAuditoria(achado.titulo, achado.tickets);
      };
    });
  },

            <div class="chip-row" id="cmp-weekday-chips">
              ${['D','S','T','Q','Q','S','S'].map((d,i)=>`<div class="chip ${c.weekdays.has(i)?'on':''}" data-day="${i}">${d}</div>`).join('')}
            </div>
          </div>

  _wireFiltroComparativo(el){
    const c = this._comparativo;
    const rerender = () => this._renderComparativo(el);
    el.querySelector('#cmp-atual-ini').onchange = e => { c.atual.inicio = e.target.value || null; rerender(); };
    el.querySelector('#cmp-atual-fim').onchange = e => { c.atual.fim   = e.target.value || null; rerender(); };
    el.querySelector('#cmp-base-ini').onchange  = e => { c.base.inicio = e.target.value || null; rerender(); };
    el.querySelector('#cmp-base-fim').onchange  = e => { c.base.fim   = e.target.value || null; rerender(); };
    el.querySelectorAll('#cmp-weekday-chips .chip').forEach(chip=>{
      chip.onclick = () => {
        const day = parseInt(chip.dataset.day, 10);
        chip.classList.toggle('on');
        if(chip.classList.contains('on')) c.weekdays.add(day);
        else c.weekdays.delete(day);
        rerender();
      };
    });
    el.querySelector('#cmp-limpar').onclick = () => {
      // inicializado fica true — "limpar" não deve voltar a forçar os
      // defaults automáticos, senão o botão parece não fazer nada.
      this._comparativo = { atual:{inicio:null,fim:null}, base:{inicio:null,fim:null}, weekdays:new Set([0,1,2,3,4,5,6]), inicializado:true };
      rerender();
    };
  },

  // Números crus dos dois períodos, lado a lado — pro usuário conferir

          <div class="kpi-card" style="border-left:3px solid var(--danger);"><div class="lbl">Cancelamentos</div><div class="val">${cancel.toLocaleString('pt-BR')}</div></div>
        </div>
      </div>`;

    return `
      <div class="panel" style="margin-bottom:14px;">
        <h2>Números do Período</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 16px;">Período Atual: ${esc(evento.labelAtual)} · Período Base: ${esc(evento.labelBase)}.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          ${coluna('Período Atual', 'var(--accent)', volA, recA, a.ticketMedio, a.receitaMediaDia, a.nDias, paretoA, a.cancelamentos)}
          ${coluna('Período Base', 'var(--muted)', volB, recB, b.ticketMedio, b.receitaMediaDia, b.nDias, paretoB, b.cancelamentos)}
        </div>

  },

  _renderFaixaHorariaColuna(label, horaTop, horaTopSaida){
    const tabela = (lista) => lista.length ? `
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Horário</th><th>Volume</th><th>Receita</th></tr></thead>
          <tbody>${lista.map(h=>`<tr><td>${String(h.hora).padStart(2,'0')}h–${String((h.hora+1)%24).padStart(2,'0')}h</td><td>${h.volume}</td><td>${fmtR(h.receita)}</td></tr>`).join('')}</tbody>
        </table>
      </div>` : `<p style="color:var(--muted);font-size:12px;margin:0 0 12px;">Sem dado suficiente.</p>`;
    return `
      <div>
        <h3 style="font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;">${esc(label)}</h3>
        <h4 style="font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px;">Pico de Entrada</h4>
        ${tabela(horaTop)}
        <h4 style="font-size:11px;color:var(--warn);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;">Pico de Saída</h4>
        ${tabela(horaTopSaida)}
      </div>`;
  },

  // Módulo unificado (05/08/2026) — antes tinha 2 abas (Análise Automática
  // com filtro global + Comparativo com filtro próprio). A aba Análise
  // Automática foi removida por completo; o motor que sobrou é o mesmo que
  // já rodava no Comparativo (evento = Período Atual vs Período Base do
  // filtro próprio deste módulo — filtro global nunca é usado aqui).
  render(container){
    const linhasCompletas = this._linhasCompletas();
    this._garantirDefaultsComparativo(linhasCompletas);
    const evento = this._construirEventoComparativo(linhasCompletas);

    if(!evento){
      container.innerHTML = this._renderFiltroComparativo()
        + this._renderDadosInsuficientes('Selecione dois períodos válidos (com pelo menos 2 dias com movimento cada) para comparar.');
      this._wireFiltroComparativo(container);
      return;
    }

    const pagosCompletos = Nexus.rawData.filter(d => d.isPago);
    const canceladosCompletos = Nexus.rawData.filter(d =>
      d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
    );
    const conselho = this._conselhoAnalistas(linhasCompletas, pagosCompletos, canceladosCompletos, evento);

    // Observações Automáticas — período inteiro (atual + base combinados),
    // uma lista só (antes existia uma cópia por aba).
    const diasCombinados = [...evento.agBase.dias, ...evento.agAtual.dias].sort((a,b)=>a.iso.localeCompare(b.iso));
    const insights = [...this._gerarInsights(diasCombinados), ...this._anomaliasTexto(diasCombinados, this._destaques(diasCombinados))];

    // Dias em Destaque / Faixa Horária / Capacidade — cada um roda separado
    // pro Período Atual e pro Período Base, lado a lado (decisão de produto).
    const isoAtual = new Set(evento.agAtual.dias.map(d=>d.iso));
    const isoBase  = new Set(evento.agBase.dias.map(d=>d.iso));
    const pagosAtual = pagosCompletos.filter(d => isoAtual.has(this._isoDoPago(d)));
    const pagosBase  = pagosCompletos.filter(d => isoBase.has(this._isoDoPago(d)));

    const destaquesAtual = this._destaques(evento.agAtual.dias);
    const destaquesBase  = this._destaques(evento.agBase.dias);

    const horaTopAtual      = this._faixaHoraria(pagosAtual);
    const horaTopSaidaAtual = this._faixaHorariaSaida(pagosAtual);
    const horaTopBase       = this._faixaHoraria(pagosBase);
    const horaTopSaidaBase  = this._faixaHorariaSaida(pagosBase);

    const capacidadeAtual = this._analistaCapacidadeOcupacao(pagosAtual, horaTopAtual, horaTopSaidaAtual);
    const capacidadeBase  = this._analistaCapacidadeOcupacao(pagosBase, horaTopBase, horaTopSaidaBase);

    container.innerHTML = `
      ${this._renderFiltroComparativo()}
      ${this._renderComparacaoNumeros(evento)}
      ${this._renderConselho(evento, conselho)}

      <div class="panel" style="margin-bottom:14px;">
        <h2>Observações Automáticas</h2>
        ${insights.length
          ? `<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9;">${insights.map(i=>`<li>${i}</li>`).join('')}</ul>`
          : `<p style="color:var(--muted);font-size:13px;margin:0;">Sem observações automáticas suficientes para os períodos selecionados.</p>`}
      </div>

      <div class="panel" style="overflow:hidden;margin-bottom:14px;">
        <h2>Dias em Destaque</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          <div>
            <h3 style="font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;">Período Atual</h3>
            <p style="font-size:11px;color:var(--muted);margin:-4px 0 8px;">vs. média: ${fmtR(destaquesAtual.media)}</p>
            ${destaquesAtual.melhores.length ? this._renderDestaquesTabela(destaquesAtual.melhores, 'melhor') : `<p style="color:var(--muted);font-size:13px;margin:0;">Nenhum dia com volume.</p>`}
            ${destaquesAtual.piores.length ? this._renderDestaquesTabela(destaquesAtual.piores, 'pior') : ''}
          </div>
          <div>
            <h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;">Período Base</h3>
            <p style="font-size:11px;color:var(--muted);margin:-4px 0 8px;">vs. média: ${fmtR(destaquesBase.media)}</p>
            ${destaquesBase.melhores.length ? this._renderDestaquesTabela(destaquesBase.melhores, 'melhor') : `<p style="color:var(--muted);font-size:13px;margin:0;">Nenhum dia com volume.</p>`}
            ${destaquesBase.piores.length ? this._renderDestaquesTabela(destaquesBase.piores, 'pior') : ''}
          </div>
        </div>
      </div>

      <div class="panel" style="overflow:hidden;margin-bottom:14px;">
        <h2>Faixa Horária de Pico</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 10px;">Baseado nos tickets pagos — útil para escala de equipe.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          ${this._renderFaixaHorariaColuna('Período Atual', horaTopAtual, horaTopSaidaAtual)}
          ${this._renderFaixaHorariaColuna('Período Base', horaTopBase, horaTopSaidaBase)}
        </div>
      </div>

      <div class="panel" style="overflow:hidden;">
        <h2> Capacidade e Ocupação</h2>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          <div>
            <h3 style="font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;">Período Atual</h3>
            <div style="display:flex;gap:10px;align-items:flex-start;">
              <div style="font-size:16px;line-height:1.4;">${capacidadeAtual.icone}</div>
              <div style="font-size:13px;line-height:1.6;">${capacidadeAtual.texto}</div>
            </div>
          </div>
          <div>
            <h3 style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px;">Período Base</h3>
            <div style="display:flex;gap:10px;align-items:flex-start;">
              <div style="font-size:16px;line-height:1.4;">${capacidadeBase.icone}</div>
              <div style="font-size:13px;line-height:1.6;">${capacidadeBase.texto}</div>
            </div>
          </div>
        </div>
      </div>
    `;
    this._wireFiltroComparativo(container);
    this._bindTrilhaAuditoria(container, conselho);
  },

  _renderDestaquesTabela(dias, tipo){
    const NOMES_DIA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const cor = tipo === 'melhor' ? 'var(--accent2)' : 'var(--danger)';
    const titulo = tipo === 'melhor' ? 'Melhores dias' : 'Piores dias';

    return `
      <h3 style="font-size:12px;color:${cor};text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;">${titulo}</h3>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr><th>Data</th><th>Dia</th><th>Receita</th><th>vs. Média</th><th>Volume</th><th>Ticket Médio</th><th>Permanência Média</th><th>Cancelamentos</th></tr>
          </thead>
          <tbody>
            ${dias.map(d=>`
              <tr>
                <td>${esc(d.dataStr)}</td>
                <td>${NOMES_DIA[d.diaSemana]}</td>
                <td style="font-weight:600;">${fmtR(d.receita)}</td>
                <td style="color:${d.diffPct>=0?'var(--accent2)':'var(--danger)'};font-weight:600;">${d.diffPct>=0?'+':''}${d.diffPct.toFixed(0)}%</td>
                <td>${d.volume}</td>
                <td>${fmtR(d.ticketMedio)}</td>
                <td>${minToHHMM(Math.round(d.permanenciaMedia))}</td>
                <td>${d.cancelamentos ? `<span style="color:var(--danger);">${d.cancelamentos}</span>` : '0'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  },

  exportarDados(){
    const linhasCompletas = this._linhasCompletas();
    this._garantirDefaultsComparativo(linhasCompletas);
    const evento = this._construirEventoComparativo(linhasCompletas);

    const NOMES_DIA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
    const linhaDestaque = (d, tipo) => [
      tipo, d.dataStr, NOMES_DIA[d.diaSemana], d.receita, d.diffPct/100, d.volume, d.ticketMedio,
      Math.round(d.permanenciaMedia), d.cancelamentos
    ];

    const construirTabelaTrilha = (titulo, conselho) => {
      const auditor = conselho?.vereditos.find(v => v.analista === 'Auditoria');
      if(!auditor || !auditor.achadosDetalhados) return null;
      const linhas = [];
      auditor.achadosDetalhados.forEach(a => {
        if(!a.tickets || !a.tickets.length) return;
        a.tickets.forEach(t => linhas.push([a.titulo, t.ticket, t.data, t.hora, t.placa, t.operador, t.valor, t.motivo]));
      });
      if(!linhas.length) return null;
      return {
        titulo,
        colunas: ['Achado','Ticket','Data','Hora','Placa','Operador','Valor','Motivo'],
        tiposColuna: ['texto','texto','texto','texto','texto','texto','moeda','texto'],
        linhas,
      };
    };

    if(!evento){
      return {
        titulo: 'Comparativo',
        kpis: [],
        tabelas: [{
          titulo: 'Comparativo',
          colunas: ['Aviso'], tiposColuna: ['texto'],
          linhas: [['Selecione dois períodos válidos (com pelo menos 2 dias com movimento cada) para comparar.']],
        }],
      };
    }

    const pagosCompletos = Nexus.rawData.filter(d => d.isPago);
    const canceladosCompletos = Nexus.rawData.filter(d =>
      d.status === 'cancelado' && !ModuloCancelados._isUsuarioSistema(d.usuarioPagamento) && d.valorPago > 0
    );
    const conselho = this._conselhoAnalistas(linhasCompletas, pagosCompletos, canceladosCompletos, evento);
    const status    = this._statusEvento(evento, conselho);

    const diasCombinados = [...evento.agBase.dias, ...evento.agAtual.dias].sort((a,b)=>a.iso.localeCompare(b.iso));
    const insights = [...this._gerarInsights(diasCombinados), ...this._anomaliasTexto(diasCombinados, this._destaques(diasCombinados))];

    const isoAtual = new Set(evento.agAtual.dias.map(d=>d.iso));
    const isoBase  = new Set(evento.agBase.dias.map(d=>d.iso));
    const pagosAtual = pagosCompletos.filter(d => isoAtual.has(this._isoDoPago(d)));
    const pagosBase  = pagosCompletos.filter(d => isoBase.has(this._isoDoPago(d)));

    const destaquesAtual = this._destaques(evento.agAtual.dias);
    const destaquesBase  = this._destaques(evento.agBase.dias);
    const horaTopAtual      = this._faixaHoraria(pagosAtual);
    const horaTopSaidaAtual = this._faixaHorariaSaida(pagosAtual);
    const horaTopBase       = this._faixaHoraria(pagosBase);
    const horaTopSaidaBase  = this._faixaHorariaSaida(pagosBase);
    const capacidadeAtual = this._analistaCapacidadeOcupacao(pagosAtual, horaTopAtual, horaTopSaidaAtual);
    const capacidadeBase  = this._analistaCapacidadeOcupacao(pagosBase, horaTopBase, horaTopSaidaBase);
    const paretoAtual = this._concentracaoReceita(evento.agAtual.dias);
    const paretoBase  = this._concentracaoReceita(evento.agBase.dias);

    const volAtual = evento.agAtual.dias.reduce((s,d)=>s+d.volume,0);
    const volBase  = evento.agBase.dias.reduce((s,d)=>s+d.volume,0);
    const recAtual = evento.agAtual.dias.reduce((s,d)=>s+d.receita,0);
    const recBase  = evento.agBase.dias.reduce((s,d)=>s+d.receita,0);

    const tabelas = [
      {
        titulo: 'Números do Período',
        colunas: ['Indicador','Período Atual','Período Base'],
        tiposColuna: ['texto','texto','texto'],
        linhas: [
          ['Intervalo', evento.labelAtual, evento.labelBase],
          ['Volume', volAtual, volBase],
          ['Receita Total', recAtual, recBase],
          ['Ticket Médio', evento.agAtual.ticketMedio, evento.agBase.ticketMedio],
          ['Receita Média/Dia', evento.agAtual.receitaMediaDia, evento.agBase.receitaMediaDia],
          ['Dias no Período', evento.agAtual.nDias, evento.agBase.nDias],
          ['Concentração de Receita', paretoAtual ? `${paretoAtual.diasNecessarios}/${paretoAtual.totalDias}d → 80%` : '—', paretoBase ? `${paretoBase.diasNecessarios}/${paretoBase.totalDias}d → 80%` : '—'],
          ['Cancelamentos', evento.agAtual.cancelamentos, evento.agBase.cancelamentos],
        ],
      },
      {
        titulo: `Nexus Intelligence Engine (${status.icone} ${evento.varReceita>=0?'+':''}${evento.varReceita.toFixed(1)}% — ${status.motivo})`,
        colunas: ['Analista','Veredito'],
        tiposColuna: ['texto','texto'],
        linhas: [
          ...conselho.vereditos.map(v => [v.analista, v.texto]),
          ['Resumo Executivo', conselho.resumoExecutivo],
        ],
      },
      {
        titulo: 'Observações Automáticas',
        colunas: ['Observação'],
        tiposColuna: ['texto'],
        linhas: insights.length
          ? insights.map(i => [i.replace(/<\/?strong>/g,'')])
          : [['Dados insuficientes nos períodos selecionados.']],
      },
      {
        titulo: 'Dias em Destaque — Período Atual',
        colunas: ['Destaque','Data','Dia da Semana','Receita','vs. Média','Volume','Ticket Médio','Permanência Média (min)','Cancelamentos'],
        tiposColuna: ['texto','texto','texto','moeda','percentual','numero','moeda','numero','numero'],
        linhas: [
          ...destaquesAtual.melhores.map(d => linhaDestaque(d, 'Melhor')),
          ...destaquesAtual.piores.map(d => linhaDestaque(d, 'Pior')),
        ],
      },
      {
        titulo: 'Dias em Destaque — Período Base',
        colunas: ['Destaque','Data','Dia da Semana','Receita','vs. Média','Volume','Ticket Médio','Permanência Média (min)','Cancelamentos'],
        tiposColuna: ['texto','texto','texto','moeda','percentual','numero','moeda','numero','numero'],
        linhas: [
          ...destaquesBase.melhores.map(d => linhaDestaque(d, 'Melhor')),
          ...destaquesBase.piores.map(d => linhaDestaque(d, 'Pior')),
        ],
      },
    ];

    const tabelaHora = (titulo, lista) => lista.length ? {
      titulo,
      colunas: ['Horário','Volume','Receita'],
      tiposColuna: ['texto','numero','moeda'],
      linhas: lista.map(h => [`${String(h.hora).padStart(2,'0')}h–${String((h.hora+1)%24).padStart(2,'0')}h`, h.volume, h.receita]),
    } : null;
    [
      tabelaHora('Faixa Horária de Pico — Entrada (Atual)', horaTopAtual),
      tabelaHora('Faixa Horária de Pico — Saída (Atual)', horaTopSaidaAtual),
      tabelaHora('Faixa Horária de Pico — Entrada (Base)', horaTopBase),
      tabelaHora('Faixa Horária de Pico — Saída (Base)', horaTopSaidaBase),
    ].forEach(t => { if(t) tabelas.push(t); });

    tabelas.push({
      titulo: 'Capacidade e Ocupação',
      colunas: ['Período','Veredito'],
      tiposColuna: ['texto','texto'],
      linhas: [
        ['Período Atual', capacidadeAtual.texto],
        ['Período Base', capacidadeBase.texto],
      ],
    });

    const trilha = construirTabelaTrilha('Trilha de Auditoria', conselho);
    if(trilha) tabelas.push(trilha);

    return {
      titulo: 'Comparativo',
      kpis: [
        { label:'Volume (Atual)', valor: volAtual },
        { label:'Receita Total (Atual)', valor: 'R$ '+recAtual.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Ticket Médio (Atual)', valor: 'R$ '+evento.agAtual.ticketMedio.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Volume (Base)', valor: volBase },
        { label:'Receita Total (Base)', valor: 'R$ '+recBase.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Ticket Médio (Base)', valor: 'R$ '+evento.agBase.ticketMedio.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
      ],
      tabelas,
    };
  },
};

/* ---------------- Registro dos módulos (após todas as definições) ----------------
   Ordem definida em 01/08/2026: Relatórios · Filiais · Permanência Pagamento ·
   Transações · Simulador · Configurações · Comparativo (renomeado de "Análise
   Automática" em 05/08/2026, quando a aba com filtro global foi removida).
   Cancelados deixou de ser módulo próprio — virou aba dentro de Transações. */
Nexus.registerModule(ModuloRelatorios);
Nexus.registerModule(ModuloFiliais);
Nexus.registerModule(ModuloPermanenciaPagamento);
Nexus.registerModule(ModuloTransacoes);
Nexus.registerModule(ModuloSimulador);
Nexus.registerModule(ModuloConfiguracoes);
// ModuloAnaliseAutomatica não é mais registrado como módulo top-level —
// virou a aba "Budget" dentro de Simulador em 05/08/2026 (Etapa 1,
// estrutural). O objeto continua existindo, só não aparece mais sozinho
// no menu lateral. Ver ModuloSimulador.render().

// Inicia após todos os scripts carregarem
window.addEventListener('load', async () => {
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'none';
  await NexusAuth.init();
});

</script>
</body>
</html>
