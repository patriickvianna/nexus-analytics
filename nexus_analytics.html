/* ======================================================================
   MÓDULO FILIAIS
   Promovido de aba dentro de Configurações para módulo principal
   (primeira posição do menu) em 23/07/2026.
   ====================================================================== */
const ModuloFiliais = {
  id: 'filiais',
  nome: 'Filiais',
  icon: '',

  renderFilters(container){ container.innerHTML = ''; },

  async render(el){
    const [{ data: filiais }, { data: supervisores }, { data: gestores }] = await Promise.all([
      // Filtra só ativas (07/08/2026) — a coluna Status saiu da tabela porque
      // a lista devia mostrar só filiais ativas; antes disso não era
      // verdade (mostrava ativa/encerrada/suspensa juntas), então o filtro
      // foi adicionado aqui pra fechar essa lacuna, não só tirar a coluna.
      supa.from('na_filiais').select('*, tabela_tarifa, tabelas_preco, na_supervisores(id,nome,gestor_id, na_gestores(id,nome))').eq('status','ativa').order('nome'),
      supa.from('na_supervisores').select('id,nome,gestor_id').eq('ativo',true).order('nome'),
      supa.from('na_gestores').select('id,nome').eq('ativo',true).order('nome')
    ]);

    // Cache em memória para uso no modal de tarifas (evita data-tarifa no DOM)
    this._filiaisCache = filiais || [];
    const supsPorGestor = {};
    (supervisores||[]).forEach(s=>{
      if(!supsPorGestor[s.gestor_id]) supsPorGestor[s.gestor_id] = [];
      supsPorGestor[s.gestor_id].push(s);
    });

    el.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">
        <h2>Importar lista de filiais</h2>
        <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">
          Importe qualquer planilha com colunas de <strong>Nome</strong>, <strong>Código</strong>,
          Supervisor, Gestor, Estado e Status — a ferramenta identifica as colunas automaticamente
          pelo conteúdo do cabeçalho. Cadastra novas filiais, atualiza existentes e marca como
          <strong>encerrada</strong> as que saírem da lista.
        </p>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <input type="file" id="f-import-input" accept=".xlsb,.xlsx,.xls" style="display:none;">
          <button class="btn-primary" id="btn-import-filiais">Importar arquivo de filiais</button>
          <span id="import-msg" style="font-size:12px;color:var(--accent2);"></span>
        </div>
        <div id="import-progress" style="display:none;margin-top:12px;">
          <div style="height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;">
            <div id="import-bar" style="height:100%;width:0%;background:var(--accent);transition:.2s;"></div>
          </div>
          <div id="import-status" style="font-size:12px;color:var(--muted);margin-top:6px;"></div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <h2>Adicionar filial manualmente</h2>
        <div class="form-grid">
          <div class="form-group"><label>Código da Garagem</label><input id="f-cod" placeholder="ex: 000887"></div>
          <div class="form-group"><label>Nome</label><input id="f-nome" placeholder="Nome da filial"></div>
          <div class="form-group"><label>Estado</label>
            <select id="f-estado">
              <option value="">Selecione o estado</option>
              ${UFS_BR.map(e=>`<option value="${e.uf}">${e.uf} — ${esc(e.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Município</label>
            <select id="f-municipio" disabled>
              <option value="">Selecione o estado primeiro</option>
            </select>
          </div>
          <div class="form-group"><label>Quantidade de Vagas</label><input id="f-vagas" type="number" min="0" step="1" placeholder="ex: 120"></div>
          <div class="form-group"><label>Gestor</label>
            <select id="f-gestor-sel">
              <option value="">Selecione o gestor</option>
              ${(gestores||[]).map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Supervisor</label>
            <select id="f-sup-sel" disabled>
              <option value="">Selecione o gestor primeiro</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" id="btn-add-filial">+ Adicionar Filial</button>
        <div id="msg-filial" style="font-size:12px;margin-top:8px;min-height:16px;"></div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
          <h2 style="margin:0;">Filiais cadastradas <span style="color:var(--muted);font-size:12px;font-weight:400;">(${(filiais||[]).length})</span></h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <select id="filtro-gestor-fil" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;">
              <option value="">Todos os gestores</option>
              ${(gestores||[]).map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join('')}
            </select>
            <select id="filtro-sup-fil" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;">
              <option value="">Todos os supervisores</option>
              ${(supervisores||[]).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}
            </select>
            <input type="text" id="f-busca" placeholder="Buscar filial..." style="padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;">
            <label style="font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;">
              <input type="checkbox" id="chk-inativos-f" style="margin-right:4px;">Mostrar encerradas
            </label>
          </div>
        </div>
        <div class="table-scroll" style="max-height:440px;">
          <table class="data-table" id="filiais-table">
            <thead><tr><th>Cód.</th><th>Nome</th><th>Estado</th><th>Município</th><th>Gestor</th><th>Supervisor</th><th></th></tr></thead>
            <tbody id="filiais-tbody">
              ${this._renderFiliaisRows(filiais||[], '')}
            </tbody>
          </table>
        </div>
      </div>`;

    // Cascading select gestor → supervisor no formulário
    const gestorSel = el.querySelector('#f-gestor-sel');
    const supSel    = el.querySelector('#f-sup-sel');
    gestorSel.onchange = ()=>{
      const gId = gestorSel.value;
      const sups = gId ? (supsPorGestor[gId]||[]) : (supervisores||[]);
      supSel.innerHTML = `<option value="">Selecione o supervisor</option>${sups.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}`;
      supSel.disabled = !gId;
    };

    // Cascading select estado → município (pra cruzar feriados municipais
    // depois, no Budget). Lista carregada uma vez do GitHub e cacheada.
    const estadoSel    = el.querySelector('#f-estado');
    const municipioSel = el.querySelector('#f-municipio');
    estadoSel.onchange = async ()=>{
      const uf = estadoSel.value;
      if(!uf){ municipioSel.innerHTML = '<option value="">Selecione o estado primeiro</option>'; municipioSel.disabled = true; return; }
      municipioSel.innerHTML = '<option value="">Carregando municípios...</option>';
      municipioSel.disabled = true;
      await Feriados.carregarMunicipios();
      const lista = Feriados.municipiosDoEstado(uf);
      municipioSel.innerHTML = '<option value="">Selecione o município</option>' +
        lista.map(m=>`<option value="${m.codigo_ibge}">${esc(m.nome)}</option>`).join('');
      municipioSel.disabled = false;
    };

    // Filtros da listagem
    const aplicarFiltros = ()=>{
      const gId  = el.querySelector('#filtro-gestor-fil').value;
      const sId  = el.querySelector('#filtro-sup-fil').value;
      const busca = el.querySelector('#f-busca').value.toLowerCase();
      const inat  = el.querySelector('#chk-inativos-f').checked;
      let lista = filiais||[];
      if(!inat) lista = lista.filter(f=>f.status==='ativa');
      if(gId)   lista = lista.filter(f=>f.na_supervisores?.na_gestores?.id===gId || f.na_supervisores?.gestor_id===gId);
      if(sId)   lista = lista.filter(f=>f.supervisor_id===sId);
      if(busca)  lista = lista.filter(f=>f.nome.toLowerCase().includes(busca));
      el.querySelector('#filiais-tbody').innerHTML = this._renderFiliaisRows(lista, '');
      this._bindFiliaisEvents(el, supervisores||[], gestores||[], supsPorGestor);
    };

    ['#filtro-gestor-fil','#filtro-sup-fil','#f-busca','#chk-inativos-f'].forEach(sel=>{
      el.querySelector(sel).addEventListener('change', aplicarFiltros);
      el.querySelector(sel).addEventListener('input', aplicarFiltros);
    });

    // Importação do arquivo
    el.querySelector('#btn-import-filiais').onclick = ()=> el.querySelector('#f-import-input').click();
    el.querySelector('#f-import-input').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      await this._importarFiliais(file, el);
    };

    // Adicionar manualmente
    const msgF = el.querySelector('#msg-filial');
    const showMsgF = (txt, ok=false) => {
      msgF.style.color = ok ? 'var(--accent2)' : 'var(--danger)';
      msgF.textContent = txt;
      if(ok) setTimeout(()=>{ msgF.textContent=''; }, 3000);
    };

    el.querySelector('#btn-add-filial').onclick = async ()=>{
      const nome = el.querySelector('#f-nome').value.trim();
      if(!nome) return showMsgF('Nome é obrigatório.');
      const vagasRaw = el.querySelector('#f-vagas').value.trim();
      const municipioOpt = municipioSel.selectedOptions[0];
      const municipioIbge = municipioSel.value ? parseInt(municipioSel.value, 10) : null;
      const { data, error } = await supa.from('na_filiais').insert({
        codigo_garagem: el.querySelector('#f-cod').value.trim() || null,
        nome, estado: el.querySelector('#f-estado').value.trim(),
        municipio_ibge: municipioIbge,
        municipio_nome: municipioIbge ? municipioOpt.textContent : null,
        vagas: vagasRaw ? parseInt(vagasRaw, 10) : null,
        supervisor_id: el.querySelector('#f-sup-sel').value || null
      }).select().single();
      if(error) return showMsgF('Erro: '+(error.message.includes('unique')?'Código já cadastrado.':error.message));
      await NexusAuth.log('na_filiais','INSERT',data.id,null,data);
      this.render(el);
    };

    this._bindFiliaisEvents(el, supervisores||[], gestores||[], supsPorGestor);
  },

  _renderFiliaisRows(lista, _){
    if(!lista.length) return '<tr><td colspan="7" style="color:var(--muted)">Nenhuma filial encontrada</td></tr>';
    return lista.map(f=>`
      <tr>
        <td style="font-family:monospace;font-size:12px;">${esc(f.codigo_garagem||"—")}</td>
        <td>${esc(f.nome)}</td>
        <td>${esc(f.estado||"—")}</td>
        <td>${esc(f.municipio_nome||"—")}</td>
        <td>${esc(f.na_supervisores?.na_gestores?.nome||'—')}</td>
        <td>${esc(f.na_supervisores?.nome||'—')}</td>
        <td style="white-space:nowrap;display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
          <button class="btn-edit-sm" data-id="${f.id}">Editar</button>
          <button class="btn-tarifa" data-id="${f.id}"
            style="background:none;border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;">Tabela</button>
        </td>
      </tr>`).join('');
  },

  _bindFiliaisEvents(el, supervisores, gestores, supsPorGestor){
    // Botão Tabela — abre modal de configuração de tarifas
    el.querySelectorAll('.btn-tarifa').forEach(btn=>{
      btn.onclick = ()=>{
        const filial = (this._filiaisCache||[]).find(f=>f.id===btn.dataset.id);
        this._abrirModalTarifa(filial, el);
      };
    });

    // Botão Editar — abre modal dedicada de edição de filial
    el.querySelectorAll('.btn-edit-sm').forEach(btn=>{
      btn.onclick = ()=>{
        const filial = (this._filiaisCache||[]).find(f=>f.id===btn.dataset.id);
        this._abrirModalEditarFilial(filial, el, supervisores, gestores, supsPorGestor);
      };
    });
  },

  // ── MODAL DE EDIÇÃO DE FILIAL ────────────────────────────────────
  _abrirModalEditarFilial(filial, elConfig, supervisores, gestores, supsPorGestor){
    if(!filial) return;

    // Gestor atual da filial (via supervisor vinculado)
    const gestorAtualId = filial.na_supervisores?.na_gestores?.id
      || supervisores.find(s=>s.id===filial.supervisor_id)?.gestor_id
      || '';

    const overlay = document.createElement('div');
    overlay.id = 'modal-editar-filial';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);
    const fechar = () => overlay.remove();

    const optsGestor = () => `<option value="">Selecione o gestor</option>` +
      gestores.map(g=>`<option value="${g.id}" ${g.id===gestorAtualId?'selected':''}>${esc(g.nome)}</option>`).join('');

    const optsSupervisor = (gestorId) => {
      if(!gestorId) return `<option value="">Selecione o gestor primeiro</option>`;
      const sups = supsPorGestor[gestorId] || supervisores.filter(s=>s.gestor_id===gestorId);
      if(!sups.length) return `<option value="">Nenhum supervisor para este gestor</option>`;
      return `<option value="">Selecione o supervisor</option>` +
        sups.map(s=>`<option value="${s.id}" ${s.id===filial.supervisor_id?'selected':''}>${esc(s.nome)}</option>`).join('');
    };

    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <h2 style="margin:0;font-size:16px;">Editar Filial</h2>
          <button id="modal-fechar" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;">✕</button>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--muted);">Nome da Filial</label>
          <input type="text" id="f-edit-nome" value="${esc(filial.nome)}"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
        </div>

        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:140px;">
            <label style="font-size:12px;color:var(--muted);">Código do Pátio/Garagem</label>
            <input type="text" id="f-edit-cod" value="${esc(filial.codigo_garagem||'')}"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
          </div>
          <div class="form-group" style="flex:1;min-width:120px;">
            <label style="font-size:12px;color:var(--muted);">Estado / UF</label>
            <select id="f-edit-estado"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
              <option value="">Selecione o estado</option>
              ${UFS_BR.map(e=>`<option value="${e.uf}" ${e.uf===(filial.estado||'').toUpperCase()?'selected':''}>${e.uf} — ${esc(e.nome)}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--muted);">Município</label>
          <select id="f-edit-municipio" disabled
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
            <option value="">Carregando...</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--muted);">Quantidade de Vagas</label>
          <input type="number" id="f-edit-vagas" min="0" step="1" value="${filial.vagas ?? ''}" placeholder="ex: 120"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
        </div>

        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:160px;">
            <label style="font-size:12px;color:var(--muted);">Gestor</label>
            <select id="f-edit-gestor"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
              ${optsGestor()}
            </select>
          </div>
          <div class="form-group" style="flex:1;min-width:160px;">
            <label style="font-size:12px;color:var(--muted);">Supervisor</label>
            <select id="f-edit-supervisor"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
              ${optsSupervisor(gestorAtualId)}
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label style="font-size:12px;color:var(--muted);">Status da Filial</label>
          <select id="f-edit-status"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
            <option value="ativa" ${filial.status==='ativa'?'selected':''}>Ativa</option>
            <option value="encerrada" ${filial.status==='encerrada'?'selected':''}>Encerrada</option>
            ${filial.status==='suspensa' ? '<option value="suspensa" selected>Suspensa</option>' : ''}
          </select>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;">
          <button id="modal-cancelar" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Cancelar</button>
          <button id="btn-salvar-filial" class="btn-primary" style="padding:9px 24px;">Salvar Alterações</button>
        </div>
        <div id="modal-status" style="font-size:12px;text-align:right;margin-top:8px;min-height:16px;"></div>
      </div>`;

    overlay.querySelector('#modal-fechar').onclick = fechar;
    overlay.querySelector('#modal-cancelar').onclick = fechar;
    // Fechamento só pelo X/Cancelar — clique fora não fecha mais (bug real: perdia dados de formulário sem querer, corrigido 07/08/2026)

    // Cascata Gestor → Supervisor
    overlay.querySelector('#f-edit-gestor').onchange = (e) => {
      overlay.querySelector('#f-edit-supervisor').innerHTML = optsSupervisor(e.target.value);
    };

    // Cascata Estado → Município — carrega a lista pro estado atual da
    // filial (com o município já cadastrado pré-selecionado) e recarrega
    // (sem pré-seleção) se o Estado for trocado no formulário.
    const municipioSelEdit = overlay.querySelector('#f-edit-municipio');
    const estadoSelEdit    = overlay.querySelector('#f-edit-estado');
    const popularMunicipiosEdit = async (uf, selecionarIbge) => {
      if(!uf){ municipioSelEdit.innerHTML = '<option value="">Selecione o estado primeiro</option>'; municipioSelEdit.disabled = true; return; }
      municipioSelEdit.innerHTML = '<option value="">Carregando municípios...</option>';
      municipioSelEdit.disabled = true;
      await Feriados.carregarMunicipios();
      const lista = Feriados.municipiosDoEstado(uf);
      municipioSelEdit.innerHTML = '<option value="">Selecione o município</option>' +
        lista.map(m=>`<option value="${m.codigo_ibge}" ${selecionarIbge && m.codigo_ibge===selecionarIbge?'selected':''}>${esc(m.nome)}</option>`).join('');
      municipioSelEdit.disabled = false;
    };
    popularMunicipiosEdit(estadoSelEdit.value, filial.municipio_ibge);
    estadoSelEdit.onchange = () => popularMunicipiosEdit(estadoSelEdit.value, null);

    overlay.querySelector('#btn-salvar-filial').onclick = async () => {
      const status = overlay.querySelector('#modal-status');
      const nome = overlay.querySelector('#f-edit-nome').value.trim();
      if(!nome){
        status.style.color = 'var(--danger)';
        status.textContent = 'Informe o nome da filial.';
        return;
      }

      const municipioIbgeEdit = municipioSelEdit.value ? parseInt(municipioSelEdit.value, 10) : null;
      const municipioOptEdit  = municipioSelEdit.selectedOptions[0];

      const payload = {
        nome,
        codigo_garagem: overlay.querySelector('#f-edit-cod').value.trim() || null,
        estado: estadoSelEdit.value || null,
        municipio_ibge: municipioIbgeEdit,
        municipio_nome: municipioIbgeEdit ? municipioOptEdit.textContent : null,
        vagas: (()=>{ const v = overlay.querySelector('#f-edit-vagas').value.trim(); return v ? parseInt(v,10) : null; })(),
        supervisor_id: overlay.querySelector('#f-edit-supervisor').value || null,
        status: overlay.querySelector('#f-edit-status').value,
      };

      status.style.color = 'var(--muted)';
      status.textContent = 'Salvando...';

      const { data, error } = await supa.from('na_filiais').update(payload).eq('id', filial.id).select().single();
      if(error){
        status.style.color = 'var(--danger)';
        status.textContent = 'Erro ao salvar: ' + (error.message || 'motivo desconhecido');
        return;
      }

      fechar();
      await this.render(elConfig);
    };
  },

          overlay.querySelectorAll('.toggle-cobranca').forEach(b=>{
            const ativo = b.dataset.modo === modo;
            b.style.background = ativo ? 'var(--accent)' : 'var(--panel2)';
            b.style.color      = ativo ? '#fff' : 'var(--muted)';
          });
        };
      });

      // Adicionar / remover faixas
      const addFaixaRow = () => {

        row.className = 'faixa-row';

          <input type="number" class="inp-faixa-val" step="0.01" min="0" placeholder="0,00"
            style="width:88px;padding:5px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;">
          <button class="btn-rem-faixa" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;padding:0 4px;">✕</button>`;
        lista.appendChild(row);
        row.querySelector('.btn-rem-faixa').onclick = () => row.remove();

      overlay.querySelector('#btn-add-faixa').onclick = addFaixaRow;
      overlay.querySelectorAll('.btn-rem-faixa').forEach(btn=>{
        btn.onclick = () => btn.closest('.faixa-row').remove();

      // Salvar (nova ou edição) → grava no array em memória e persiste tudo no Supabase
      overlay.querySelector('#btn-salvar-tabela').onclick = async () => {
        const status = overlay.querySelector('#modal-status');
        const nomeTabela = overlay.querySelector('#f-nome').value.trim();
        if(!nomeTabela){
          status.style.color = 'var(--danger)';
          status.textContent = 'Informe o nome da tabela.';
          return;
        }

        const diasSelecionados = [...overlay.querySelectorAll('.dia-chip.on')].map(c=>c.dataset.dia);
        const modoAtivo = overlay.querySelector('.modo-fixo').style.display !== 'none' ? 'FIXO' : 'PROGRESSIVO';

        const novaTabela = {
          id: t.id,
          nome: nomeTabela,
          diasSemana: diasSelecionados.length ? diasSelecionados : ['TODOS'],
          horarioInicio: overlay.querySelector('#f-hora-ini').value || '00:00',
          horarioFim:    overlay.querySelector('#f-hora-fim').value || '23:59',
          toleranciaMinutos: parseInt(overlay.querySelector('#f-tolerancia').value) || 0,
          tipoCobranca: modoAtivo,
          valorFixo: modoAtivo==='FIXO' ? (parseFloat(overlay.querySelector('#f-valor-fixo').value)||0) : 0,
          tetoDiaria: modoAtivo==='PROGRESSIVO' ? (parseFloat(overlay.querySelector('#f-teto').value)||0) : 0,
          faixas: modoAtivo==='PROGRESSIVO'
            ? [...overlay.querySelectorAll('.faixa-row')].map(row=>({
                ateMinutos: parseInt(row.querySelector('.inp-faixa-min').value)||0,
                valor:      parseFloat(row.querySelector('.inp-faixa-val').value)||0
              })).filter(fx=>fx.ateMinutos>0)
            : [],
          fracaoMin:   modoAtivo==='PROGRESSIVO' ? (parseInt(overlay.querySelector('#f-fracao-min').value)||0) : 0,
          fracaoValor: modoAtivo==='PROGRESSIVO' ? (parseFloat(overlay.querySelector('#f-fracao-val').value)||0) : 0,
        };

        if(editando) tabelasPreco[idx] = novaTabela;
        else tabelasPreco.push(novaTabela);

        status.style.color = 'var(--muted)';
        status.textContent = 'Salvando...';
        const ok = await persistir();
        if(!ok){
          status.style.color = 'var(--danger)';
          status.textContent = 'Erro ao salvar — tente novamente.';
          return;
        }
        renderLista();
      };
    };

    // Persiste o array inteiro de tabelasPreco no Supabase (fonte única de verdade)
    const persistir = async () => {
      const { error } = await supa.from('na_filiais').update({ tabelas_preco: tabelasPreco }).eq('id', id);
      if(error){ console.error(error); return false; }
      const cached = (this._filiaisCache||[]).find(f=>f.id===id);
      if(cached) cached.tabelas_preco = tabelasPreco;
      await NexusAuth.log('na_filiais','UPDATE',id,null,{ tabelas_preco: tabelasPreco });
      return true;
    };

    renderLista();
  },

  async _importarFiliais(file, el){
    const msg    = el.querySelector('#import-msg');
    const prog   = el.querySelector('#import-progress');
    const bar    = el.querySelector('#import-bar');
    const status = el.querySelector('#import-status');
    prog.style.display = 'block';
    msg.textContent = '';

    try {
      const buf  = await file.arrayBuffer();
      const wb   = XLSX.read(buf, { type: 'array' });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });

      status.textContent = `Lendo ${rows.length} linhas...`;

      // ── Detecção inteligente de colunas pelo cabeçalho ──────────
      // Procura a linha de cabeçalho nas primeiras 5 linhas
      let headerRowIdx = -1;
      let colMap = {};
      const KEYWORDS = {
        gestor:     ['gestor','gerente'],
        supervisor: ['supervisor'],
        nome:       ['nome','garagem','filial'],
        codigo:     ['código','codigo','cod garagem','cod. garagem'],
        estado:     ['estado','uf'],
        municipio:  ['município','municipio','cidade'],
        vagas:      ['vagas','qtd vagas','quantidade de vagas','capacidade'],
        status:     ['status','situação','situacao']
      };

      for(let r = 0; r < Math.min(5, rows.length); r++){
        const row = rows[r];
        const tempMap = {};
        row.forEach((cell, colIdx) => {
          const cellLower = String(cell||'').toLowerCase().trim();
          for(const [campo, palavras] of Object.entries(KEYWORDS)){
            if(palavras.some(p => cellLower.includes(p)) && !tempMap[campo]){
              tempMap[campo] = colIdx;
            }
          }
        });
        // Considera cabeçalho válido se achou pelo menos nome e código
        if(tempMap.nome !== undefined && tempMap.codigo !== undefined){
          headerRowIdx = r;
          colMap = tempMap;
          break;
        }
      }

      if(headerRowIdx === -1){
        // Fallback: tenta formato legado Export_Attributes_CC (Metas_2026.xlsb)
        await this._importarFiliaisLegacy(rows, el, msg, bar, status);
        return;
      }

      status.textContent = `Cabeçalho identificado na linha ${headerRowIdx+1}. Colunas: ${Object.keys(colMap).join(', ')}`;

      // Município é resolvido por casamento de nome (dentro do estado da
      // linha) contra a base do IBGE — carrega uma vez antes do loop.
      if(colMap.municipio !== undefined) await Feriados.carregarMunicipios();

      // ── Extrai dados usando o mapa de colunas detectado ──────────
      const gestoresMap     = {};
      const supervisoresMap = {};
      const garagens = [];
      let municipiosNaoEncontrados = 0;

      rows.slice(headerRowIdx+1).forEach(row=>{
        const gestor      = colMap.gestor     !== undefined ? String(row[colMap.gestor]||'').trim()     : '';
        const sup         = colMap.supervisor !== undefined ? String(row[colMap.supervisor]||'').trim() : '';
        const nome        = colMap.nome       !== undefined ? String(row[colMap.nome]||'').trim()       : '';
        const cod         = colMap.codigo     !== undefined ? String(row[colMap.codigo]||'').trim()     : '';
        const estado      = colMap.estado     !== undefined ? String(row[colMap.estado]||'').trim().toUpperCase() : '';
        const municipioRaw= colMap.municipio  !== undefined ? String(row[colMap.municipio]||'').trim()  : '';
        const vagasRaw    = colMap.vagas      !== undefined ? String(row[colMap.vagas]||'').trim()      : '';
        const vagas       = vagasRaw && !isNaN(parseInt(vagasRaw,10)) ? parseInt(vagasRaw,10) : null;
        const st          = colMap.status     !== undefined ? String(row[colMap.status]||'').trim().toLowerCase() : '';

        let municipioNome = null, municipioIbge = null;
        if(municipioRaw && estado){
          const match = Feriados.encontrarMunicipio(estado, municipioRaw);
          if(match){ municipioNome = match.nome; municipioIbge = match.codigo_ibge; }
          else municipiosNaoEncontrados++;
        }

        if(gestor) gestoresMap[gestor] = gestoresMap[gestor] || null;
        if(sup && gestor) supervisoresMap[sup] = supervisoresMap[sup] || { gestorNome: gestor, id: null };
        else if(sup && !supervisoresMap[sup]) supervisoresMap[sup] = { gestorNome: null, id: null };
        if(nome && cod) garagens.push({ gestor, sup, nome, cod, estado, municipioNome, municipioIbge, vagas, status: st.includes('encerr')?'encerrada':'ativa' });
      });

      if(garagens.length === 0){
        status.textContent = 'Nenhuma filial encontrada no arquivo (verifique se há Nome e Código preenchidos).';
        msg.style.color = 'var(--danger)';
        msg.textContent = 'Nenhum dado válido encontrado';
        return;
      }

      bar.style.width = '10%';
      status.textContent = `${garagens.length} garagens · ${Object.keys(supervisoresMap).length} supervisores · ${Object.keys(gestoresMap).length} gestor(es)`;

      // 1. Gestores
      const { data: gestoresExist } = await supa.from('na_gestores').select('id,nome');
      (gestoresExist||[]).forEach(g=>{ if(gestoresMap.hasOwnProperty(g.nome)) gestoresMap[g.nome] = g.id; });
      for(const nomeG of Object.keys(gestoresMap)){
        if(!gestoresMap[nomeG]){
          const { data } = await supa.from('na_gestores').insert({ nome: nomeG }).select().single();
          if(data){ gestoresMap[nomeG] = data.id; await NexusAuth.log('na_gestores','INSERT',data.id,null,data); }
        }
      }
      bar.style.width = '25%';

      // 2. Supervisores
      const { data: supsExist } = await supa.from('na_supervisores').select('id,nome');
      (supsExist||[]).forEach(s=>{ if(supervisoresMap[s.nome]) supervisoresMap[s.nome].id = s.id; });
      for(const [nomeS, info] of Object.entries(supervisoresMap)){
        if(!info.id){
          const gestorId = info.gestorNome ? (gestoresMap[info.gestorNome] || null) : null;
          const { data } = await supa.from('na_supervisores').insert({ nome: nomeS, gestor_id: gestorId }).select().single();
          if(data){ info.id = data.id; await NexusAuth.log('na_supervisores','INSERT',data.id,null,data); }
        }
      }
      bar.style.width = '40%';

      // 3. Filiais
      const { data: filiaisExist } = await supa.from('na_filiais').select('id,nome,codigo_garagem,status');
      const porCod  = {};
      const porNome = {};
      (filiaisExist||[]).forEach(f=>{
        if(f.codigo_garagem) porCod[f.codigo_garagem] = f;
        porNome[f.nome.toLowerCase()] = f;
      });

      const nomsArquivo = new Set(garagens.map(g=>g.nome.toLowerCase()));
      let inseridas=0, atualizadas=0, encerradas=0;
      const falhasNovo = [];

      for(const ex of (filiaisExist||[])){
        if(ex.status==='ativa' && !nomsArquivo.has(ex.nome.toLowerCase())){
          const { error } = await supa.from('na_filiais').update({status:'encerrada'}).eq('id',ex.id);
          if(error){ falhasNovo.push(ex.nome); } else { encerradas++; }
        }
      }

      let i=0;
      const colunaVagasPresente     = colMap.vagas     !== undefined;
      const colunaMunicipioPresente = colMap.municipio !== undefined;
      for(const g of garagens){
        i++;
        bar.style.width = Math.round(40+(i/garagens.length)*55)+'%';
        if(i%10===0) status.textContent = `Processando ${i}/${garagens.length}...`;
        const supId     = g.sup ? (supervisoresMap[g.sup]?.id || null) : null;
        const existente = (g.cod && porCod[g.cod]) || porNome[g.nome.toLowerCase()];
        if(existente){
          const { error } = await supa.from('na_filiais').update({
            nome: g.nome, codigo_garagem: g.cod || existente.codigo_garagem,
            estado: g.estado||null,
            ...(colunaVagasPresente ? { vagas: g.vagas } : {}),
            ...(colunaMunicipioPresente ? { municipio_nome: g.municipioNome, municipio_ibge: g.municipioIbge } : {}),
            supervisor_id: supId, status: g.status
          }).eq('id', existente.id);
          if(error){ falhasNovo.push(g.nome); } else { atualizadas++; }
        } else {
          const { data, error } = await supa.from('na_filiais').insert({
            nome: g.nome, codigo_garagem: g.cod || null,
            estado: g.estado||null, vagas: g.vagas,
            municipio_nome: g.municipioNome, municipio_ibge: g.municipioIbge,
            supervisor_id: supId, status: g.status
          }).select().single();
          if(error || !data){ falhasNovo.push(g.nome); }
          else { await NexusAuth.log('na_filiais','INSERT',data.id,null,data); inseridas++; }
        }
      }

      bar.style.width = '100%';
      const temFalhasNovo = falhasNovo.length > 0;
      const avisoMunicipio = colunaMunicipioPresente && municipiosNaoEncontrados > 0
        ? ` · ${municipiosNaoEncontrados} município(s) não reconhecido(s) (nome não bateu com a base do IBGE — confira acentuação/grafia ou cadastre manualmente em Editar)`
        : '';
      status.innerHTML = temFalhasNovo
        ? `${inseridas} inseridas · ${atualizadas} atualizadas · ${encerradas} encerradas · <span style="color:var(--danger);">${falhasNovo.length} falharam: ${falhasNovo.map(esc).join(', ')}</span>${avisoMunicipio}`
        : `✓ ${inseridas} inseridas · ${atualizadas} atualizadas · ${encerradas} encerradas.${avisoMunicipio}`;
      msg.style.color = temFalhasNovo ? 'var(--warn)' : 'var(--accent2)';
      msg.textContent = temFalhasNovo ? `Importação concluída com falhas` : `✓ Importação concluída`;
      setTimeout(()=>{ this.render(el); }, temFalhasNovo ? 4500 : 2000);

    } catch(err){
      status.textContent = 'Erro: '+err.message;
      msg.style.color = 'var(--danger)';
      msg.textContent = 'Erro na importação';
      console.error(err);
    }
  },

  async _importarFiliaisLegacy(rows, el, msg, bar, status){
    const garagens = [];
    rows.forEach(row=>{
      const cel = String(row[0]||'').trim();
      if(cel.includes(' - ')){
        const cod_cc = cel.split(' - ')[0].trim();
        const nome   = cel.split(' - ').slice(1).join(' - ').trim();
        let uf  = String(row[7]||'').replace('UF_','').trim();
        if(nome) garagens.push({ cod_cc, nome, uf });
      }
    });
    bar.style.width = '30%';
    const { data: existentes, error: errSelect } = await supa.from('na_filiais').select('id,nome,codigo_cc,status');
    if(errSelect){
      bar.style.width = '100%';
      status.textContent = `✗ Falha ao ler filiais existentes — importação abortada.`;
      msg.style.color = 'var(--danger)';
      msg.textContent = `✗ Erro: ${errSelect.message||'falha na leitura da base'}`;
      return;
    }
    const existMap = {};
    (existentes||[]).forEach(f=>{ existMap[f.nome.toLowerCase()] = f; });
    let inseridas=0, atualizadas=0, i=0;
    const falhas = [];
    for(const g of garagens){
      i++;
      bar.style.width = Math.round(30+(i/garagens.length)*65)+'%';
      const ex = existMap[g.nome.toLowerCase()];
      if(ex){
        if(!ex.codigo_cc){
          const { error } = await supa.from('na_filiais').update({codigo_cc:g.cod_cc,estado:g.uf}).eq('id',ex.id);
          if(error){ falhas.push(g.nome); } else { atualizadas++; }
        }
      } else {
        const { data, error } = await supa.from('na_filiais').insert({nome:g.nome,codigo_cc:g.cod_cc,estado:g.uf,status:'ativa'}).select().single();
        if(error || !data){ falhas.push(g.nome); }
        else { await NexusAuth.log('na_filiais','INSERT',data.id,null,data); inseridas++; }
      }
    }
    bar.style.width = '100%';
    const temFalhas = falhas.length > 0;
    status.innerHTML = temFalhas
      ? `${inseridas} inseridas · ${atualizadas} atualizadas · <span style="color:var(--danger);">${falhas.length} falharam: ${falhas.map(esc).join(', ')}</span>`
      : `✓ ${inseridas} inseridas · ${atualizadas} atualizadas.`;
    msg.style.color = temFalhas ? 'var(--warn)' : 'var(--accent2)';
    msg.textContent = temFalhas ? `Importação concluída com falhas` : `✓ Importação concluída`;
    setTimeout(()=>{ this.render(el); }, temFalhas ? 4500 : 2000);
  },

  // ── ABA USUÁRIOS (só admin) ─────────────────────────────────────

};

const ModuloRelatorios = {
  id: 'relatorios',
  nome: 'Relatórios',
  icon: '',

  // Persistência de tickets por filial (05/08/2026) — estado da filial
  // escolhida no seletor, independente da filial detectada por importação.
  _filialSelecionada: null, // { id, nome, codigoGaragem }
  _filiaisCache: null,      // lista de {id,nome,codigo_garagem} pro seletor pesquisável
  _periodosCache: [],       // períodos já salvos da filial selecionada

  // Converte um ticket normalizado (Schema Universal) numa linha pra na_tickets.
  // mes_referencia sempre dia 1 do mês, em BRT, derivado de timestampPagamento.
  // Formatador cacheado (regra de performance do Blueprint) — corrige bug de
  // 05/08/2026: antes usava new Date(...).getFullYear()/.getMonth(), que
  // depende do fuso do NAVEGADOR, não força BRT. Tickets perto da virada do
  // mês (23h-1h) podiam cair no mês errado dependendo do fuso da máquina.
  _fmtMesRefDB: new Intl.DateTimeFormat('sv-SE', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit'}),

  _ticketParaLinhaDB(d, filialId){
    const mesStr = this._fmtMesRefDB.format(d.timestampPagamento) + '-01';
    return {
      filial_id: filialId,
      ticket: d.ticket || null,
      placa: d.placa || null,
      usuario_pagamento: d.usuarioPagamento || null,
      nome_cliente: d.nomeCliente || null,
      telefone_cliente: d.telefoneCliente || null,
      detalhe: d.detalhe || null,
      timestamp_entrada: d.timestampEntrada ? d.timestampEntrada.toISOString() : null,
      timestamp_saida: d.timestampSaida ? d.timestampSaida.toISOString() : null,
      timestamp_pagamento: d.timestampPagamento.toISOString(),
      valor_pago: d.valorPago,
      forma_pagamento: d.formaPagamento || null,
      tolerancia: !!d.tolerancia,
      status: d.status,
      permanencia_min: d.permanenciaMin || 0,
      mes_referencia: mesStr,
    };
  },

  // Reconstrói o Schema Universal a partir de uma linha do banco — mesma lógica
  // de campos derivados de _normalize() (diaSemana/dataStr/isPago), reaplicada
  // aqui pra manter os dois caminhos (upload de arquivo vs. carga do banco)
  // produzindo exatamente o mesmo formato que os módulos esperam.
  _fmtDiaSemanaDB: new Intl.DateTimeFormat('en-US', {timeZone:'America/Sao_Paulo', weekday:'short'}),
  _fmtDataStrDB: new Intl.DateTimeFormat('pt-BR', {timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric'}),
  _linhaDBParaTicket(row){
    const DIAS_SEMANA_IDX = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
    const pagamento = new Date(row.timestamp_pagamento);
    // Mesma correção do bug de virada de semana (ver _handleImport) — zera a
    // hora antes de calcular o offset em dias, senão a semana nasce no
    // sábado à tarde em vez de domingo.
    const semanaStr = ts => {
      const [dd, mm, yyyy] = this._fmtDataStrDB.format(ts).split('/');
      const tsMeiaNoite = new Date(`${yyyy}-${mm}-${dd}T00:00:00-03:00`);
      const jan1 = new Date(`${yyyy}-01-01T00:00:00-03:00`);
      const offsetDias = Math.round((tsMeiaNoite - jan1) / 86400000);
      const wk = Math.floor((offsetDias + jan1.getDay()) / 7) + 1;
      return `${yyyy}-W${String(wk).padStart(2,'0')}`;
    };
    const formaPagamento = row.forma_pagamento || 'N/D';
    const fp = formaPagamento.toLowerCase();
    const isPago = row.status === 'pago'
      && row.valor_pago > 0
      && !row.tolerancia
      && fp !== 'n/d'
      && !fp.includes('sem pagamento')
      && !fp.includes('cancelado')
      && !fp.includes('desconto');
    return {
      id: 'db_'+row.id,
      ticket: row.ticket || '',
      timestampEntrada: row.timestamp_entrada ? new Date(row.timestamp_entrada) : null,
      timestampSaida: row.timestamp_saida ? new Date(row.timestamp_saida) : null,
      timestampPagamento: pagamento,
      diaPagamento: DIAS_SEMANA_IDX[this._fmtDiaSemanaDB.format(pagamento)],
      dataPagamentoStr: this._fmtDataStrDB.format(pagamento),
      semanaPagamentoStr: semanaStr(pagamento),
      isPago,
      permanenciaMin: row.permanencia_min || 0,
      valorPago: row.valor_pago,
      formaPagamento,
      tolerancia: !!row.tolerancia,
      status: row.status,
      placa: row.placa || '',
      usuarioPagamento: row.usuario_pagamento || '',
      nomeCliente: row.nome_cliente || '',
      telefoneCliente: row.telefone_cliente || '',
      detalhe: row.detalhe || '',
    };
  },

  renderFilters(container){ container.innerHTML = ''; },

  async render(container){
    const filial = Nexus._filialAtual || null;
    const total  = Nexus.rawData.length;

    let periodoImportado = null;
    if(Nexus._periodoRelatorioTexto){
      periodoImportado = Nexus._periodoRelatorioTexto;
    } else if(total > 0){
      const comData = Nexus.rawData.filter(d => d.timestampEntrada);
      if(comData.length){
        const min = comData.reduce((m,d)=> d.timestampEntrada < m ? d.timestampEntrada : m, comData[0].timestampEntrada);
        const max = comData.reduce((m,d)=> d.timestampEntrada > m ? d.timestampEntrada : m, comData[0].timestampEntrada);
        const fmt = dt => dt.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo', day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
        periodoImportado = `${fmt(min)} até ${fmt(max)}`;
      }
    }

    const msgSalvamento = this._msgSalvamento;
    this._msgSalvamento = null; // mostra uma vez só, não persiste em renderizações seguintes

    container.innerHTML = `
      ${msgSalvamento ? `
      <div class="panel" style="margin-bottom:16px;border:1px solid ${msgSalvamento.erro ? 'var(--danger)' : 'var(--accent2)'};">
        <p style="font-size:13px;margin:0;color:${msgSalvamento.erro ? 'var(--danger)' : 'var(--text)'};">${msgSalvamento.texto}</p>
      </div>` : ''}

      <!-- Seletor de filial já importada (persistência de tickets, 05/08/2026) -->
      <div class="panel" style="margin-bottom:16px;">
        <h2>Analisar filial já importada</h2>
        <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">Busque por nome ou código da garagem pra carregar os dados já salvos, sem precisar reimportar o arquivo.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
          <div class="form-group" style="flex:1;min-width:260px;margin-bottom:0;position:relative;">
            <label style="font-size:12px;color:var(--muted);">Filial</label>
            <div style="position:relative;">
              <input type="text" id="rel-filial-input" autocomplete="off"
                placeholder="Digite o nome ou o código da garagem..."
                value="${this._filialSelecionada ? esc(this._filialSelecionada.nome) : ''}"
                style="width:100%;padding:9px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;box-sizing:border-box;">
            </div>
            <div id="rel-filial-dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:280px;overflow-y:auto;box-shadow:-4px -4px 8px var(--shadow-light),4px 8px 20px var(--shadow-dark);"></div>
          </div>
        </div>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
          <button id="btn-importar-novo" style="background:var(--accent2);color:#0b1a16;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Importar novo relatório</button>
          <button id="btn-limpar-tudo" ${total>0?'':'disabled'} style="background:var(--warn);color:#3a2600;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;opacity:${total>0?'1':'.5'};">Limpar relatório da tela</button>
          <button id="btn-excluir-relatorios" disabled style="background:var(--danger);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;opacity:.5;">Excluir relatórios</button>
          <button id="btn-carregar-filial" disabled style="background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;opacity:.5;">Carregar dados</button>
        </div>

        <input type="file" id="file-input" accept=".csv,.xlsx,.xls" multiple style="display:none;">
        <div id="progress-wrap"><div id="progress-bar"></div></div>
        <div id="rel-filial-msg" style="font-size:12px;margin-top:8px;"></div>
      </div>

      <!-- Cabeçalho da filial -->
      ${filial ? `
      <div style="background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div>
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Filial</div>
          <div style="font-size:18px;font-weight:700;color:var(--text);">${esc(filial.nome)}</div>
        </div>
        ${filial.supervisor ? `<div>
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Supervisor</div>
          <div style="font-size:15px;font-weight:600;color:var(--accent2);">${esc(filial.supervisor)}</div>
        </div>` : ''}
        ${filial.gestor ? `<div>
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Gestor</div>
          <div style="font-size:15px;font-weight:600;color:var(--accent2);">${esc(filial.gestor)}</div>
        </div>` : ''}
        ${periodoImportado ? `<div>
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Período importado</div>
          <div style="font-size:13px;font-weight:600;color:var(--text);">${periodoImportado}</div>
        </div>` : ''}
        ${filial.naoEncontrada ? `<div style="font-size:12px;color:var(--warn);margin-left:auto;">Filial não encontrada no cadastro</div>` : ''}
        ${!filial.naoEncontrada ? `<button id="btn-exportar-tudo" class="btn-primary" style="margin-left:auto;padding:9px 18px;">Exportar Tudo (XLSX)</button>` : ''}

    const fileInput = container.querySelector('#file-input');

    const btnExportar = container.querySelector('#btn-exportar-tudo');
    if(btnExportar){
      btnExportar.onclick = async () => {
        btnExportar.disabled = true;
        const textoOriginal = btnExportar.textContent;
        btnExportar.textContent = 'Gerando arquivo...';
        try {
          await exportarFilialXLSX();
        } catch(e){
          console.error('Erro ao exportar:', e);
          alert('Erro ao gerar a exportação. Veja o console para detalhes.');
        } finally {
          btnExportar.disabled = false;
          btnExportar.textContent = textoOriginal;
        }
      };
    }

    const btnImportarNovo = container.querySelector('#btn-importar-novo');
    btnImportarNovo.onclick = () => fileInput.click();
    fileInput.onchange = e => this._handleImport(e.target.files);
    // Arrastar-e-soltar continua funcionando em qualquer ponto do painel,
    // como conveniência — o botão é o caminho principal agora.
    const painelImport = btnImportarNovo.closest('.panel');
    ['dragover','dragleave'].forEach(evt=>{
      painelImport.addEventListener(evt, e=> e.preventDefault());
    });
    painelImport.addEventListener('drop', e=>{
      e.preventDefault();
      if(e.dataTransfer.files?.length) this._handleImport(e.dataTransfer.files);
    });

    // ── Seletor de filial já importada (persistência de tickets) ─────
    const filialInput          = container.querySelector('#rel-filial-input');
    const filialDropdown       = container.querySelector('#rel-filial-dropdown');
    const btnCarregarFilial    = container.querySelector('#btn-carregar-filial');
    const btnExcluirRelatorios = container.querySelector('#btn-excluir-relatorios');
    const filialMsgEl          = container.querySelector('#rel-filial-msg');
    const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    // Antes mostrava a lista de períodos direto no painel; agora essa lista
    // só aparece dentro da janela flutuante de "Excluir relatórios" (item
    // 1.3, 07/08/2026) — aqui só habilita os botões que dependem de ter uma
    // filial selecionada.
    const habilitarBotoesFilial = (habilitar) => {
      btnCarregarFilial.disabled = !habilitar;
      btnCarregarFilial.style.opacity = habilitar ? '1' : '.5';
      btnExcluirRelatorios.disabled = !habilitar;
      btnExcluirRelatorios.style.opacity = habilitar ? '1' : '.5';
    };

    // Destaca o trecho que bateu com a busca — mesmo efeito visual do
    // autofiltro do Excel, sem precisar de biblioteca nova.
    const destacar = (texto, termo) => {
      const t = String(texto||'—');
      if(!termo) return esc(t);
      const idx = t.toLowerCase().indexOf(termo.toLowerCase());
      if(idx === -1) return esc(t);
      return esc(t.slice(0,idx)) + `<strong style="color:var(--accent);">${esc(t.slice(idx,idx+termo.length))}</strong>` + esc(t.slice(idx+termo.length));
    };

    const renderDropdownFiliais = async (termoBruto) => {
      const lista = await this._carregarListaFiliais();
      const termo = termoBruto.trim().toLowerCase();
      const filtradas = termo
        ? lista.filter(f => f.nome.toLowerCase().includes(termo) || (f.codigo_garagem||'').toLowerCase().includes(termo))
        : lista;
      if(!filtradas.length){
        filialDropdown.innerHTML = `<div style="padding:12px;font-size:13px;color:var(--muted);">Nenhuma filial encontrada pra "${esc(termoBruto)}".</div>`;
        filialDropdown.style.display = 'block';
        return;
      }
      filialDropdown.innerHTML = filtradas.slice(0,80).map(f => `
        <div class="filial-opcao" data-id="${f.id}" style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);">
          <div>${destacar(f.nome, termo)}</div>
          <div style="font-size:11px;color:var(--muted);font-family:monospace;margin-top:1px;">${destacar(f.codigo_garagem, termo)}</div>
        </div>`).join('') + (filtradas.length>80 ? `<div style="padding:8px 12px;font-size:11px;color:var(--muted);">+${filtradas.length-80} outras — refine a busca</div>` : '');
      filialDropdown.style.display = 'block';
      filialDropdown.querySelectorAll('.filial-opcao').forEach(op => {
        op.addEventListener('mouseenter', () => op.style.background = 'var(--panel2)');
        op.addEventListener('mouseleave', () => op.style.background = 'transparent');
        // mousedown (não click) dispara ANTES do blur do input — garante que a
        // seleção funcione mesmo com o dropdown sendo escondido no blur.
        op.addEventListener('mousedown', (e) => {
          e.preventDefault();
          const f = lista.find(x => x.id === op.dataset.id);
          if(!f) return;
          filialInput.value = f.nome;
          this._filialSelecionada = { id: f.id, nome: f.nome, codigoGaragem: f.codigo_garagem };
          filialDropdown.style.display = 'none';
          filialMsgEl.textContent = '';
          habilitarBotoesFilial(true);
        });
      });
    };

    filialInput.addEventListener('focus', () => renderDropdownFiliais(filialInput.value));
    filialInput.addEventListener('input', () => {
      this._filialSelecionada = null;
      habilitarBotoesFilial(false);
      renderDropdownFiliais(filialInput.value);
    });
    filialInput.addEventListener('blur', () => {
      setTimeout(() => { filialDropdown.style.display = 'none'; }, 150);
    });

    habilitarBotoesFilial(!!this._filialSelecionada);

    btnExcluirRelatorios.onclick = () => {
      if(!this._filialSelecionada) return;
      this._abrirModalExcluirPeriodos(this._filialSelecionada.id, this._filialSelecionada.nome, MESES_ABREV);
    };

    btnCarregarFilial.onclick = async () => {
      if(!this._filialSelecionada) return;
      if(Nexus.rawData.length > 0){
        const ok = await Nexus.confirmar(
          'Substituir dados carregados',
          'Isso vai substituir os dados atualmente carregados na tela.\n\nContinuar?',
          { textoConfirmar:'Substituir' }
        );
        if(!ok) return;
      }
      btnCarregarFilial.disabled = true;
      const textoOriginal = btnCarregarFilial.textContent;
      btnCarregarFilial.textContent = 'Carregando...';
      const r = await this._carregarDadosDaFilial(this._filialSelecionada.id, this._filialSelecionada.nome);
      if(!r.ok){
        filialMsgEl.style.color = 'var(--danger)';
        filialMsgEl.textContent = r.erro;
        btnCarregarFilial.disabled = false;
        btnCarregarFilial.textContent = textoOriginal;
        return;
      }
      Nexus.atualizarTituloTopo();
      this.render(container);
    };

    // Limpar
    container.querySelector('#btn-limpar-tudo')?.addEventListener('click', async ()=>{
      const ok = await Nexus.confirmar(
        'Limpar da tela',
        'Isso limpa a visualização atual e zera os módulos.\n\nOs dados já salvos no banco NÃO serão apagados — você pode carregar essa filial de novo pelo seletor a qualquer momento.',
        { textoConfirmar:'Limpar' }
      );
      if(!ok) return;
      await NexusDB.clear();
      Nexus.rawData = [];
      Nexus.filteredData = [];
      Nexus._filialAtual = null;
      ModuloAnaliseAutomatica._comparativo = { atual:{inicio:null,fim:null}, base:{inicio:null,fim:null}, weekdays:new Set([0,1,2,3,4,5,6]), inicializado:false };
      Nexus.applyFilters();
      Nexus.atualizarTituloTopo();
      this.render(container);
    });
  },

  async _handleImport(files){
    if(!files || !files.length) return;

    // Alerta se já houver dados carregados
    if(Nexus.rawData.length > 0){
      const ok = await Nexus.confirmar(
        'Substituir relatório carregado',
        'Já existe um relatório carregado.\n\nAo continuar, os dados atuais serão substituídos pelo novo relatório.',
        { textoConfirmar:'Substituir' }
      );
      if(!ok) return;
      Nexus.rawData = [];
      Nexus.filteredData = [];
      Nexus._filialAtual = null;
    }

    const wrap = document.getElementById('progress-wrap');
    const bar  = document.getElementById('progress-bar');
    wrap.style.display = 'block';
    bar.style.width = '0%';

    try {
      await Nexus.importFiles(files, pct=>{ bar.style.width = pct+'%'; });

      // Reseta o filtro do Comparativo — preso a um relatório antigo, ele
      // ficaria apontando pra períodos que não existem mais no novo
      // dataset, mostrando "dados insuficientes" sem motivo.
      ModuloAnaliseAutomatica._comparativo = { atual:{inicio:null,fim:null}, base:{inicio:null,fim:null}, weekdays:new Set([0,1,2,3,4,5,6]), inicializado:false };

      // Detecta filial pelo código da garagem no cabeçalho do relatório
      await this._detectarFilial(files[0]);
      Nexus.atualizarTituloTopo();

      // Checagem cruzada: se o usuário já tinha selecionado uma filial no
      // seletor e o arquivo importado é de outra, avisa antes de prosseguir
      // — evita salvar dado na filial errada no banco.
      if(this._filialSelecionada && Nexus._filialAtual && !Nexus._filialAtual.naoEncontrada
         && Nexus._filialAtual.id !== this._filialSelecionada.id){
        const prosseguir = await Nexus.confirmar(
          'Filial diferente da selecionada',
          `Você selecionou "${this._filialSelecionada.nome}", mas o relatório importado é da filial "${Nexus._filialAtual.nome}".\n\n` +
          `Continuar mesmo assim? Os dados serão salvos em "${Nexus._filialAtual.nome}" (a filial do arquivo), não na selecionada.`,
          { perigo:true, textoConfirmar:'Continuar assim mesmo' }
        );
        if(!prosseguir){
          Nexus.rawData = [];
          Nexus._filialAtual = null;
          wrap.style.display = 'none';
          bar.style.width = '0%';
          return;
        }
      }

      Nexus.filters.dateStart = null;
      Nexus.filters.dateEnd   = null;
      Nexus.applyFilters();
      await NexusDB.save();

      // Persiste no Supabase, por filial, deduplicado por mês (05/08/2026)
      if(Nexus._filialAtual && !Nexus._filialAtual.naoEncontrada){
        const resultado = await this._salvarTicketsNoBanco(Nexus._filialAtual.id);
        if(resultado.ok){
          const partes = [];
          if(resultado.salvos.length)     partes.push(`✓ ${resultado.salvos.length} mês(es) salvo(s) no banco`);
          if(resultado.bloqueados.length) partes.push(`${resultado.bloqueados.length} mês(es) já existia(m) e não foi(ram) sobrescrito(s) — exclua antes de reimportar, se necessário`);
          this._msgSalvamento = { texto: partes.join(' · '), erro: false };
        } else {
          this._msgSalvamento = { texto: `Falha ao salvar no banco: ${resultado.erro} — os dados continuam disponíveis nesta sessão, mas não foram persistidos.`, erro: true };
        }
      }

      // Re-renderiza o módulo com os novos dados
      const container = document.getElementById('module-view');
      this.render(container);
    } catch(err){
      console.error('Erro ao importar relatório:', err);
      alert(err.message || 'Erro ao importar o relatório. Verifique se o arquivo não está corrompido e tente novamente.');
    } finally {
      wrap.style.display = 'none';
      bar.style.width = '0%';
    }
  },

  async _detectarFilial(file){
    try {
      // Lê o cabeçalho do arquivo para extrair o código da garagem
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf, { type: 'array' });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'', range:0 });

      let codigoGaragem = null;
      for(let i = 0; i < Math.min(10, rows.length); i++){
        const row = rows[i];
        for(let j = 0; j < row.length; j++){
          const val = String(row[j]||'').trim();
          // Linha com "Código da Garagem: 000887"
          if(val.toLowerCase().includes('código da garagem') || val.toLowerCase().includes('codigo da garagem')){
            // Pega o valor na próxima célula ou extrai do texto
            const match = val.match(/:\s*(\d{4,9})/);
            if(match) { codigoGaragem = match[1].replace(/^0+/,'').padStart(6,'0'); break; }
            if(row[j+1]) { codigoGaragem = String(row[j+1]).trim().padStart(6,'0'); break; }
          }
          // Ou a célula seguinte tem só o código
          if(val === 'Código da Garagem:' && row[j+1]){
            codigoGaragem = String(row[j+1]).trim().padStart(6,'0');
            break;
          }
        }
        if(codigoGaragem) break;
      }

      if(!codigoGaragem){
        Nexus._filialAtual = { nome: file.name, supervisor: null, gestor: null, naoEncontrada: true };
        return;
      }

      // Busca no Supabase pelo código da garagem
      const { data: filial } = await supa
        .from('na_filiais')
        .select('id, codigo_garagem, nome, vagas, municipio_nome, municipio_ibge, tabelas_preco, na_supervisores(nome, na_gestores(nome))')
        .eq('codigo_garagem', codigoGaragem)
        .single();

      if(filial){
        Nexus._filialAtual = {
          id: filial.id,
          codigoGaragem: filial.codigo_garagem,
          nome: filial.nome,
          vagas: filial.vagas ?? null,
          municipioNome: filial.municipio_nome || null,
          municipioIbge: filial.municipio_ibge || null,
          supervisor: filial.na_supervisores?.nome || null,
          gestor: filial.na_supervisores?.na_gestores?.nome || null,
          tabelasPreco: filial.tabelas_preco || [],
          naoEncontrada: false
        };
      } else {
        Nexus._filialAtual = {
          nome: `Garagem ${codigoGaragem}`,
          supervisor: null, gestor: null, naoEncontrada: true
        };
      }
    } catch(e){
      console.warn('Erro ao detectar filial:', e);
      Nexus._filialAtual = null;
    }
  },

  // ── Persistência de tickets por filial (05/08/2026) ──────────────────

  async _carregarListaFiliais(){
    if(this._filiaisCache) return this._filiaisCache;
    const { data, error } = await supa.from('na_filiais').select('id, nome, codigo_garagem').order('nome');
    if(error){ console.warn('Erro ao carregar lista de filiais:', error); return []; }
    this._filiaisCache = data || [];
    return this._filiaisCache;
  },

  async _carregarPeriodos(filialId){
    const { data, error } = await supa.from('na_filial_periodos')
      .select('mes_referencia, qtd_tickets, periodo_texto_original, importado_em')
      .eq('filial_id', filialId)
      .order('mes_referencia', { ascending: false });
    if(error){ console.warn('Erro ao carregar períodos:', error); return []; }
    this._periodosCache = data || [];
    return this._periodosCache;
  },

  // Carrega os tickets já salvos de uma filial (escopo: ano corrente + ano
  // anterior, decisão de produto confirmada) e popula Nexus.rawData — o
  // usuário passa a analisar sem precisar reimportar o arquivo.
  async _carregarDadosDaFilial(filialId, nomeFilial){
    const anoAtual = new Date().getFullYear();
    const limiteInicio = `${anoAtual-1}-01-01T00:00:00-03:00`;

    const { data: filial, error: errFilial } = await supa.from('na_filiais')
      .select('id, codigo_garagem, nome, vagas, municipio_nome, municipio_ibge, tabelas_preco, na_supervisores(nome, na_gestores(nome))')
      .eq('id', filialId).single();
    if(errFilial){ return { ok:false, erro: errFilial.message }; }

    // Otimização de performance (07/08/2026) — antes buscava página por
    // página em SÉRIE (esperando uma terminar pra pedir a próxima); numa
    // filial com muito volume isso passava de 1 minuto. Pede a contagem
    // total primeiro e dispara todas as páginas em PARALELO — o tempo total
    // passa a ser ~o da página mais lenta, não a soma de todas. Ordena por
    // timestamp_pagamento + id (desempate estável) pra garantir que cada
    // página pegue uma fatia exata, sem sobreposição/lacuna entre elas.
    const PAGE_SIZE = 1000;
    const { count, error: errCount } = await supa.from('na_tickets')
      .select('id', { count: 'exact', head: true })
      .eq('filial_id', filialId)
      .gte('timestamp_pagamento', limiteInicio);
    if(errCount){ return { ok:false, erro: errCount.message }; }
    if(!count){ return { ok:false, erro: 'Essa filial ainda não tem nenhum período salvo.' }; }

    const totalPaginas = Math.ceil(count / PAGE_SIZE);
    const pedidos = Array.from({ length: totalPaginas }, (_, i) => {
      const offset = i * PAGE_SIZE;
      return supa.from('na_tickets')
        .select('*')
        .eq('filial_id', filialId)
        .gte('timestamp_pagamento', limiteInicio)
        .order('timestamp_pagamento', { ascending: true })
        .order('id', { ascending: true })
        .range(offset, offset + PAGE_SIZE - 1);
    });
    const resultados = await Promise.all(pedidos);
    const erroPagina = resultados.find(r => r.error);
    if(erroPagina) return { ok:false, erro: erroPagina.error.message };
    const rows = resultados.flatMap(r => r.data || []);
    if(!rows.length){ return { ok:false, erro: 'Essa filial ainda não tem nenhum período salvo.' }; }

    Nexus.rawData = rows.map(r => this._linhaDBParaTicket(r));
    Nexus._filialAtual = {
      id: filial.id,
      codigoGaragem: filial.codigo_garagem,
      nome: filial.nome,
      vagas: filial.vagas ?? null,
      municipioNome: filial.municipio_nome || null,
      municipioIbge: filial.municipio_ibge || null,
      supervisor: filial.na_supervisores?.nome || null,
      gestor: filial.na_supervisores?.na_gestores?.nome || null,
      tabelasPreco: filial.tabelas_preco || [],
      naoEncontrada: false,
    };
    Nexus._periodoRelatorioTexto = `Carregado do banco — ${rows.length} tickets (${anoAtual-1}–${anoAtual})`;
    Nexus.filters.dateStart = null;
    Nexus.filters.dateEnd   = null;
    Nexus.applyFilters();
    await NexusDB.save();
    return { ok:true, total: rows.length };
  },

  async _excluirPeriodo(filialId, mesReferencia){
    const { error: errT } = await supa.from('na_tickets')
      .delete().eq('filial_id', filialId).eq('mes_referencia', mesReferencia);
    if(errT) return { ok:false, erro: errT.message };
    const { error: errP } = await supa.from('na_filial_periodos')
      .delete().eq('filial_id', filialId).eq('mes_referencia', mesReferencia);
    if(errP) return { ok:false, erro: errP.message };
    return { ok:true };
  },

  // ── Janela flutuante de "Excluir relatórios" (item 1.3, 07/08/2026) ────
  // A lista de períodos salvos só aparece aqui agora, não mais direto no
  // painel — o usuário abre, marca o que quer excluir, confirma.
  async _abrirModalExcluirPeriodos(filialId, nomeFilial, MESES_ABREV){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);
    const fechar = () => overlay.remove();

    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:14px;width:100%;max-width:460px;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <h2 style="margin:0;font-size:16px;">Excluir relatórios</h2>
          <button id="modal-fechar-periodos" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;">×</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin:0 0 16px;">${esc(nomeFilial)}</p>
        <div id="modal-periodos-lista">
          <p style="font-size:12px;color:var(--muted);">Carregando períodos...</p>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-top:20px;">
          <button id="modal-cancelar-periodos" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Fechar</button>
        </div>
      </div>`;

    overlay.querySelector('#modal-fechar-periodos').onclick = fechar;
    overlay.querySelector('#modal-cancelar-periodos').onclick = fechar;

    const listaEl = overlay.querySelector('#modal-periodos-lista');

    const renderLista = async () => {
      const periodos = await this._carregarPeriodos(filialId);
      if(!periodos.length){
        listaEl.innerHTML = `<p style="font-size:12px;color:var(--muted);margin:0;">Nenhum período salvo pra essa filial.</p>`;
        return;
      }
      listaEl.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;">Períodos salvos</div>
          <button id="btn-excluir-selecionados" style="display:none;background:var(--danger);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">Excluir selecionados (<span id="qtd-selecionados">0</span>)</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${periodos.map(p => {
            const [ano, mes] = p.mes_referencia.split('-');
            return `<label class="chip" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" class="chk-periodo" data-mes="${p.mes_referencia}" style="cursor:pointer;margin:0;">
              ${MESES_ABREV[parseInt(mes,10)-1]}/${ano} · ${p.qtd_tickets}
              <button class="btn-excluir-periodo" data-mes="${p.mes_referencia}" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:13px;padding:0;line-height:1;" title="Excluir só este período">✕</button>
            </label>`;
          }).join('')}
        </div>`;

      const btnExcluirSel = listaEl.querySelector('#btn-excluir-selecionados');
      const qtdSelEl      = listaEl.querySelector('#qtd-selecionados');
      const atualizarBotaoSel = () => {
        const marcados = listaEl.querySelectorAll('.chk-periodo:checked');
        qtdSelEl.textContent = marcados.length;
        btnExcluirSel.style.display = marcados.length ? 'inline-block' : 'none';
      };
      listaEl.querySelectorAll('.chk-periodo').forEach(chk => chk.addEventListener('change', atualizarBotaoSel));

      btnExcluirSel.onclick = async () => {
        const marcados = Array.from(listaEl.querySelectorAll('.chk-periodo:checked')).map(c => c.dataset.mes);
        if(!marcados.length) return;
        const ok = await Nexus.confirmar(
          'Excluir períodos selecionados',
          `Excluir ${marcados.length} período(s) selecionado(s)?\n\nEssa ação não pode ser desfeita — os tickets salvos desses meses serão apagados do banco.`,
          { perigo:true, textoConfirmar:`Excluir ${marcados.length}` }
        );
        if(!ok) return;
        const falhas = [];
        for(const mes of marcados){
          const r = await this._excluirPeriodo(filialId, mes);
          if(!r.ok) falhas.push(mes);
        }
        if(falhas.length) alert(`Erro ao excluir: ${falhas.join(', ')}`);
        renderLista();
      };

      listaEl.querySelectorAll('.btn-excluir-periodo').forEach(btn => {
        btn.onclick = async (e) => {
          e.preventDefault(); // está dentro do <label> — sem isso, tocaria o checkbox junto
          const ok = await Nexus.confirmar(
            'Excluir período',
            `Excluir o período ${btn.dataset.mes}?\n\nEssa ação não pode ser desfeita — os tickets salvos desse mês serão apagados do banco.`,
            { perigo:true, textoConfirmar:'Excluir' }
          );
          if(!ok) return;
          const r = await this._excluirPeriodo(filialId, btn.dataset.mes);
          if(!r.ok){ alert('Erro ao excluir período: '+r.erro); return; }
          renderLista();
        };
      });
    };

    renderLista();
  },

  // Salva os tickets recém-importados (Nexus.rawData) no banco, agrupados por
  // mês. Deduplicação por mês, não por ticket individual — um arquivo com 3
  // meses onde 1 já existe salva só os 2 novos e reporta o que foi bloqueado.
  // UNIQUE(filial_id, mes_referencia) no banco é a trava final contra
  // reimportação silenciosa, mesmo que a checagem prévia aqui falhe por
  // alguma condição de corrida.
  // Insere um mês inteiro em paralelo controlado (pool de N workers), em vez
  // de um lote de cada vez em sequência — corrige lentidão real: 12 meses ×
  // ~11 mil tickets em lotes sequenciais de 500 significava ~264 idas e
  // vindas ao banco, uma esperando a outra. Lote maior (1000) + 4 workers
  // simultâneos reduz isso a poucas rodadas paralelas. Mantém a mesma regra
  // de atomicidade: se qualquer lote falhar, os workers param e quem chamou
  // desfaz o mês inteiro (mesma lógica de antes, só mais rápida).
  async _inserirLotesParalelo(linhas, tamanhoLote = 1000, concorrencia = 4){
    const lotes = [];
    for(let i=0; i<linhas.length; i+=tamanhoLote) lotes.push(linhas.slice(i, i+tamanhoLote));
    let idx = 0;
    let falhou = false;
    const worker = async () => {
      while(idx < lotes.length && !falhou){
        const meuIdx = idx++;
        if(meuIdx >= lotes.length) break;
        const { error } = await supa.from('na_tickets').insert(lotes[meuIdx]);
        if(error){ falhou = true; console.warn('Erro ao salvar lote de tickets:', error); }
      }
    };
    await Promise.all(Array.from({ length: Math.min(concorrencia, lotes.length || 1) }, worker));
    return !falhou;
  },

  async _salvarTicketsNoBanco(filialId){
    const porMes = {};
    Nexus.rawData.forEach(d => {
      const mesStr = this._fmtMesRefDB.format(d.timestampPagamento) + '-01';
      (porMes[mesStr] = porMes[mesStr] || []).push(d);
    });
    const meses = Object.keys(porMes).sort();

    const { data: existentes, error: errExist } = await supa.from('na_filial_periodos')
      .select('mes_referencia, importado_em').eq('filial_id', filialId).in('mes_referencia', meses);
    if(errExist) return { ok:false, erro: errExist.message };
    const jaExiste = new Set((existentes||[]).map(e => e.mes_referencia));

    const salvos = [], bloqueados = [];
    for(const mes of meses){
      if(jaExiste.has(mes)){ bloqueados.push(mes); continue; }
      const ticketsDoMes = porMes[mes];
      const linhas = ticketsDoMes.map(d => this._ticketParaLinhaDB(d, filialId));

      const sucesso = await this._inserirLotesParalelo(linhas);
      if(!sucesso){
        await supa.from('na_tickets').delete().eq('filial_id', filialId).eq('mes_referencia', mes);
        bloqueados.push(mes);
        continue;
      }

      const { error: errPeriodo } = await supa.from('na_filial_periodos').insert({
        filial_id: filialId, mes_referencia: mes, qtd_tickets: ticketsDoMes.length,
        periodo_texto_original: Nexus._periodoRelatorioTexto || null,
      });
      if(errPeriodo){
        // Período não pôde ser registrado — desfaz os tickets também, pra
        // não ficar com dado sem período reconhecido (mesmo raciocínio acima).
        await supa.from('na_tickets').delete().eq('filial_id', filialId).eq('mes_referencia', mes);
        bloqueados.push(mes);
        continue;
      }
      salvos.push(mes);
    }
    return { ok:true, salvos, bloqueados };
  }
};

// Mitigação de CSV/Formula Injection (07/08/2026) — dados de ticket vindos
// do arquivo importado (placa, nome do cliente, usuário pagamento, nome de
// filial/supervisor/gestor cadastrados etc.) acabam em células de planilha
// exportada. Se um desses campos começar com = + - @ (ou tab/CR), alguns
// leitores de Excel/Sheets podem interpretar a célula como fórmula ao abrir
// o arquivo. Neutraliza prefixando com aspas simples — mitigação padrão
// recomendada pela OWASP, aplicada aqui como defesa em profundidade também
// no .xlsx (não só CSV). Só mexe em strings; números/datas passam direto.
function _sanitizarFormula(val){
  if(typeof val !== 'string' || !val.length) return val;
  const c0 = val.charCodeAt(0);
  const perigoso = '=+-@'.includes(val[0]) || c0 === 9 || c0 === 13;
  return perigoso ? `'${val}` : val;
}
