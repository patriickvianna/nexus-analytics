<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nexus Analytics 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#0b0e14; --panel:#11151f; --panel2:#161b27; --border:#222838;
  --text:#e6e9f0; --muted:#8993a8; --accent:#5b8cff; --accent2:#22d3a5;
  --warn:#ffb454; --danger:#ff6b6b; --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
button{font-family:inherit;}

/* ---------- LAYOUT SHELL ---------- */
#shell{display:flex;min-height:100vh;}
#sidebar{
  width:270px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
#sidebar .brand{padding:20px 18px;font-weight:700;font-size:17px;letter-spacing:.3px;border-bottom:1px solid var(--border);flex-shrink:0;}
#sidebar .brand span{color:var(--accent);}
#nav-list{list-style:none;margin:0;padding:10px;flex-shrink:0;}
#nav-list li{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);
  cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:2px;transition:.15s;
}
#nav-list li:hover{background:var(--panel2);color:var(--text);}
#nav-list li.active{background:rgba(91,140,255,.12);color:var(--accent);font-weight:600;}
#nav-list li .ic{width:18px;text-align:center;}

#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{
  height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;padding:0 20px;background:var(--panel);flex-shrink:0;
}
#topbar h1{font-size:16px;margin:0;font-weight:600;}

#content-wrap{flex:1;display:flex;overflow:hidden;}
#filters-panel{
  flex:1;background:var(--panel);border-top:1px solid var(--border);
  padding:16px;overflow-y:auto;
}
#filtro-ativo-banner{
  padding:7px 20px;background:var(--panel2);border-bottom:1px solid var(--border);
  font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
#filtro-ativo-banner strong{color:var(--text);font-weight:600;}
#filtro-ativo-banner.empty{display:none;}
#module-view{flex:1;overflow-y:auto;padding:20px;}

.filt-group{margin-bottom:18px;}
.filt-group h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;}
.filt-row{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.filt-row input,.filt-row select{
  width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:7px 8px;border-radius:7px;font-size:13px;box-sizing:border-box;
}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;}
.chip{
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  padding:5px 7px;border-radius:20px;font-size:12px;cursor:pointer;user-select:none;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.quickbtn{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:6px 8px;border-radius:7px;font-size:12px;cursor:pointer;width:100%;text-align:left;margin-bottom:5px;
}
.quickbtn:hover{border-color:var(--accent);}

/* ---------- KPI / CARDS ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
.kpi-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.kpi-card .val{font-size:22px;font-weight:700;margin-top:4px;white-space:nowrap;}
.kpi-card .sub{font-size:11px;color:var(--accent2);margin-top:2px;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.panel h2{font-size:13px;margin:0 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:600;cursor:pointer;}
tbody tr:hover{background:var(--panel2);}

#drop-zone{
  border:2px dashed var(--accent);border-radius:var(--radius);padding:28px 20px;text-align:center;
  color:var(--text);cursor:pointer;margin-bottom:20px;background:rgba(91,140,255,.08);
}
#drop-zone:active{background:rgba(91,140,255,.16);}
#drop-zone.drag{border-color:var(--accent);color:var(--accent);}
#progress-wrap{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:12px;display:none;}
#progress-bar{height:100%;width:0%;background:var(--accent);transition:.2s;}

/* ---------- LOGIN ---------- */
#login-screen{
  position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
  justify-content:center;z-index:1000;flex-direction:column;gap:20px;
}
#login-screen.hidden{display:none;}
.login-card{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:40px 36px;text-align:center;max-width:360px;width:90%;
}
.login-card h1{font-size:26px;font-weight:700;color:var(--text);margin:0 0 4px;}
.login-card h1 span{color:var(--accent);}
.login-card p{color:var(--muted);font-size:13px;margin:0 0 28px;}
.btn-google{
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#1a1a1a;border:none;border-radius:8px;
  padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;width:100%;
}
.btn-google:hover{background:#f0f0f0;}
.btn-google svg{width:20px;height:20px;}
.user-badge{
  display:flex;align-items:center;gap:8px;padding:5px 10px;
  background:var(--panel2);border:1px solid var(--border);border-radius:20px;
  font-size:12px;color:var(--muted);cursor:pointer;
}
.user-badge img{width:22px;height:22px;border-radius:50%;}

/* ---------- CONFIGURAÇÕES ---------- */
.config-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:0;}
.config-tab{
  padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.config-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-group label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.form-group input,.form-group select{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:7px;font-size:13px;font-family:inherit;
}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);}
.btn-primary{
  background:var(--accent);color:#fff;border:none;padding:9px 18px;
  border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
}
.btn-danger-sm{
  background:none;border:1px solid var(--danger);color:var(--danger);
  padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;
}
.btn-edit-sm{
  background:none;border:1px solid var(--accent);color:var(--accent);
  padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-right:4px;
}
.data-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
.data-table th{padding:8px 10px;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--border);}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--border);}
.data-table tr:hover td{background:var(--panel2);}
.badge-ativa{color:var(--accent2);font-size:11px;font-weight:600;}
.badge-encerrada{color:var(--danger);font-size:11px;font-weight:600;}
.badge-suspensa{color:var(--warn);font-size:11px;font-weight:600;}

/* ---------- TABELAS — scroll horizontal seguro em janelas mais estreitas ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;}
.table-scroll table{min-width:520px;}

/* ---------- Refinamentos visuais (ferramenta é desktop-only) ---------- */
#module-view{padding:24px 28px;}
.kpi-grid{gap:14px;margin-bottom:24px;}
.kpi-card{padding:16px 20px;}
.kpi-card .val{font-size:24px;}
.panel{padding:20px;}
th,td{padding:9px 12px;}
.config-tab{padding:9px 18px;}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="login-screen" style="display:none;">
  <div class="login-card">
    <h1>Nexus <span>Analytics</span></h1>
    <p>Plataforma de análise operacional</p>
    <button class="btn-google" id="btn-google-login">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar com Google
    </button>
  </div>
</div>

<!-- TELA AGUARDANDO APROVAÇÃO -->
<div id="pending-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:1000;align-items:center;justify-content:center;flex-direction:column;">
  <div class="login-card">
    <h1>Nexus <span>Analytics</span></h1>
    <div style="font-size:40px;margin:16px 0;">⏳</div>
    <p id="pending-msg" style="font-size:14px;color:var(--muted);">Aguardando aprovação do administrador...</p>
    <button onclick="NexusAuth.logout()" style="margin-top:16px;background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px;">Sair</button>
  </div>
</div>

<div id="shell" style="display:none;">
  <nav id="sidebar">
    <div class="brand">Nexus <span>Analytics</span></div>
    <ul id="nav-list"></ul>
    <aside id="filters-panel"></aside>
  </nav>

  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <h1 id="module-title">Permanência</h1>
      </div>
      <div class="user-badge" id="user-badge" onclick="NexusAuth.logout()" title="Clique para sair">
        <span id="user-name">...</span>
      </div>
    </div>

    <div id="filtro-ativo-banner"></div>

    <div id="content-wrap">
      <div id="module-view"></div>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   NEXUS CORE
   ====================================================================== */
const Nexus = {
  modules: {},
  activeModuleId: null,
  rawData: [],       // dados normalizados (Schema Universal) — fonte única de verdade
  filteredData: [],
  _filialAtual: null,
  filters: {
    dateStart: null, dateEnd: null,
    weekdays: new Set([0,1,2,3,4,5,6]),
    permInterval: 60, // 30 ou 60 min — compartilhado por todos os módulos (Permanência, Receita, Simulador)
  },

  registerModule(mod){ this.modules[mod.id] = mod; },

  async initAsync(){
    await NexusDB.open();
    this.renderNav();

    // Hidratação automática: restaura relatório salvo no IndexedDB (F5 / iOS background)
    const saved = await NexusDB.load();
    if(saved && Array.isArray(saved.data) && saved.data.length > 0){
      Nexus.rawData      = saved.data;
      Nexus._filialAtual = saved.filial || null;
      Nexus.applyFilters();

      // Banner discreto de restauração (desaparece em 4s)
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 2px 10px rgba(0,0,0,.4)';
      banner.textContent = '📂 Relatório restaurado automaticamente';
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 4000);
    }

    this.goTo(Object.keys(this.modules)[0]);
  },

  renderNav(){
    const ul = document.getElementById('nav-list');
    ul.innerHTML = '';
    Object.values(this.modules).forEach(m=>{
      const li = document.createElement('li');
      li.dataset.id = m.id;
      li.innerHTML = `<span>${m.nome}</span>`;
      li.onclick = ()=> this.goTo(m.id);
      ul.appendChild(li);
    });
  },

  goTo(id){
    this.activeModuleId = id;
    document.querySelectorAll('#nav-list li').forEach(li=>li.classList.toggle('active', li.dataset.id===id));
    this.atualizarTituloTopo();
    this.applyFilters();
    this.modules[id].renderFilters(document.getElementById('filters-panel'));
    this.modules[id].render(document.getElementById('module-view'));
    this.renderFiltroAtivoBanner();
  },

  // O topbar mostra o nome da FILIAL carregada, não o nome do módulo — o
  // módulo ativo já fica destacado na lista de navegação, então repetir o
  // nome ali seria redundante. Sem filial carregada, cai de volta pro nome
  // do módulo (ex: antes da primeira importação).
  atualizarTituloTopo(){
    const filial = Nexus._filialAtual;
    document.getElementById('module-title').textContent =
      (filial && !filial.naoEncontrada) ? filial.nome : this.modules[this.activeModuleId].nome;
  },

  // Resumo do filtro ativo (data, dias da semana, intervalo de permanência) —
  // visível em TODOS os módulos, não só naquele onde foi selecionado. Resolve
  // o problema de "esquecer" o que estava filtrado ao trocar de módulo.
  renderFiltroAtivoBanner(){
    const banner = document.getElementById('filtro-ativo-banner');
    if(!banner) return;
    const f = this.filters;

    const partes = [];

    if(f.dateStart || f.dateEnd){
      const ini = f.dateStart ? dateToInputValue(f.dateStart).split('-').reverse().join('/') : '—';
      const fim = f.dateEnd   ? dateToInputValue(f.dateEnd).split('-').reverse().join('/')   : '—';
      partes.push(`📅 <strong>${ini} até ${fim}</strong>`);
    } else {
      partes.push(`📅 <strong>Todo o período importado</strong>`);
    }

    const SIGLAS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    if(f.weekdays.size === 7){
      partes.push(`Dias: <strong>Todos</strong>`);
    } else if(f.weekdays.size === 0){
      partes.push(`Dias: <strong>Nenhum selecionado</strong>`);
    } else {
      const dias = [...f.weekdays].sort().map(i=>SIGLAS[i]).join(', ');
      partes.push(`Dias: <strong>${dias}</strong>`);
    }

    // Intervalo de permanência só é relevante pros módulos que o usam, mas
    // mostrar sempre ajuda o usuário a lembrar o que está configurado.
    partes.push(`Intervalo: <strong>${f.permInterval===30 ? '30 min' : '1 hora'}</strong>`);

    banner.innerHTML = `Filtro ativo — ${partes.join(' &nbsp;·&nbsp; ')}`;
  },

  // Renderização + binding padrão do painel de filtros (data, dias da semana e,
  // opcionalmente, intervalo de permanência). Usada por todos os módulos que
  // precisam de filtro — antes duplicada em cada um, agora centralizada aqui
  // já que o estado (Nexus.filters) sempre foi global.
  renderFiltrosPadrao(container, comIntervalo){
    container.innerHTML = `
      <div class="filt-group">
        <h3>Data inicial / final</h3>
        <div class="filt-row">
          <input type="date" id="f-start" value="${dateToInputValue(this.filters.dateStart)}">
          <input type="date" id="f-end" value="${dateToInputValue(this.filters.dateEnd)}">
        </div>
      </div>

      <div class="filt-group">
        <h3>Dias da semana</h3>
        <div class="chip-row" id="weekday-chips">
          ${['D','S','T','Q','Q','S','S'].map((d,i)=>`<div class="chip ${this.filters.weekdays.has(i)?'on':''}" data-day="${i}">${d}</div>`).join('')}
        </div>
      </div>

      ${comIntervalo ? `
      <div class="filt-group">
        <h3>Intervalo de permanência</h3>
        <div class="chip-row" id="interval-chips">
          <div class="chip ${this.filters.permInterval===30?'on':''}" data-interval="30">30 min</div>
          <div class="chip ${this.filters.permInterval===60?'on':''}" data-interval="60">1 hora</div>
        </div>
      </div>` : ''}

      <button class="quickbtn" id="btn-clear" style="margin-top:8px;color:var(--danger);border-color:var(--danger);">✕ Limpar filtros</button>
    `;

    container.querySelector('#f-start').onchange = e=>{
      this.filters.dateStart = e.target.value ? new Date(e.target.value + 'T00:00:00-03:00') : null;
      this.refreshActive();
    };
    container.querySelector('#f-end').onchange = e=>{
      this.filters.dateEnd = e.target.value ? new Date(e.target.value + 'T23:59:59-03:00') : null;
      this.refreshActive();
    };
    container.querySelectorAll('#weekday-chips .chip').forEach(chip=>{
      chip.onclick = ()=>{
        const day = parseInt(chip.dataset.day);
        chip.classList.toggle('on');
        if(chip.classList.contains('on')) this.filters.weekdays.add(day);
        else this.filters.weekdays.delete(day);
        this.refreshActive();
      };
    });
    if(comIntervalo){
      container.querySelectorAll('#interval-chips .chip').forEach(chip=>{
        chip.onclick = ()=>{
          container.querySelectorAll('#interval-chips .chip').forEach(c=>c.classList.remove('on'));
          chip.classList.add('on');
          this.filters.permInterval = parseInt(chip.dataset.interval);
          this.refreshActive();
        };
      });
    }
    container.querySelector('#btn-clear').onclick = ()=>{
      this.filters.dateStart = null;
      this.filters.dateEnd   = null;
      this.filters.weekdays  = new Set([0,1,2,3,4,5,6]);
      this.filters.permInterval = 60;
      this.renderFiltrosPadrao(container, comIntervalo);
      this.refreshActive();
    };
  },

  applyFilters(){
    const f = this.filters;
    this.filteredData = this.rawData.filter(d=>{
      if(f.dateStart && d.timestampPagamento < f.dateStart) return false;
      if(f.dateEnd && d.timestampPagamento > f.dateEnd) return false;
      if(!f.weekdays.has(d.diaPagamento)) return false;
      return true;
    });
  },

  refreshActive(){
    this.applyFilters();
    this.modules[this.activeModuleId].render(document.getElementById('module-view'));
    this.renderFiltroAtivoBanner();
  },

  /* ---------------- ENGINE DE IMPORTAÇÃO + NORMALIZAÇÃO ---------------- */
  async importFiles(fileList, onProgress){
    let all = [];
    const files = Array.from(fileList);
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const rows = await this._parseFile(file);
      all = all.concat(this._normalize(rows));
      onProgress(Math.round(((i+1)/files.length)*100));
    }
    this.rawData = this.rawData.concat(all);
    return all.length;
  },

  _parseFile(file){
    return new Promise((resolve)=>{
      const ext = file.name.split('.').pop().toLowerCase();
      if(ext==='csv'){
        // header:false → array de arrays (igual ao XLSX), para _normalize() pular
        // as ~10 linhas de metadados do relatório e usar índices de coluna fixos
        Papa.parse(file, {
          header: false,
          skipEmptyLines: true,
          complete: r => resolve(r.data)
        });
      } else if(ext==='xlsx' || ext==='xls'){
        const reader = new FileReader();
        reader.onload = e=>{
          const wb = XLSX.read(e.target.result, {type:'binary'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          // header:1 → array de arrays — necessário porque o relatório tem metadados antes do cabeçalho real
          resolve(XLSX.utils.sheet_to_json(sheet, {header:1, defval:''}));
        };
        reader.readAsBinaryString(file);
      } else {
        resolve([]); // PDF entra na Fase 5 — fora do escopo deste esqueleto
      }
    });
  },

  // Resolve índices de colunas lendo o cabeçalho real do relatório.
  // Busca por nome em vez de posição fixa — imune a colunas novas/reordenadas na origem.
  // Nomes confirmados contra relatório "Tickets Pagos e Cancelados" real (19/07/2026).
  _resolverColunas(rows){
    let headerIdx = -1;
    let headerRow = null;

    for(let i = 0; i < Math.min(15, rows.length); i++){
      const row = Array.isArray(rows[i]) ? rows[i] : Object.values(rows[i]);
      const vals = row.map(c => String(c||'').trim().toUpperCase());
      if(vals.some(v => v === 'TICKET') && vals.some(v => v.includes('VALOR'))){
        headerRow = vals;
        headerIdx = i;
        break;
      }
    }

    if(!headerRow){
      console.warn('_resolverColunas: cabeçalho não encontrado — usando índices padrão como fallback');
      return {
        headerIdx: 9,
        ticket:1, entrada:5, hora_entrada:7, saida:9, hora_saida:10,
        formaPag:12, valor:13, dataPagto:16, horaPagto:17,
        perm:18, cancelado:19, tolerancia:20,
        placa:4, usuarioPagamento:15, nomeCliente:32, telefoneCliente:33, detalhe:34
      };
    }

    const idx = (...termos) => {
      const i = headerRow.findIndex(c => termos.some(t => c.includes(t)));
      return i >= 0 ? i : null;
    };

    return {
      headerIdx,
      ticket:       idx('TICKET'),
      entrada:      idx('DATA ENTRADA', 'DT ENTRADA'),
      hora_entrada: idx('HORA ENTRADA'),
      saida:        idx('DATA SAIDA', 'DATA SAÍDA', 'DT SAIDA'),
      hora_saida:   idx('HORA SAIDA', 'HORA SAÍDA'),
      formaPag:     idx('FORMA PAGAMENTO', 'FORMA PAG'),
      valor:        idx('VALOR'),
      dataPagto:    idx('DATA PAGTO', 'DT PAGTO'),
      horaPagto:    idx('HORA PAGTO'),
      perm:         idx('PERMANÊNCIA', 'PERMANENCIA'),
      cancelado:    idx('CANCELADO'),
      tolerancia:   idx('TOLERÂNCIA', 'TOLERANCIA'),
      // Colunas do Módulo de Cancelados — validadas contra relatório-modelo real
      placa:            idx('PLACA'),
      usuarioPagamento: idx('USUARIO PAGAMENTO', 'USUÁRIO PAGAMENTO'),
      nomeCliente:      idx('NOME CLIENTE'),
      telefoneCliente:  idx('TELEFONE CLIENTE'),
      detalhe:          idx('DETALHE'),
    };
  },

  // Normalizador mapeado para o relatório "Tickets Pagos e Cancelados"
  // Cabeçalho detectado dinamicamente por _resolverColunas() — imune a reordenação de colunas.
  _normalize(rows){
    const isArrayRow = Array.isArray(rows[0]);
    const COL = this._resolverColunas(rows);
    // Pula até a linha após o cabeçalho detectado dinamicamente
    const dataRows = isArrayRow ? rows.slice(COL.headerIdx + 1) : rows;

    const parseDataHora = (dataStr, horaStr) => {
      if(!dataStr) return null;
      const ds = String(dataStr).trim();
      const hs = String(horaStr||'').trim();
      const m = ds.match(/(\d{2})\/(\d{2})\/(\d{4})/);
      if(!m) return null;
      const [,d,mo,y] = m;
      const time = hs.match(/\d{2}:\d{2}/) ? hs.substring(0,5) : '00:00';
      // Força fuso BRT (UTC-3) — evita que dispositivos em outro fuso (ex: iOS em viagem)
      // desloquem transações noturnas para o dia errado
      return new Date(`${y}-${mo}-${d}T${time}:00-03:00`);
    };

    // Helpers de data sempre em BRT, independente do fuso do dispositivo
    const diaSemana = ts => new Date(ts.toLocaleString('en-US', {timeZone:'America/Sao_Paulo'})).getDay();
    const dataStr   = ts => ts.toLocaleDateString('pt-BR', {timeZone:'America/Sao_Paulo'});
    // jan1 forçado em BRT — elimina brecha onde new Date(year,0,1) usa fuso local do aparelho
    const semanaStr = ts => {
      const jan1 = new Date(`${ts.getFullYear()}-01-01T00:00:00-03:00`);
      const wk   = Math.ceil(((ts - jan1) / 86400000 + jan1.getDay() + 1) / 7);
      return `${ts.getFullYear()}-W${String(wk).padStart(2,'0')}`;
    };

    const parsePermMin = str => {
      if(!str) return 0;
      const m = String(str).match(/(\d+)d\s+(\d+):(\d+):(\d+)/);
      if(!m) return 0;
      const [,d,h,min] = m;
      return parseInt(d)*1440 + parseInt(h)*60 + parseInt(min);
    };

    const parseValor = str => {
      if(!str) return 0;
      return parseFloat(String(str).replace(/[R$\s]/g,'').replace(',','.')) || 0;
    };

    return dataRows
      .map((r, i) => {
        const get = col => isArrayRow ? r[col] : Object.values(r)[col];
        const entrada = parseDataHora(get(COL.entrada), get(COL.hora_entrada));
        if(!entrada || isNaN(entrada.getTime())) return null;

        const forma = String(get(COL.formaPag)||'').trim();
        const isCancelado = String(get(COL.cancelado)||'').trim().toUpperCase() === 'CANCELADO'
          || forma.toUpperCase() === 'TICKET CANCELADO';

        // timestampPagamento: usado como referência de dia/semana em TODOS os módulos
        // (filtros, dia da semana, agrupamento semanal, melhor dia). NÃO é usado para
        // recalcular permanência — isso continua vindo direto da coluna PERMANÊNCIA.
        // Sem DATA PAGTO válida (raro; 0 casos no relatório-modelo), o registro é
        // descartado em vez de "chutar" a data de entrada como referência de pagamento.
        const pagamento = parseDataHora(get(COL.dataPagto), get(COL.horaPagto));
        if(!pagamento || isNaN(pagamento.getTime())) return null;

        const valorPago     = parseValor(get(COL.valor));
        const formaPagamento = isCancelado ? 'Cancelado' : (forma || 'N/D');
        const tolerancia    = String(get(COL.tolerancia)||'').trim().toLowerCase() === 'sim';
        const status        = isCancelado ? 'cancelado' : 'pago';

        // Campos do Módulo de Cancelados — extraídos para todo registro (não só cancelados)
        // para manter _normalize() como única fonte de verdade normalizada.
        const placa            = String(get(COL.placa)||'').trim();
        const usuarioPagamento = String(get(COL.usuarioPagamento)||'').trim();
        const nomeCliente      = String(get(COL.nomeCliente)||'').trim();
        const telefoneCliente  = String(get(COL.telefoneCliente)||'').trim();
        const detalhe          = String(get(COL.detalhe)||'').trim();

        // isPago: regra universal calculada uma vez — módulos fazem filter(d=>d.isPago)
        const fp = formaPagamento.toLowerCase();
        const isPago = status === 'pago'
          && valorPago > 0
          && !tolerancia
          && fp !== 'n/d'
          && !fp.includes('sem pagamento')
          && !fp.includes('cancelado')
          && !fp.includes('desconto');

        return {
          id: 'r'+i+'_'+Date.now(),
          ticket: String(get(COL.ticket)||'').trim(),
          timestampEntrada: entrada,
          timestampSaida: parseDataHora(get(COL.saida), get(COL.hora_saida)),
          timestampPagamento: pagamento,
          // Pré-computados uma vez aqui — evita recalcular em cada loop de módulo
          diaPagamento:       diaSemana(pagamento),   // 0=Dom…6=Sáb, sempre em BRT
          dataPagamentoStr:   dataStr(pagamento),      // "DD/MM/YYYY" em BRT
          semanaPagamentoStr: semanaStr(pagamento),    // "YYYY-WWW" em BRT (jan1 forçado)
          isPago,
          permanenciaMin: parsePermMin(get(COL.perm)),
          valorPago,
          formaPagamento,
          tolerancia,
          status,
          placa,
          usuarioPagamento,
          nomeCliente,
          telefoneCliente,
          detalhe
        };
      })
      .filter(Boolean);
  }
};

/* ======================================================================
   MÓDULO PERMANÊNCIA PAGAMENTO
   Fusão de Permanência + Receita (Fase 1 — reorganização pré-Intelligence
   Engine, 26/07/2026). Mostra volume e receita realizados lado a lado, por
   faixa de permanência × dia da semana — antes eram 2 telas separadas que
   precisavam ser cruzadas visualmente pelo usuário.
   ====================================================================== */
const ModuloPermanenciaReceita = {
  id: 'permanencia',
  nome: 'Permanência Pagamento',
  icon: '📍',

  renderFilters(container){ Nexus.renderFiltrosPadrao(container, true); },

  async _handleFiles(files){
    const wrap = document.getElementById('progress-wrap');
    const bar = document.getElementById('progress-bar');
    wrap.style.display = 'block';
    await Nexus.importFiles(files, pct=>{ bar.style.width = pct+'%'; });
    setTimeout(()=>{ wrap.style.display='none'; bar.style.width='0%'; }, 600);
    Nexus.refreshActive();
  },

  _kpis(todos, pagos){
    const permPeriodo = pagos.length ? pagos.reduce((s,d)=>s+d.permanenciaMin,0)/pagos.length : 0;
    const todosOsMeses = Nexus.rawData.filter(d=>d.isPago);
    const permMes = todosOsMeses.length ? todosOsMeses.reduce((s,d)=>s+d.permanenciaMin,0)/todosOsMeses.length : 0;

    const receita = pagos.reduce((s,d)=>s+d.valorPago, 0);
    const diasUnicos = new Set(pagos.map(d=>d.dataPagamentoStr));
    const mediaDia = diasUnicos.size ? receita / diasUnicos.size : 0;
    const ticket = pagos.length ? receita / pagos.length : 0;

    const porDia = {};
    pagos.forEach(d=>{ const k=d.dataPagamentoStr; porDia[k]=(porDia[k]||0)+d.valorPago; });
    const melhor = Object.entries(porDia).sort((a,b)=>b[1]-a[1])[0] || ['—', 0];

    const fmt = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
    return {
      volume: pagos.length.toLocaleString('pt-BR'),
      permMes: minToHHMM(Math.round(permMes)),
      permPeriodo: minToHHMM(Math.round(permPeriodo)),
      receitaTotal: fmt(receita),
      mediaDia: fmt(mediaDia),
      ticketMedio: fmt(ticket),
      melhorDiaVal: fmt(melhor[1]),
      melhorDiaData: melhor[0],
    };
  },

  render(container){
    const todos = Nexus.filteredData;
    const pagos = todos.filter(d => d.isPago);
    const kpis = this._kpis(todos, pagos);

    const buckets = gerarBucketsPermanencia(Nexus.filters.permInterval);
    const linhas = agregarPermanenciaEReceita(pagos, buckets);

    const days = [{l:'Domingo',i:0},{l:'Segunda',i:1},{l:'Terça',i:2},{l:'Quarta',i:3},{l:'Quinta',i:4},{l:'Sexta',i:5},{l:'Sábado',i:6}];

    // Top 3 faixas por receita total, respeitando o filtro atual — destaque só de cor
    const ranking = [...linhas].sort((a,b)=>b.receitaTotal-a.receitaTotal).slice(0,3);
    const bgPorLabel = {};
    const bgRank = ['rgba(91,140,255,.18);','rgba(91,140,255,.12);','rgba(91,140,255,.06);'];
    ranking.forEach((l,i) => { bgPorLabel[l.label] = bgRank[i]; });

    const grandVolume  = linhas.reduce((s,l)=>s+l.volumeTotal, 0);
    const grandReceita = linhas.reduce((s,l)=>s+l.receitaTotal, 0);
    const colVol = {}; days.forEach(d=>{ colVol[d.i] = linhas.reduce((s,l)=>s+l.volumePorDia[d.i],0); });
    const colRec = {}; days.forEach(d=>{ colRec[d.i] = linhas.reduce((s,l)=>s+l.receitaPorDia[d.i],0); });

    const fmtR = v => v===0 ? `<span style="color:var(--border)">-</span>`
      : 'R$\u00a0'+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const fmtV = v => v===0 ? `<span style="color:var(--border)">-</span>` : `${v}`;

    const thStyle = 'position:sticky;top:0;background:var(--panel2);padding:6px 8px;text-align:center;color:var(--muted);border-bottom:2px solid var(--border);font-size:11px;';
    const divisor = 'border-right:2px solid var(--border);'; // separa visualmente cada dia da semana

    container.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card"><div class="lbl">Volume</div><div class="val">${kpis.volume}</div><div class="sub">pagamentos reais</div></div>
        <div class="kpi-card"><div class="lbl">Receita Total</div><div class="val">R$ ${kpis.receitaTotal}</div></div>
        <div class="kpi-card"><div class="lbl">Ticket Médio</div><div class="val">R$ ${kpis.ticketMedio}</div></div>
        <div class="kpi-card"><div class="lbl">Melhor Dia</div><div class="val">R$ ${kpis.melhorDiaVal}</div><div class="sub">${kpis.melhorDiaData}</div></div>
        <div class="kpi-card"><div class="lbl">Receita Média / Dia</div><div class="val">R$ ${kpis.mediaDia}</div></div>
      </div>

      <div class="panel" style="overflow:hidden;">
        <h2>Permanência × Volume × Receita por Dia da Semana</h2>
        <p style="font-size:11px;color:var(--muted);margin:-6px 0 10px;">As linhas destacadas em azul indicam as 3 faixas com maior receita no período filtrado.</p>
        <div class="table-scroll">
          <table style="font-size:12px;border-collapse:collapse;">
            <thead>
              <tr>
                <th rowspan="2" style="${thStyle}text-align:left;left:0;z-index:2;">Permanência</th>
                ${days.map(d=>`<th colspan="2" style="${thStyle}${divisor}">${d.l}</th>`).join('')}
                <th colspan="2" style="${thStyle}color:var(--accent);">Total</th>
              </tr>
              <tr>
                ${days.map((d,idx)=>`<th style="${thStyle}">Vol.</th><th style="${thStyle}${divisor}">Receita</th>`).join('')}
                <th style="${thStyle}color:var(--accent);">Vol.</th><th style="${thStyle}color:var(--accent);">Receita</th>
              </tr>
            </thead>
            <tbody>
              ${linhas.map((l,i) => {
                const bg = bgPorLabel[l.label] || (i%2===0 ? 'var(--panel);' : 'var(--panel2);');
                return `
                <tr style="background:${bg}">
                  <td style="padding:5px 10px;color:var(--accent2);font-weight:600;white-space:nowrap;">${l.label}</td>
                  ${days.map(d=>`<td style="padding:5px 8px;text-align:center;">${fmtV(l.volumePorDia[d.i])}</td><td style="padding:5px 8px;text-align:right;${divisor}">${fmtR(l.receitaPorDia[d.i])}</td>`).join('')}
                  <td style="padding:5px 10px;text-align:center;font-weight:700;">${l.volumeTotal}</td>
                  <td style="padding:5px 10px;text-align:right;font-weight:700;color:var(--accent);">${fmtR(l.receitaTotal)}</td>
                </tr>`;
              }).join('')}
            </tbody>
            <tfoot>
              <tr style="border-top:2px solid var(--border);">
                <td style="padding:7px 10px;font-weight:700;">Total</td>
                ${days.map(d=>`<td style="padding:7px 8px;text-align:center;font-weight:700;">${colVol[d.i]}</td><td style="padding:7px 8px;text-align:right;font-weight:700;${divisor}">${fmtR(colRec[d.i])}</td>`).join('')}
                <td style="padding:7px 10px;text-align:center;font-weight:700;color:var(--accent);">${grandVolume.toLocaleString('pt-BR')}</td>
                <td style="padding:7px 10px;text-align:right;font-weight:700;color:var(--accent);">${fmtR(grandReceita)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    `;
  },

  exportarDados(){
    const todos = Nexus.filteredData;
    const pagos = todos.filter(d => d.isPago);
    const kpis = this._kpis(todos, pagos);

    const buckets = gerarBucketsPermanencia(Nexus.filters.permInterval);
    const linhas = agregarPermanenciaEReceita(pagos, buckets);
    const days = [{l:'Domingo',i:0},{l:'Segunda',i:1},{l:'Terça',i:2},{l:'Quarta',i:3},{l:'Quinta',i:4},{l:'Sexta',i:5},{l:'Sábado',i:6}];

    const colunas = ['Permanência'];
    const tiposColuna = ['texto'];
    days.forEach(d => { colunas.push(`Vol. ${d.l}`, `Receita ${d.l}`); tiposColuna.push('numero','moeda'); });
    colunas.push('Vol. Total', 'Receita Total');
    tiposColuna.push('numero','moeda');

    const linhasExport = linhas.map(l => {
      const row = [ l.label ];
      days.forEach(d => row.push(l.volumePorDia[d.i], l.receitaPorDia[d.i]));
      row.push(l.volumeTotal, l.receitaTotal);
      return row;
    });
    const totalRow = ['TOTAL'];
    days.forEach(d => totalRow.push(
      linhas.reduce((s,l)=>s+l.volumePorDia[d.i],0),
      linhas.reduce((s,l)=>s+l.receitaPorDia[d.i],0)
    ));
    totalRow.push(linhas.reduce((s,l)=>s+l.volumeTotal,0), linhas.reduce((s,l)=>s+l.receitaTotal,0));
    linhasExport.push(totalRow);

    return {
      titulo: 'Permanência Pagamento',
      kpis: [
        { label:'Volume (pagos)', valor: kpis.volume },
        { label:'Receita Total', valor: 'R$ '+kpis.receitaTotal },
        { label:'Ticket Médio', valor: 'R$ '+kpis.ticketMedio },
        { label:'Melhor Dia', valor: `R$ ${kpis.melhorDiaVal} (${kpis.melhorDiaData})` },
        { label:'Receita Média / Dia', valor: 'R$ '+kpis.mediaDia },
      ],
      tabelas: [{
        titulo: 'Permanência × Volume × Receita por Dia da Semana',
        colunas, tiposColuna,
        linhas: linhasExport,
      }],
    };
  },
};


/* ======================================================================
   MÓDULO CANCELADOS
   Acompanhamento de cancelamentos reais (exclui baixas automáticas do
   sistema — ADMIN / USUÁRIO AUTOMÁTICO — que representam ~98% dos
   registros CANCELADO no relatório-modelo, mas não são eventos de
   negócio: valor R$0,00, sem observação. Confirmado com o gestor:
   registros restantes ainda precisam de valor > 0 para entrar no módulo.
   ====================================================================== */
const ModuloCancelados = {
  id: 'cancelados',
  nome: 'Cancelados',
  icon: '🚫',
  _page: 0,
  _pageSize: 50,
  _all: [],
  _filtered: [],

  renderFilters(container){ Nexus.renderFiltrosPadrao(container, false); },

  // Remove acentos e uppercase — usado tanto na exclusão de usuário quanto na busca
  _norm(str){
    return String(str||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  },

  _isUsuarioSistema(usuario){
    const u = this._norm(usuario);
    return u === 'ADMIN' || u === 'USUARIO AUTOMATICO';
  },

  // Regra de negócio confirmada: status cancelado + operador humano (exclui
  // ADMIN/USUÁRIO AUTOMÁTICO) + valor > 0. Consome Nexus.filteredData, que já
  // respeita o filtro de data/dia da semana ativo no cabeçalho.
  getFilteredCanceladosData(){
    return Nexus.filteredData.filter(d =>
      d.status === 'cancelado'
      && !this._isUsuarioSistema(d.usuarioPagamento)
      && d.valorPago > 0
    );
  },

  render(container){
    const pagos      = Nexus.filteredData.filter(d => d.isPago);
    const cancelados = this.getFilteredCanceladosData();
    this._all      = cancelados;
    this._filtered = cancelados;
    this._page     = 0;

    const fmtR = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

    const volumeReal     = pagos.length;
    const receitaReal    = pagos.reduce((s,d)=>s+d.valorPago, 0);
    const totalCancel    = cancelados.length;
    const pctCancel      = volumeReal ? ((totalCancel/volumeReal)*100).toFixed(2) : '0.00';
    const receitaPerdida = cancelados.reduce((s,d)=>s+d.valorPago, 0);

    // Distribuição por operador (single-pass, mesmo padrão dos demais módulos)
    const porOperador = new Map();
    cancelados.forEach(d=>{
      const op = d.usuarioPagamento || 'N/D';
      if(!porOperador.has(op)) porOperador.set(op, { qtd:0, valor:0 });
      const r = porOperador.get(op);
      r.qtd   += 1;
      r.valor += d.valorPago;
    });
    const operadoresSort = [...porOperador.entries()].sort((a,b)=>b[1].qtd-a[1].qtd);

    container.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="lbl">Volume Atendido Real</div>
          <div class="val">${volumeReal.toLocaleString('pt-BR')}</div>
        </div>
        <div class="kpi-card">
          <div class="lbl">Receita Total Real</div>
          <div class="val">${fmtR(receitaReal)}</div>
        </div>
        <div class="kpi-card" style="border-left:3px solid var(--danger);">
          <div class="lbl">Total de Cancelamentos</div>
          <div class="val">${totalCancel.toLocaleString('pt-BR')}</div>
          <div class="sub" style="color:var(--danger);">${pctCancel}% do volume real</div>
        </div>
        <div class="kpi-card" style="border-left:3px solid var(--warn);">
          <div class="lbl">Receita Perdida Estimada</div>
          <div class="val" style="color:var(--warn);">${fmtR(receitaPerdida)}</div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:14px;overflow:hidden;">
        <h2>Distribuição por Operador</h2>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Operador</th><th>Qtd. Cancelamentos</th><th>Valor Total Perdido</th><th>% do Total</th></tr></thead>
            <tbody>
              ${operadoresSort.map(([op,r])=>`
                <tr>
                  <td>${esc(op)}</td>
                  <td>${r.qtd}</td>
                  <td>${fmtR(r.valor)}</td>
                  <td>${totalCancel ? ((r.qtd/totalCancel)*100).toFixed(1) : '0.0'}%</td>
                </tr>`).join('') || `<tr><td colspan="4" style="color:var(--muted);">Nenhum cancelamento no período</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel" style="overflow:hidden;">
        <h2>Tickets Cancelados</h2>
        <input type="text" id="cancelados-search" placeholder="Buscar por Placa, Ticket ou Operador..."
          style="width:100%;max-width:340px;padding:8px 12px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;">
        <div id="cancelados-table-wrap"></div>
      </div>
    `;

    // Busca rápida: filtra só as linhas renderizadas, sem reprocessar os KPIs acima
    container.querySelector('#cancelados-search').oninput = e=>{
      const q = this._norm(e.target.value);
      this._filtered = !q ? this._all : this._all.filter(d=>
        this._norm(d.placa+' '+d.ticket+' '+d.usuarioPagamento).includes(q)
      );
      this._page = 0;
      this._renderTable();
    };

    this._renderTable();
  },

  _renderTable(){
    const wrap = document.getElementById('cancelados-table-wrap');
    if(!wrap) return;

    const fmtR = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const fmtDataHora = ts => ts ? ts.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';

    const totalPages = Math.max(1, Math.ceil(this._filtered.length / this._pageSize));
    this._page = Math.min(this._page, totalPages - 1);
    const slice = this._filtered.slice(this._page*this._pageSize, this._page*this._pageSize + this._pageSize);

    wrap.innerHTML = `
      <div class="table-scroll">

          <thead>
            <tr><th>Ticket</th><th>Placa</th><th>Operador</th><th>Data/Hora Cancelamento</th><th>Valor</th><th>Ações</th></tr>

          <tbody>
            ${slice.map(d=>`
              <tr>
                <td>${esc(d.ticket)}</td>
                <td>${esc(d.placa || '-')}</td>

      </div>
      ${this._filtered.length > this._pageSize ? `
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:10px;font-size:12px;color:var(--muted);">
        <button class="quickbtn" id="cancelados-prev" ${this._page===0 ? 'disabled' : ''}>‹ Anterior</button>
        <span>Página ${this._page+1} de ${totalPages}</span>
        <button class="quickbtn" id="cancelados-next" ${this._page>=totalPages-1 ? 'disabled' : ''}>Próxima ›</button>

    const prevBtn = document.getElementById('cancelados-prev');
    const nextBtn = document.getElementById('cancelados-next');
    if(prevBtn) prevBtn.onclick = ()=>{ this._page--; this._renderTable(); };
    if(nextBtn) nextBtn.onclick = ()=>{ this._page++; this._renderTable(); };

  // Modal ad-hoc — o app não possui um #modal-container genérico; segue o
  // mesmo padrão de overlay usado no modal de Tabela de Tarifas.
  showDetail(id){
    const d = this._all.find(x=>x.id===id) || this._filtered.find(x=>x.id===id);
    if(!d) return;

    const fmtR = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const fmtDataHora = ts => ts ? ts.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'}) : '-';
    const linha = (label, valor) => `
      <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
        <span style="color:var(--muted);font-size:12px;">${label}</span>
        <span style="font-size:13px;text-align:right;">${valor}</span>
      </div>`;

    const overlay = document.createElement('div');
    overlay.id = 'modal-cancelado-detalhe';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;';
    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <h2 style="margin:0;font-size:16px;">🚫 Detalhes do Cancelamento</h2>
          <button id="modal-fechar" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;">✕</button>
        </div>
        ${linha('Número do Ticket', esc(d.ticket))}
        ${linha('Placa do Veículo', esc(d.placa || '-'))}
        ${linha('Operador Responsável', esc(d.usuarioPagamento || '-'))}
        ${linha('Data e Hora de Entrada', fmtDataHora(d.timestampEntrada))}
        ${linha('Data e Hora do Cancelamento', fmtDataHora(d.timestampPagamento))}
        ${linha('Valor do Ticket', fmtR(d.valorPago))}
        ${linha('Nome do Cliente', esc(d.nomeCliente || '-'))}
        <div style="padding-top:10px;">
          <div style="color:var(--muted);font-size:12px;margin-bottom:4px;">Motivo / Observações</div>
          <div style="font-size:13px;line-height:1.5;">${esc(d.detalhe) || 'Sem observações registradas.'}</div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    const fechar = () => overlay.remove();
    overlay.querySelector('#modal-fechar').onclick = fechar;
    overlay.onclick = e => { if(e.target === overlay) fechar(); };
  },

  exportarDados(){
    const pagos      = Nexus.filteredData.filter(d => d.isPago);
    const cancelados = this.getFilteredCanceladosData();

    const volumeReal     = pagos.length;
    const receitaReal    = pagos.reduce((s,d)=>s+d.valorPago, 0);
    const totalCancel    = cancelados.length;
    const pctCancel      = volumeReal ? totalCancel/volumeReal : 0;
    const receitaPerdida = cancelados.reduce((s,d)=>s+d.valorPago, 0);

    const porOperador = new Map();
    cancelados.forEach(d=>{
      const op = d.usuarioPagamento || 'N/D';
      if(!porOperador.has(op)) porOperador.set(op, { qtd:0, valor:0 });
      const r = porOperador.get(op);
      r.qtd += 1; r.valor += d.valorPago;
    });
    const operadoresSort = [...porOperador.entries()].sort((a,b)=>b[1].qtd-a[1].qtd);

    const fmtDataHora = ts => ts ? ts.toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo', day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';

    return {
      titulo: 'Cancelados',
      kpis: [
        { label:'Volume Atendido Real', valor: volumeReal },
        { label:'Receita Total Real', valor: 'R$ '+receitaReal.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Total de Cancelamentos', valor: totalCancel },
        { label:'% Cancelamentos sobre o Volume Real', valor: (pctCancel*100).toFixed(2)+'%' },
        { label:'Receita Perdida Estimada', valor: 'R$ '+receitaPerdida.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
      ],
      tabelas: [
        {
          titulo: 'Distribuição por Operador',
          colunas: ['Operador', 'Qtd. Cancelamentos', 'Valor Total Perdido', '% do Total'],
          tiposColuna: ['texto','numero','moeda','percentual'],
          linhas: [
            ...operadoresSort.map(([op,r]) => [op, r.qtd, r.valor, totalCancel ? r.qtd/totalCancel : 0]),
            ['TOTAL', totalCancel, receitaPerdida, 1],
          ],
        },
        {
          titulo: 'Tickets Cancelados (detalhado)',
          colunas: ['Ticket','Placa','Operador','Data/Hora Cancelamento','Valor','Nome do Cliente','Motivo/Observações'],
          tiposColuna: ['texto','texto','texto','texto','moeda','texto','texto'],
          linhas: cancelados.map(d => [
            d.ticket, d.placa||'-', d.usuarioPagamento||'-', fmtDataHora(d.timestampPagamento), d.valorPago,
            d.nomeCliente||'-', d.detalhe||'Sem observações registradas.'
          ]),
        },
      ],
    };
  },
};

   ====================================================================== */
const ModuloPagamentos = {
  id: 'pagamentos',
  nome: 'Transações',
  icon: '💳',

  renderFilters(container){ Nexus.renderFiltrosPadrao(container, false); },

  render(container){
    const data = Nexus.filteredData.filter(d => d.isPago);

    // --- Agrupa por forma de pagamento ---
    const formas = {};
    data.forEach(d=>{
      if(!formas[d.formaPagamento]) formas[d.formaPagamento] = { receita:0, volume:0 };
      formas[d.formaPagamento].receita += d.valorPago;
      formas[d.formaPagamento].volume  += 1;
    });
    const totalReceita = Object.values(formas).reduce((s,f)=>s+f.receita, 0);
    const formasSort = Object.entries(formas).sort((a,b)=>b[1].receita-a[1].receita);

    const fmtR = v => 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const COLORS = ['#5b8cff','#22d3a5','#ffb454','#ff6b6b','#a78bfa','#38bdf8','#fb923c','#4ade80','#f472b6','#34d399'];

    container.innerHTML = `
      <!-- Cards por forma de pagamento -->
      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
        ${formasSort.map(([forma, f], i)=>{
          const pct = totalReceita ? ((f.receita/totalReceita)*100).toFixed(1) : '0.0';
          const cor = COLORS[i % COLORS.length];
          return `
          <div class="kpi-card" style="border-left:3px solid ${cor};">
            <div class="lbl" style="color:${cor};">${forma}</div>
            <div class="val" style="font-size:18px;">${fmtR(f.receita)}</div>
            <div style="display:flex;justify-content:space-between;margin-top:4px;">
              <span style="font-size:11px;color:var(--muted);">${f.volume.toLocaleString('pt-BR')} transações</span>
              <span style="font-size:11px;font-weight:700;color:var(--accent2);">${pct}%</span>
            </div>
          </div>`;
        }).join('') || '<div class="kpi-card"><div class="lbl">Aguardando dados</div></div>'}
      </div>

      <!-- Tabela cruzada: Receita × Forma × Semana -->
      <div class="panel" style="overflow:hidden;">
        <h2>Receita (R$) × Forma de pagamento × Semana</h2>
        <div id="pag-semana-wrap"></div>
      </div>
    `;

    this._renderCharts(data, formasSort, totalReceita, COLORS);

  },

  _renderCharts(data, formasSort, totalReceita, COLORS){

    // ---- Tabela cruzada: Receita × Forma × Semana ----
    // Single-pass O(n): acumula receita por semana+forma em um único forEach
    const allFormas = formasSort.map(([f])=>f);
    const semanaMap = new Map(); // chave: semanaPagamentoStr → { vals, total }
    data.forEach(d => {
      const wk = d.semanaPagamentoStr;
      if(!semanaMap.has(wk)){
        const vals = {}; allFormas.forEach(f => vals[f] = 0);
        semanaMap.set(wk, { label: wk, vals, total: 0 });
      }
      const row = semanaMap.get(wk);
      row.vals[d.formaPagamento] = (row.vals[d.formaPagamento] || 0) + d.valorPago;
      row.total += d.valorPago;
    });
    const matrix = [...semanaMap.values()]
      .filter(r => r.total > 0)
      .sort((a,b) => a.label.localeCompare(b.label));

    const grandTotal = matrix.reduce((s,r)=>s+r.total,0);
    const fmt = v => v===0
      ? '<span style="color:var(--border)">-</span>'
      : 'R$&nbsp;'+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
    const colTotals={};
    allFormas.forEach(f=>{ colTotals[f]=matrix.reduce((s,r)=>s+(r.vals[f]||0),0); });
    const sortedT=matrix.map(r=>r.total).sort((a,b)=>b-a);
    const top1=sortedT[0]||0, top2=sortedT[1]||0;

    document.getElementById('pag-semana-wrap').innerHTML = `
      <div class="table-scroll">
        <table style="width:100%;font-size:12px;border-collapse:collapse;">
          <thead><tr>
            <th style="position:sticky;top:0;left:0;z-index:2;background:var(--panel2);padding:7px 10px;text-align:left;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;">Semana</th>
            ${allFormas.map(f=>`<th style="position:sticky;top:0;background:var(--panel2);padding:7px 8px;text-align:right;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;">${f}</th>`).join('')}
            <th style="position:sticky;top:0;background:var(--panel2);padding:7px 10px;text-align:right;color:var(--accent);border-bottom:2px solid var(--border);">Total</th>
            <th style="position:sticky;top:0;background:var(--panel2);padding:7px 10px;text-align:center;color:var(--accent2);border-bottom:2px solid var(--border);">Part.%</th>
          </tr></thead>
          <tbody>
            ${matrix.map((r,i)=>{
              const pct=grandTotal?((r.total/grandTotal)*100).toFixed(2):'0.00';
              const isTop=r.total===top1||r.total===top2;
              const bg=r.total===top1?'background:rgba(91,140,255,.18);':r.total===top2?'background:rgba(91,140,255,.09);':i%2===0?'background:var(--panel);':'background:var(--panel2);';
              return `<tr style="${bg}">
                <td style="padding:5px 10px;color:var(--accent2);font-weight:600;white-space:nowrap;">${r.label}</td>
                ${allFormas.map(f=>`<td style="padding:5px 8px;text-align:right;">${fmt(r.vals[f]||0)}</td>`).join('')}
                <td style="padding:5px 10px;text-align:right;font-weight:700;color:var(--text);">${fmt(r.total)}</td>
                <td style="padding:5px 10px;text-align:center;font-weight:${isTop?'700':'400'};color:${isTop?'var(--warn)':'var(--muted)'};">${pct}%</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr style="border-top:2px solid var(--border);">
            <td style="padding:7px 10px;font-weight:700;color:var(--text);">Total</td>
            ${allFormas.map(f=>`<td style="padding:7px 8px;text-align:right;font-weight:700;color:var(--text);">${fmt(colTotals[f]||0)}</td>`).join('')}
            <td style="padding:7px 10px;text-align:right;font-weight:700;color:var(--accent);">${fmt(grandTotal)}</td>
            <td style="padding:7px 10px;text-align:center;font-weight:700;color:var(--accent2);">100%</td>
          </tr></tfoot>
        </table>
      </div>`;
  },

  exportarDados(){
    const data = Nexus.filteredData.filter(d => d.isPago);
    const formas = {};
    data.forEach(d=>{
      if(!formas[d.formaPagamento]) formas[d.formaPagamento] = { receita:0, volume:0 };
      formas[d.formaPagamento].receita += d.valorPago;
      formas[d.formaPagamento].volume  += 1;
    });
    const totalReceita = Object.values(formas).reduce((s,f)=>s+f.receita, 0);
    const formasSort = Object.entries(formas).sort((a,b)=>b[1].receita-a[1].receita);

    return {
      titulo: 'Transações',
      kpis: [
        { label:'Receita Total (todas as formas)', valor: 'R$ '+totalReceita.toLocaleString('pt-BR',{minimumFractionDigits:2}) },
        { label:'Formas de Pagamento Distintas', valor: formasSort.length },
      ],
      tabelas: [{
        titulo: 'Receita por Forma de Pagamento',
        colunas: ['Forma de Pagamento', 'Receita', 'Volume', 'Participação %'],
        tiposColuna: ['texto', 'moeda', 'numero', 'percentual'],
        linhas: [
          ...formasSort.map(([forma,f]) => [forma, f.receita, f.volume, totalReceita ? f.receita/totalReceita : 0]),
          ['TOTAL', totalReceita, formasSort.reduce((s,[,f])=>s+f.volume,0), 1],
        ],
      }],
    };
  },
};

/* ======================================================================
   MÓDULO FILIAIS
   Promovido de aba dentro de Configurações para módulo principal
   (primeira posição do menu) em 23/07/2026.

const ModuloFiliais = {
  id: 'filiais',
  nome: 'Filiais',
  icon: '🏢',

  renderFilters(container){ container.innerHTML = ''; },

  async render(el){
    const [{ data: filiais }, { data: supervisores }, { data: gestores }] = await Promise.all([
      supa.from('na_filiais').select('*, tabela_tarifa, tabelas_preco, na_supervisores(id,nome,gestor_id, na_gestores(id,nome))').order('nome'),
      supa.from('na_supervisores').select('id,nome,gestor_id').eq('ativo',true).order('nome'),
      supa.from('na_gestores').select('id,nome').eq('ativo',true).order('nome')
    ]);

    // Cache em memória para uso no modal de tarifas (evita data-tarifa no DOM)
    this._filiaisCache = filiais || [];
    const supsPorGestor = {};
    (supervisores||[]).forEach(s=>{
      if(!supsPorGestor[s.gestor_id]) supsPorGestor[s.gestor_id] = [];
      supsPorGestor[s.gestor_id].push(s);
    });

    el.innerHTML = `
      <div class="panel" style="margin-bottom:14px;">
        <h2>Importar lista de filiais</h2>
        <p style="font-size:13px;color:var(--muted);margin:0 0 12px;">
          Importe qualquer planilha com colunas de <strong>Nome</strong>, <strong>Código</strong>,
          Supervisor, Gestor, Estado, Regional e Status — a ferramenta identifica as colunas automaticamente
          pelo conteúdo do cabeçalho. Cadastra novas filiais, atualiza existentes e marca como
          <strong>encerrada</strong> as que saírem da lista.
        </p>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <input type="file" id="f-import-input" accept=".xlsb,.xlsx,.xls" style="display:none;">
          <button class="btn-primary" id="btn-import-filiais">📂 Importar arquivo de filiais</button>
          <span id="import-msg" style="font-size:12px;color:var(--accent2);"></span>
        </div>
        <div id="import-progress" style="display:none;margin-top:12px;">
          <div style="height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;">
            <div id="import-bar" style="height:100%;width:0%;background:var(--accent);transition:.2s;"></div>
          </div>
          <div id="import-status" style="font-size:12px;color:var(--muted);margin-top:6px;"></div>
        </div>
      </div>

      <div class="panel" style="margin-bottom:14px;">
        <h2>Adicionar filial manualmente</h2>
        <div class="form-grid">
          <div class="form-group"><label>Código da Garagem</label><input id="f-cod" placeholder="ex: 000887"></div>
          <div class="form-group"><label>Nome</label><input id="f-nome" placeholder="Nome da filial"></div>
          <div class="form-group"><label>Estado</label><input id="f-estado" placeholder="RJ"></div>
          <div class="form-group"><label>Regional</label><input id="f-regional" placeholder="ex: Regional Sul"></div>
          <div class="form-group"><label>Gestor</label>
            <select id="f-gestor-sel">
              <option value="">Selecione o gestor</option>
              ${(gestores||[]).map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Supervisor</label>
            <select id="f-sup-sel" disabled>
              <option value="">Selecione o gestor primeiro</option>
            </select>
          </div>
        </div>
        <button class="btn-primary" id="btn-add-filial">+ Adicionar Filial</button>
        <div id="msg-filial" style="font-size:12px;margin-top:8px;min-height:16px;"></div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
          <h2 style="margin:0;">Filiais cadastradas <span style="color:var(--muted);font-size:12px;font-weight:400;">(${(filiais||[]).length})</span></h2>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <select id="filtro-gestor-fil" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;">
              <option value="">Todos os gestores</option>
              ${(gestores||[]).map(g=>`<option value="${g.id}">${esc(g.nome)}</option>`).join('')}
            </select>
            <select id="filtro-sup-fil" style="background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:7px;font-size:12px;">
              <option value="">Todos os supervisores</option>
              ${(supervisores||[]).map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}
            </select>
            <input type="text" id="f-busca" placeholder="Buscar filial..." style="padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;">
            <label style="font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;">
              <input type="checkbox" id="chk-inativos-f" style="margin-right:4px;">Mostrar encerradas
            </label>
          </div>
        </div>
        <div class="table-scroll" style="max-height:440px;">
          <table class="data-table" id="filiais-table">
            <thead><tr><th>Cód.</th><th>Nome</th><th>Estado</th><th>Regional</th><th>Gestor</th><th>Supervisor</th><th>Status</th><th></th></tr></thead>
            <tbody id="filiais-tbody">
              ${this._renderFiliaisRows(filiais||[], '')}
            </tbody>
          </table>
        </div>
      </div>`;

    // Cascading select gestor → supervisor no formulário
    const gestorSel = el.querySelector('#f-gestor-sel');
    const supSel    = el.querySelector('#f-sup-sel');
    gestorSel.onchange = ()=>{
      const gId = gestorSel.value;
      const sups = gId ? (supsPorGestor[gId]||[]) : (supervisores||[]);
      supSel.innerHTML = `<option value="">Selecione o supervisor</option>${sups.map(s=>`<option value="${s.id}">${esc(s.nome)}</option>`).join('')}`;
      supSel.disabled = !gId;
    };

    // Filtros da listagem
    const aplicarFiltros = ()=>{
      const gId  = el.querySelector('#filtro-gestor-fil').value;
      const sId  = el.querySelector('#filtro-sup-fil').value;
      const busca = el.querySelector('#f-busca').value.toLowerCase();
      const inat  = el.querySelector('#chk-inativos-f').checked;
      let lista = filiais||[];
      if(!inat) lista = lista.filter(f=>f.status==='ativa');
      if(gId)   lista = lista.filter(f=>f.na_supervisores?.na_gestores?.id===gId || f.na_supervisores?.gestor_id===gId);
      if(sId)   lista = lista.filter(f=>f.supervisor_id===sId);
      if(busca)  lista = lista.filter(f=>f.nome.toLowerCase().includes(busca));
      el.querySelector('#filiais-tbody').innerHTML = this._renderFiliaisRows(lista, '');
      this._bindFiliaisEvents(el, supervisores||[], gestores||[], supsPorGestor);
    };

    ['#filtro-gestor-fil','#filtro-sup-fil','#f-busca','#chk-inativos-f'].forEach(sel=>{
      el.querySelector(sel).addEventListener('change', aplicarFiltros);
      el.querySelector(sel).addEventListener('input', aplicarFiltros);
    });

    // Importação do arquivo
    el.querySelector('#btn-import-filiais').onclick = ()=> el.querySelector('#f-import-input').click();
    el.querySelector('#f-import-input').onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      await this._importarFiliais(file, el);
    };

    // Adicionar manualmente
    const msgF = el.querySelector('#msg-filial');
    const showMsgF = (txt, ok=false) => {
      msgF.style.color = ok ? 'var(--accent2)' : 'var(--danger)';
      msgF.textContent = txt;
      if(ok) setTimeout(()=>{ msgF.textContent=''; }, 3000);
    };

    el.querySelector('#btn-add-filial').onclick = async ()=>{
      const nome = el.querySelector('#f-nome').value.trim();
      if(!nome) return showMsgF('Nome é obrigatório.');
      const { data, error } = await supa.from('na_filiais').insert({
        codigo_garagem: el.querySelector('#f-cod').value.trim() || null,
        nome, estado: el.querySelector('#f-estado').value.trim(),
        regional: el.querySelector('#f-regional').value.trim() || null,
        supervisor_id: el.querySelector('#f-sup-sel').value || null
      }).select().single();
      if(error) return showMsgF('Erro: '+(error.message.includes('unique')?'Código já cadastrado.':error.message));
      await NexusAuth.log('na_filiais','INSERT',data.id,null,data);
      this.render(el);
    };

    this._bindFiliaisEvents(el, supervisores||[], gestores||[], supsPorGestor);
  },

  _renderFiliaisRows(lista, _){
    if(!lista.length) return '<tr><td colspan="8" style="color:var(--muted)">Nenhuma filial encontrada</td></tr>';
    return lista.map(f=>`
      <tr>
        <td style="font-family:monospace;font-size:12px;">${esc(f.codigo_garagem||"—")}</td>
        <td>${esc(f.nome)}</td>
        <td>${esc(f.estado||"—")}</td>
        <td>${esc(f.regional||"—")}</td>
        <td>${esc(f.na_supervisores?.na_gestores?.nome||'—')}</td>
        <td>${esc(f.na_supervisores?.nome||'—')}</td>
        <td><span class="badge-${f.status}">${f.status.charAt(0).toUpperCase()+f.status.slice(1)}</span></td>
        <td style="white-space:nowrap;display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
          <button class="btn-edit-sm" data-id="${f.id}">Editar</button>
          <button class="btn-tarifa" data-id="${f.id}"
            style="background:none;border:1px solid var(--accent);color:var(--accent);padding:4px 8px;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;">📋 Tabela</button>
        </td>
      </tr>`).join('');
  },

  _bindFiliaisEvents(el, supervisores, gestores, supsPorGestor){
    // Botão Tabela — abre modal de configuração de tarifas
    el.querySelectorAll('.btn-tarifa').forEach(btn=>{
      btn.onclick = ()=>{
        const filial = (this._filiaisCache||[]).find(f=>f.id===btn.dataset.id);
        this._abrirModalTarifa(filial, el);
      };
    });

    // Botão Editar — abre modal dedicada de edição de filial
    el.querySelectorAll('.btn-edit-sm').forEach(btn=>{
      btn.onclick = ()=>{
        const filial = (this._filiaisCache||[]).find(f=>f.id===btn.dataset.id);
        this._abrirModalEditarFilial(filial, el, supervisores, gestores, supsPorGestor);
      };
    });
  },

  // ── MODAL DE EDIÇÃO DE FILIAL ────────────────────────────────────
  _abrirModalEditarFilial(filial, elConfig, supervisores, gestores, supsPorGestor){
    if(!filial) return;

    // Gestor atual da filial (via supervisor vinculado)
    const gestorAtualId = filial.na_supervisores?.na_gestores?.id
      || supervisores.find(s=>s.id===filial.supervisor_id)?.gestor_id
      || '';

    const overlay = document.createElement('div');
    overlay.id = 'modal-editar-filial';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);
    const fechar = () => overlay.remove();

    const optsGestor = () => `<option value="">Selecione o gestor</option>` +
      gestores.map(g=>`<option value="${g.id}" ${g.id===gestorAtualId?'selected':''}>${esc(g.nome)}</option>`).join('');

    const optsSupervisor = (gestorId) => {
      if(!gestorId) return `<option value="">Selecione o gestor primeiro</option>`;
      const sups = supsPorGestor[gestorId] || supervisores.filter(s=>s.gestor_id===gestorId);
      if(!sups.length) return `<option value="">Nenhum supervisor para este gestor</option>`;
      return `<option value="">Selecione o supervisor</option>` +
        sups.map(s=>`<option value="${s.id}" ${s.id===filial.supervisor_id?'selected':''}>${esc(s.nome)}</option>`).join('');
    };

    overlay.innerHTML = `
      <div style="background:var(--panel);border-radius:14px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
          <h2 style="margin:0;font-size:16px;">✏️ Editar Filial</h2>
          <button id="modal-fechar" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;">✕</button>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--muted);">Nome da Filial</label>
          <input type="text" id="f-edit-nome" value="${esc(filial.nome)}"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
        </div>

        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:140px;">
            <label style="font-size:12px;color:var(--muted);">Código do Pátio/Garagem</label>
            <input type="text" id="f-edit-cod" value="${esc(filial.codigo_garagem||'')}"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
          </div>
          <div class="form-group" style="flex:1;min-width:80px;">
            <label style="font-size:12px;color:var(--muted);">Estado / UF</label>
            <input type="text" id="f-edit-estado" value="${esc(filial.estado||'')}" maxlength="2"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;text-transform:uppercase;">
          </div>
        </div>

        <div class="form-group" style="margin-bottom:12px;">
          <label style="font-size:12px;color:var(--muted);">Regional</label>
          <input type="text" id="f-edit-regional" value="${esc(filial.regional||'')}"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
        </div>

        <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:160px;">
            <label style="font-size:12px;color:var(--muted);">Gestor</label>
            <select id="f-edit-gestor"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
              ${optsGestor()}
            </select>
          </div>
          <div class="form-group" style="flex:1;min-width:160px;">
            <label style="font-size:12px;color:var(--muted);">Supervisor</label>
            <select id="f-edit-supervisor"
              style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
              ${optsSupervisor(gestorAtualId)}
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label style="font-size:12px;color:var(--muted);">Status da Filial</label>
          <select id="f-edit-status"
            style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;box-sizing:border-box;">
            <option value="ativa" ${filial.status==='ativa'?'selected':''}>Ativa</option>
            <option value="encerrada" ${filial.status==='encerrada'?'selected':''}>Encerrada</option>
            ${filial.status==='suspensa' ? '<option value="suspensa" selected>Suspensa</option>' : ''}
          </select>
        </div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap;">
          <button id="modal-cancelar" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Cancelar</button>
          <button id="btn-salvar-filial" class="btn-primary" style="padding:9px 24px;">Salvar Alterações</button>
        </div>
        <div id="modal-status" style="font-size:12px;text-align:right;margin-top:8px;min-height:16px;"></div>
      </div>`;

    overlay.querySelector('#modal-fechar').onclick = fechar;
    overlay.querySelector('#modal-cancelar').onclick = fechar;
    overlay.onclick = e => { if(e.target === overlay) fechar(); };

    // Cascata Gestor → Supervisor
    overlay.querySelector('#f-edit-gestor').onchange = (e) => {
      overlay.querySelector('#f-edit-supervisor').innerHTML = optsSupervisor(e.target.value);
    };

    overlay.querySelector('#btn-salvar-filial').onclick = async () => {
      const status = overlay.querySelector('#modal-status');
      const nome = overlay.querySelector('#f-edit-nome').value.trim();
      if(!nome){
        status.style.color = 'var(--danger)';
        status.textContent = 'Informe o nome da filial.';
        return;
      }

      const payload = {
        nome,
        codigo_garagem: overlay.querySelector('#f-edit-cod').value.trim() || null,
        estado: overlay.querySelector('#f-edit-estado').value.trim().toUpperCase() || null,
        regional: overlay.querySelector('#f-edit-regional').value.trim() || null,
        supervisor_id: overlay.querySelector('#f-edit-supervisor').value || null,
        status: overlay.querySelector('#f-edit-status').value,
      };

      status.style.color = 'var(--muted)';
      status.textContent = 'Salvando...';

      const { data, error } = await supa.from('na_filiais').update(payload).eq('id', filial.id).select().single();
      if(error){
        status.style.color = 'var(--danger)';
        status.textContent = 'Erro ao salvar — tente novamente.';
        return;
      }

      await NexusAuth.log('na_filiais','UPDATE',filial.id,null,payload);
      fechar();
      await this.render(elConfig);
    };
  },

  // ── MODAL DE TABELAS DE PREÇO ───────────────────────────────────
  async _abrirModalTarifa(filial, elConfig){
    const nome = esc(filial?.nome) || 'Filial';
    const id   = filial?.id;

    // Migração automática (uma única vez): se ainda não há tabelasPreco mas
    // existe o formato antigo carro/moto, converte e já persiste no novo formato.
    let tabelasPreco = filial?.tabelas_preco || [];
    if((!tabelasPreco || tabelasPreco.length === 0) && filial?.tabela_tarifa && Object.keys(filial.tabela_tarifa).length){
      tabelasPreco = migrarTarifaAntiga(filial.tabela_tarifa);
      if(tabelasPreco.length){
        await supa.from('na_filiais').update({ tabelas_preco: tabelasPreco }).eq('id', id);
        const cached = (this._filiaisCache||[]).find(f=>f.id===id);
        if(cached) cached.tabelas_preco = tabelasPreco;
      }
    }

    const overlay = document.createElement('div');
    overlay.id = 'modal-tarifa';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;';
    document.body.appendChild(overlay);

    const fechar = () => overlay.remove();

    // ---------------- VIEW: LISTA ----------------
    const renderLista = () => {
      const linha = (t, i) => {
        const dias = (t.diasSemana||[]).includes('TODOS') ? 'Todos os dias' : (t.diasSemana||[]).join(', ');
        const cobranca = t.tipoCobranca === 'FIXO'
          ? `Fixo: R$ ${(t.valorFixo||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}`
          : `Progressivo (${(t.faixas||[]).length} faixa${(t.faixas||[]).length===1?'':'s'})`;
        return `
        <div style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:700;font-size:14px;">${esc(t.nome)}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px;">
                ${esc(dias)} · ${esc(t.horarioInicio)}–${esc(t.horarioFim)} · Tolerância ${t.toleranciaMinutos||0}min
              </div>
              <div style="font-size:12px;color:var(--accent2);margin-top:3px;">${esc(cobranca)}</div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0;">
              <button class="btn-edit-sm btn-editar-tabela" data-idx="${i}">Editar</button>
              <button class="btn-edit-sm btn-excluir-tabela" data-idx="${i}" style="border-color:var(--danger);color:var(--danger);">Excluir</button>
            </div>
          </div>
        </div>`;
      };

      overlay.innerHTML = `
        <div style="background:var(--panel);border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.5);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <div>
              <h2 style="margin:0;font-size:16px;">📋 Tabelas de Preço</h2>
              <span style="font-size:12px;color:var(--muted);">${nome}</span>
            </div>
            <button id="modal-fechar" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;">✕</button>
          </div>

          <button id="btn-nova-tabela" class="btn-primary" style="margin-bottom:14px;">+ Nova Tabela de Preço</button>

          <div id="lista-tabelas">
            ${tabelasPreco.length
              ? tabelasPreco.map(linha).join('')
              : `<div style="text-align:center;color:var(--muted);font-size:13px;padding:24px 0;">Nenhuma tabela de preço cadastrada ainda.</div>`}
          </div>

          <div style="display:flex;justify-content:flex-end;margin-top:6px;">
            <button id="modal-cancelar-lista" style="padding:9px 20px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px;">Fechar</button>
          </div>
        </div>`;

      overlay.querySelector('#modal-fechar').onclick = fechar;
      overlay.querySelector('#modal-cancelar-lista').onclick = fechar;
      overlay.onclick = e => { if(e.target === overlay) fechar(); };

      overlay.querySelector('#btn-nova-tabela').onclick = () => renderForm(null);
      overlay.querySelectorAll('.btn-editar-tabela').forEach(btn=>{
        btn.onclick = () => renderForm(parseInt(btn.dataset.idx));
      });
      overlay.querySelectorAll('.btn-excluir-tabela').forEach(btn=>{
        btn.onclick = async () => {
          if(!confirm(`Excluir a tabela "${tabelasPreco[parseInt(btn.dataset.idx)].nome}"?`)) return;
          tabelasPreco.splice(parseInt(btn.dataset.idx), 1);
          await persistir();
          renderLista();
        };
      });
    };

    // ---------------- VIEW: FORMULÁRIO (nova ou edição) ----------------
    const renderForm = (idx) => {
      const editando = idx !== null && idx !== undefined;
      const t = editando ? tabelasPreco[idx] : {
        id: 'tab_'+Date.now().toString(36),
        nome: '', diasSemana: ['TODOS'], horarioInicio: '00:00', horarioFim: '23:59',
        toleranciaMinutos: 0, tipoCobranca: 'PROGRESSIVO', valorFixo: 0,
        tetoDiaria: 0, faixas: [{ateMinutos:60, valor:0}], fracaoMin: 0, fracaoValor: 0
